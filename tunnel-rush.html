<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tunnel Rush</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Orbitron:wght@700;900&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#000;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px 10px 30px;user-select:none;-webkit-user-select:none;font-family:'Orbitron',monospace;overflow-x:hidden;}
h1{font-family:'Cinzel Decorative',serif;font-size:clamp(1rem,5vw,1.8rem);background:linear-gradient(90deg,#ff00ff,#00ffff,#ffff00,#ff00ff);background-size:200%;animation:hshift 2s linear infinite;-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.08em;margin-bottom:6px;margin-top:4px;}
@keyframes hshift{0%{background-position:0%}100%{background-position:200%}}
.scores{display:flex;gap:16px;margin-bottom:8px;}
.score-box{text-align:center;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:3px 14px;}
.score-label{font-size:.5rem;color:rgba(255,255,255,.3);letter-spacing:.12em;text-transform:uppercase}
.score-val{font-size:1.1rem;color:#00ffff;letter-spacing:.05em}
canvas{display:block;border-radius:6px;box-shadow:0 0 50px rgba(255,0,255,.3);cursor:pointer;touch-action:none;}
.hint{font-size:.55rem;color:rgba(255,255,255,.18);margin-top:6px;letter-spacing:.1em;text-transform:uppercase;text-align:center;}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);backdrop-filter:blur(6px);z-index:100;align-items:center;justify-content:center;}
#overlay.show{display:flex}
.ov-box{background:linear-gradient(145deg,#060614,#000);border:2px solid #ff00ff;border-radius:14px;padding:28px 24px;text-align:center;max-width:260px;width:88%;box-shadow:0 0 60px rgba(255,0,255,.35);}
.ov-box h2{font-family:'Cinzel Decorative',serif;font-size:1.3rem;color:#00ffff;margin-bottom:4px}
.ov-box .ov-score{font-size:1.8rem;color:#fff;margin-bottom:4px}
.ov-box p{color:rgba(255,255,255,.35);font-size:.7rem;margin-bottom:16px;letter-spacing:.08em}
.btn{background:linear-gradient(135deg,#1a0033,#001a1a);border:1px solid #ff00ff;border-radius:8px;color:#ff00ff;font-family:'Orbitron',monospace;font-size:.8rem;font-weight:700;padding:11px 28px;cursor:pointer;letter-spacing:.08em;transition:transform .15s;}
.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<h1>TUNNEL RUSH</h1>
<div class="scores">
  <div class="score-box"><div class="score-label">Score</div><div class="score-val" id="el-score">0</div></div>
  <div class="score-box"><div class="score-label">Best</div><div class="score-val" id="el-best">0</div></div>
</div>
<canvas id="cv"></canvas>
<div class="hint">Left / Right arrows or swipe to rotate</div>
<div id="overlay">
  <div class="ov-box">
    <h2 id="ov-title">GAME OVER</h2>
    <div class="ov-score" id="ov-score">0</div>
    <p id="ov-msg">Dodge the tunnel walls!</p>
    <button class="btn" onclick="newGame()">Play Again</button>
  </div>
</div>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H;

const SIDES = 6; // hexagonal tunnel
const TUNNEL_SEGMENTS = 20;
const PLAYER_DIST = 0.15; // fraction from center to player on a "ring"

let tunnelRotation, speed, score, best, gameState, raf;
let obstacles, hueOffset;
let touchStartX = null;

function resize(){
  const avail = Math.min(window.innerWidth - 20, 340);
  W = avail; H = Math.round(W * 1.6);
  cv.width = W; cv.height = H;
}

function makeObstacle(z){
  // A hex ring with one side blocked
  const blockedSide = Math.floor(Math.random() * SIDES);
  const numBlocked = 1 + (z > 300 ? Math.floor(Math.random() * 2) : 0);
  const blocked = new Set();
  for(let i=0;i<numBlocked;i++) blocked.add((blockedSide + i) % SIDES);
  const hue = (hueOffset + z * 0.4) % 360;
  return {z, blocked, hue, passed: false};
}

function newGame(){
  document.getElementById('overlay').classList.remove('show');
  resize();
  tunnelRotation = 0;
  speed = 2.5;
  score = 0;
  hueOffset = 0;
  best = +(localStorage.getItem('tunnelrush_best') || 0);
  gameState = 'playing';
  obstacles = [];
  for(let i=1;i<=TUNNEL_SEGMENTS;i++){
    if(i % 3 === 0) obstacles.push(makeObstacle(i * 60));
  }
  updateHUD();
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
}

function updateHUD(){
  document.getElementById('el-score').textContent = score;
  document.getElementById('el-best').textContent = best;
}

function getHexPoints(cx, cy, radius){
  const pts = [];
  for(let i=0;i<SIDES;i++){
    const angle = (i / SIDES) * Math.PI*2 - Math.PI/2;
    pts.push([cx + Math.cos(angle)*radius, cy + Math.sin(angle)*radius]);
  }
  return pts;
}

function perspProject(x3, y3, z3, fov, cx, cy){
  const scale = fov / (fov + z3);
  return {x: cx + x3*scale, y: cy + y3*scale, scale};
}

let keyLeft = false, keyRight = false;

function loop(){
  raf = requestAnimationFrame(loop);
  hueOffset += 0.5;

  if(gameState === 'playing'){
    // Rotation from keys
    if(keyLeft) tunnelRotation -= 0.04;
    if(keyRight) tunnelRotation += 0.04;

    // Advance
    obstacles.forEach(o => o.z -= speed);
    speed = Math.min(8, 2.5 + score * 0.01);

    // Score
    obstacles.forEach(o => {
      if(!o.passed && o.z < 0){
        o.passed = true; score++;
        updateHUD();
      }
    });

    // Remove off-screen, spawn new
    obstacles = obstacles.filter(o => o.z > -10);
    const maxZ = obstacles.reduce((m,o)=>o.z>m?o.z:m, 0);
    while(obstacles.length < TUNNEL_SEGMENTS / 3){
      const nz = maxZ + 60 + Math.random()*40;
      obstacles.push(makeObstacle(nz));
    }

    // Collision check: player is at z=0, angle 0 offset by tunnelRotation
    // Player occupies a small arc. For simplicity: check the first few obstacles near z < 20
    for(const o of obstacles){
      if(o.z < 25 && o.z > -5){
        // Which side is the player on?
        // Player angle = -tunnelRotation (they're fixed, tunnel rotates)
        const playerAngle = ((-tunnelRotation % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
        const playerSide = Math.floor((playerAngle / (Math.PI*2)) * SIDES) % SIDES;
        if(o.blocked.has(playerSide)){
          die();
          return;
        }
      }
    }
  }

  // Draw
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);

  const fov = 300;
  const cx = W/2, cy = H/2;
  const maxR = Math.max(W, H) * 0.8;

  // Draw tunnel rings from far to near
  const sortedObs = [...obstacles].sort((a,b) => b.z - a.z);

  // Draw tunnel walls (background rings)
  for(let zi=TUNNEL_SEGMENTS;zi>=0;zi--){
    const z = zi * 55;
    const proj = perspProject(0, 0, z, fov, cx, cy);
    const radius = maxR * proj.scale;
    const hue = (hueOffset + zi * 20) % 360;
    const alpha = 0.06 + proj.scale * 0.08;
    ctx.strokeStyle = `hsla(${hue},100%,60%,${alpha})`;
    ctx.lineWidth = 1;
    const pts = getHexPoints(cx, cy, radius);
    for(let j=0;j<SIDES;j++){
      const rot = tunnelRotation;
      const a1 = (j/SIDES)*Math.PI*2 - Math.PI/2 + rot;
      const a2 = ((j+1)/SIDES)*Math.PI*2 - Math.PI/2 + rot;
      const r1x = cx + Math.cos(a1)*radius, r1y = cy + Math.sin(a1)*radius;
      const r2x = cx + Math.cos(a2)*radius, r2y = cy + Math.sin(a2)*radius;
      ctx.beginPath(); ctx.moveTo(r1x,r1y); ctx.lineTo(r2x,r2y); ctx.stroke();
    }
    // Spokes
    for(let j=0;j<SIDES;j++){
      const rot = tunnelRotation;
      const a = (j/SIDES)*Math.PI*2 - Math.PI/2 + rot;
      const ex = cx + Math.cos(a)*radius, ey = cy + Math.sin(a)*radius;
      ctx.strokeStyle = `hsla(${hue},100%,60%,${alpha*0.5})`;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(ex,ey); ctx.stroke();
    }
  }

  // Draw obstacle walls
  sortedObs.forEach(o => {
    if(o.z < 0) return;
    const proj = perspProject(0,0,o.z,fov,cx,cy);
    const proj2 = perspProject(0,0,o.z-20,fov,cx,cy);
    const r1 = maxR * proj.scale;
    const r2 = maxR * proj2.scale;
    const alpha = Math.min(1, 0.3 + proj.scale * 0.8);

    for(let j=0;j<SIDES;j++){
      if(!o.blocked.has(j)) continue;
      const a1 = (j/SIDES)*Math.PI*2 - Math.PI/2 + tunnelRotation;
      const a2 = ((j+1)/SIDES)*Math.PI*2 - Math.PI/2 + tunnelRotation;
      ctx.save();
      ctx.shadowColor = `hsl(${o.hue},100%,60%)`; ctx.shadowBlur = 20;
      ctx.fillStyle = `hsla(${o.hue},100%,55%,${alpha})`;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a1)*r1, cy + Math.sin(a1)*r1);
      ctx.lineTo(cx + Math.cos(a2)*r1, cy + Math.sin(a2)*r1);
      ctx.lineTo(cx + Math.cos(a2)*r2, cy + Math.sin(a2)*r2);
      ctx.lineTo(cx + Math.cos(a1)*r2, cy + Math.sin(a1)*r2);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  });

  // Player indicator
  const playerAngle = -tunnelRotation - Math.PI/2;
  const pr = maxR * 0.18;
  const px = cx + Math.cos(playerAngle) * pr;
  const py = cy + Math.sin(playerAngle) * pr;
  ctx.save();
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 20;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // Score overlay
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.font = `bold ${Math.round(W*.09)}px 'Orbitron',monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText(score, W/2, 14);
}

function die(){
  if(gameState !== 'playing') return;
  gameState = 'dead';
  if(score > best){ best = score; localStorage.setItem('tunnelrush_best', best); updateHUD(); }
  setTimeout(()=>{
    document.getElementById('ov-title').textContent = 'GAME OVER';
    document.getElementById('ov-score').textContent = score;
    document.getElementById('ov-msg').textContent = score >= 20 ? 'Tunnel legend!' : score >= 10 ? 'Nice dodging!' : 'Dodge the walls!';
    document.getElementById('overlay').classList.add('show');
  }, 400);
}

document.addEventListener('keydown', e => {
  if(e.code==='ArrowLeft'){ e.preventDefault(); keyLeft=true; }
  if(e.code==='ArrowRight'){ e.preventDefault(); keyRight=true; }
});
document.addEventListener('keyup', e => {
  if(e.code==='ArrowLeft') keyLeft=false;
  if(e.code==='ArrowRight') keyRight=false;
});

cv.addEventListener('touchstart', e => {
  e.preventDefault();
  touchStartX = e.touches[0].clientX;
}, {passive:false});
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  if(touchStartX === null) return;
  const dx = e.touches[0].clientX - touchStartX;
  tunnelRotation += dx * 0.01;
  touchStartX = e.touches[0].clientX;
}, {passive:false});
cv.addEventListener('touchend', e => { touchStartX = null; }, {passive:false});

window.addEventListener('resize', () => { resize(); });

newGame();
</script>
</body>
</html>
