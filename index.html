      ctx.restore();
    }
  }
  // Sliding tile animation (a 4 tile moving right into a merge)
  const slideX=boardPad+gap+(2*(tileW+gap))+slidePhase*(tileW+gap);
  const slideY=boardPad+gap+(3*(tileH+gap));
  if(slidePhase<.9){
    ctx.save(); ctx.translate(slideX+tileW/2,slideY+tileH/2);
    const sp=1+Math.sin(slidePhase*Math.PI)*.08;
    ctx.scale(sp,sp);
    ctx.fillStyle=tileColors[4].bg;
    ctx.shadowColor='rgba(240,180,60,.5)'; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.roundRect(-tileW/2,-tileH/2,tileW,tileH,5); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle=tileColors[4].text; ctx.font=`bold ${Math.round(tileW*.27)}px sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('4',0,0);
    ctx.restore();
  }
  // Score HUD
  ctx.fillStyle='rgba(50,30,10,.65)'; ctx.font='bold 11px sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(`SCORE: ${Math.floor(f*18)}`, 14, 14);
  ctx.textAlign='right';
  ctx.fillText('BEST', W-14, 8);
  ctx.fillText('16820', W-14, 20);
};

ANIM.dodge = function(ctx,W,H,f){
  bg(ctx,W,H,'#0a0010','#140020');
  // Neon grid floor
  ctx.strokeStyle='rgba(80,0,180,.2)'; ctx.lineWidth=1;
  for(let gx=0;gx<W;gx+=30){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,H); ctx.stroke(); }
  for(let gy=0;gy<H;gy+=30){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); }
  // Danger orbs (spiraling/orbiting)
  const orbCount=6;
  for(let i=0;i<orbCount;i++){
    const speed=.04+i*.005;
    const a=f*speed+i*(Math.PI*2/orbCount);
    const oi=i%3;
    const r=50+oi*25;
    const x=W*.5+Math.cos(a)*r;
    const y=H*.45+Math.sin(a)*r*.7;
    const hue=0+i*20;
    // Outer glow
    ctx.fillStyle=`hsla(${hue},100%,50%,.12)`;
    ctx.beginPath(); ctx.arc(x,y,20,0,Math.PI*2); ctx.fill();
    // Core
    const rg=ctx.createRadialGradient(x-3,y-3,2,x,y,10);
    rg.addColorStop(0,`hsl(${hue+20},100%,80%)`);
    rg.addColorStop(1,`hsl(${hue},100%,40%)`);
    ctx.fillStyle=rg; ctx.shadowColor=`hsl(${hue},100%,55%)`; ctx.shadowBlur=16;
    ctx.beginPath(); ctx.arc(x,y,10,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    // Specular
    ctx.fillStyle='rgba(255,255,255,.4)';
    ctx.beginPath(); ctx.ellipse(x-3,y-3,4,2.5,-.5,0,Math.PI*2); ctx.fill();
    // Trail
    for(let t=1;t<=4;t++){
      const ta=a-t*.04;
      const tx2=W*.5+Math.cos(ta)*r; const ty2=H*.45+Math.sin(ta)*r*.7;
      ctx.fillStyle=`hsla(${hue},100%,55%,${.15-t*.03})`;
      ctx.beginPath(); ctx.arc(tx2,ty2,8-t,0,Math.PI*2); ctx.fill();
    }
  }
  // Player character (center, animated dodge)
  const px=W*.5+Math.sin(f*.07)*W*.12;
  const py=H*.45+Math.cos(f*.05)*H*.08;
  // Player glow
  ctx.shadowColor='rgba(0,220,255,.7)'; ctx.shadowBlur=20;
  const pg=ctx.createRadialGradient(px-3,py-3,2,px,py,13);
  pg.addColorStop(0,'#aaeeff'); pg.addColorStop(1,'#0088cc');
  ctx.fillStyle=pg;
  ctx.beginPath(); ctx.arc(px,py,13,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  // Player face
  ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.beginPath(); ctx.arc(px-4,py-3,3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(px+4,py-3,3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.7)';
  ctx.beginPath(); ctx.arc(px-3.5,py-3,1.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(px+4.5,py-3,1.5,0,Math.PI*2); ctx.fill();
  // Player shield ring
  const shieldA=(f*.03)%(Math.PI*2);
  ctx.strokeStyle='rgba(0,220,255,.35)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(px,py,18,shieldA,shieldA+Math.PI*1.5); ctx.stroke();
  ctx.strokeStyle='rgba(0,220,255,.15)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(px,py,22,-shieldA,-shieldA+Math.PI*1.5); ctx.stroke();
  // HUD
  ctx.fillStyle='rgba(255,100,100,.8)'; ctx.font='bold 11px monospace';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(`ALIVE: ${Math.floor(f*.05)}s`, 10, 8);
  ctx.textAlign='right';
  ctx.fillStyle='rgba(0,220,255,.7)';
  ctx.fillText('HP &#xE2;&#x2122;&#xA5;&#xE2;&#x2122;&#xA5;&#xE2;&#x2122;&#xA5;', W-10, 8);
};

ANIM.asteroidDash = function(ctx,W,H,f){
  bg(ctx,W,H,'#010508','#02080f');
  star(ctx,W,H,f);
  // Distant nebula
  const neg=ctx.createRadialGradient(W*.3,H*.4,0,W*.3,H*.4,120);
  neg.addColorStop(0,'rgba(60,0,100,.12)'); neg.addColorStop(1,'transparent');
  ctx.fillStyle=neg; ctx.fillRect(0,0,W,H);
  // Asteroids: varied sizes, rotating, with craters
  const asteroidDefs=[
    {r:W*.3,a:.02,size:22,rot:.015,offset:0},
    {r:W*.44,a:.014,size:15,rot:-.02,offset:1.2},
    {r:W*.2,a:.03,size:10,rot:.025,offset:2.5},
    {r:W*.38,a:.018,size:18,rot:.012,offset:3.8},
    {r:W*.25,a:.022,size:12,rot:-.018,offset:5.1},
  ];
  asteroidDefs.forEach(({r,a,size,rot,offset})=>{
    const ax=W*.5+Math.cos(f*a+offset)*r;
    const ay=H*.45+Math.sin(f*a*1.3+offset)*(r*.65);
    ctx.save(); ctx.translate(ax,ay); ctx.rotate(f*rot);
    // Irregular asteroid shape (8-point polygon with variance)
    ctx.fillStyle='#6a5a40';
    ctx.beginPath();
    for(let p=0;p<8;p++){
      const pa=(p/8)*Math.PI*2;
      const pr=size*(0.8+Math.sin(p*2.3+offset)*.25);
      p===0?ctx.moveTo(Math.cos(pa)*pr,Math.sin(pa)*pr):ctx.lineTo(Math.cos(pa)*pr,Math.sin(pa)*pr);
    }
    ctx.closePath(); ctx.fill();
    // Surface texture/craters
    ctx.fillStyle='rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.arc(-size*.28,-size*.2,size*.18,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(size*.2,size*.15,size*.12,0,Math.PI*2); ctx.fill();
    // Highlight edge
    ctx.strokeStyle='rgba(180,160,120,.3)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(-size*.2,-size*.2,size*.6,Math.PI*.7,Math.PI*1.4); ctx.stroke();
    ctx.restore();
  });
  // Player ship
  const sx=W*.5+Math.sin(f*.04)*W*.32;
  const sy=H*.8;
  const shipAngle=Math.cos(f*.04)*.15;
  ctx.save(); ctx.translate(sx,sy); ctx.rotate(shipAngle);
  // Engine glow
  const exF=0.6+Math.random()*.4;
  ctx.fillStyle=`rgba(80,160,255,${exF*.6})`;
  ctx.beginPath(); ctx.moveTo(-8,12); ctx.lineTo(0,12+16*exF); ctx.lineTo(8,12); ctx.fill();
  ctx.fillStyle=`rgba(200,240,255,${exF*.4})`;
  ctx.beginPath(); ctx.moveTo(-4,12); ctx.lineTo(0,12+10*exF); ctx.lineTo(4,12); ctx.fill();
  // Ship body
  ctx.shadowColor='rgba(80,180,255,.6)'; ctx.shadowBlur=16;
  const sg=ctx.createLinearGradient(0,-18,0,12);
  sg.addColorStop(0,'#aaddff'); sg.addColorStop(1,'#1155aa');
  ctx.fillStyle=sg;
  ctx.beginPath(); ctx.moveTo(0,-18); ctx.lineTo(-13,12); ctx.lineTo(13,12); ctx.closePath(); ctx.fill();
  // Wings
  ctx.fillStyle='#2266cc';
  ctx.beginPath(); ctx.moveTo(-13,12); ctx.lineTo(-24,18); ctx.lineTo(-10,12); ctx.fill();
  ctx.beginPath(); ctx.moveTo(13,12); ctx.lineTo(24,18); ctx.lineTo(10,12); ctx.fill();
  // Cockpit
  ctx.fillStyle='rgba(150,220,255,.7)'; ctx.beginPath(); ctx.ellipse(0,-2,5,9,0,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  ctx.restore();
  // Score + speed
  ctx.fillStyle='rgba(100,180,255,.8)'; ctx.font='bold 11px monospace';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(`DASH: ${Math.floor(f*.12)}m`, 10, 8);
  ctx.textAlign='right';
  ctx.fillText(`&#x2605; ${Math.floor(f*.03)}`, W-10, 8);
};

ANIM.colorCatch = function(ctx,W,H,f){
  bg(ctx,W,H,'#050010','#0a0020');
  // Lane separators
  const laneW=W/3;
  ctx.strokeStyle='rgba(255,255,255,.07)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(laneW,0); ctx.lineTo(laneW,H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(laneW*2,0); ctx.lineTo(laneW*2,H); ctx.stroke();
  // Lane glow at bottom
  [0,1,2].forEach(lane=>{
    const lc=ctx.createLinearGradient(0,H*.8,0,H);
    lc.addColorStop(0,'transparent');
    lc.addColorStop(1,`hsla(${lane*120},80%,40%,.12)`);
    ctx.fillStyle=lc; ctx.fillRect(lane*laneW,H*.8,laneW,H*.2);
  });
  // Falling orbs (each lane has orbs of matching color)
  const orbDefs=[
    {lane:0,hue:0,offset:0,speed:1.3},
    {lane:0,hue:0,offset:65,speed:1.0},
    {lane:1,hue:120,offset:20,speed:1.2},
    {lane:1,hue:120,offset:95,speed:.9},
    {lane:2,hue:240,offset:40,speed:1.4},
    {lane:2,hue:240,offset:120,speed:1.1},
  ];
  orbDefs.forEach(({lane,hue,offset,speed})=>{
    const ox=lane*laneW+laneW/2;
    const oy=(offset+f*speed)%(H+30)-15;
    const rg=ctx.createRadialGradient(ox-4,oy-4,2,ox,oy,14);
    rg.addColorStop(0,`hsl(${hue},80%,80%)`);
    rg.addColorStop(1,`hsl(${hue},80%,40%)`);
    ctx.fillStyle=rg; ctx.shadowColor=`hsl(${hue},100%,55%)`; ctx.shadowBlur=18;
    ctx.beginPath(); ctx.arc(ox,oy,14,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.ellipse(ox-4,oy-4,5,3.5,-.6,0,Math.PI*2); ctx.fill();
    // Catch glow near basket
    if(oy>H*.72&&oy<H*.86){
      const ca=(oy-H*.72)/(H*.14);
      ctx.fillStyle=`hsla(${hue},100%,55%,${ca*.3})`;
      ctx.beginPath(); ctx.arc(ox,H*.84,30,0,Math.PI*2); ctx.fill();
    }
  });
  // Catching basket (moves between lanes)
  const activeLane=Math.floor(f/50)%3;
  const bx=activeLane*laneW+laneW/2;
  const by=H*.84;
  const bw=laneW*.7, bh=16;
  // Basket glow
  ctx.shadowColor=`hsl(${activeLane*120},100%,55%)`; ctx.shadowBlur=16;
  const bg2=ctx.createLinearGradient(bx-bw/2,by,bx+bw/2,by+bh);
  bg2.addColorStop(0,`hsl(${activeLane*120},70%,45%)`);
  bg2.addColorStop(1,`hsl(${activeLane*120},70%,25%)`);
  ctx.fillStyle=bg2;
  ctx.beginPath(); ctx.roundRect(bx-bw/2,by,bw,bh,6); ctx.fill();
  ctx.shadowBlur=0;
  // Basket highlight
  ctx.fillStyle='rgba(255,255,255,.2)';
  ctx.beginPath(); ctx.roundRect(bx-bw/2+3,by+2,bw*.4,5,3); ctx.fill();
  // Score
  ctx.fillStyle='rgba(200,180,255,.8)'; ctx.font='bold 11px monospace';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(`CATCH: ${Math.floor(f*.07)}`, 10, 8);
  ctx.textAlign='right';
  ctx.fillText(`CHAIN x${Math.floor(f*.015)%8+1}`, W-10, 8);
};

ANIM.towerStack = function(ctx,W,H,f){
  bg(ctx,W,H,'#050508','#0a0a18');
  // Grid lines
  ctx.strokeStyle='rgba(96,160,255,.03)'; ctx.lineWidth=1;
  for(let y=0;y<H;y+=20){ ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke(); }
  // Board borders
  const bx=W*.07, bw=W*.86;
  ctx.strokeStyle='rgba(96,160,255,.15)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(bx,0); ctx.lineTo(bx,H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx+bw,0); ctx.lineTo(bx+bw,H); ctx.stroke();
  // HUE palette cycling with level
  const hues=[280,220,180,140,60,30,0,320];
  const blockH=18, numStacked=6;
  const groundY=H*.92;
  // Stacked blocks (grow from ground up)
  for(let i=0;i<numStacked;i++){
    const hue=hues[i%hues.length];
    const reduction=i*W*.05;
    const bBlockW=bw-reduction;
    const bBlockX=bx+(bw-bBlockW)/2;
    const by=groundY-i*(blockH+2);
    // Block gradient
    const g=ctx.createLinearGradient(bBlockX,by,bBlockX,by+blockH);
    g.addColorStop(0,`hsl(${hue},80%,62%)`);
    g.addColorStop(1,`hsl(${hue-20},80%,38%)`);
    ctx.fillStyle=g;
    ctx.shadowColor=`hsl(${hue},100%,55%)`; ctx.shadowBlur=(i===numStacked-1)?10:4;
    ctx.beginPath(); ctx.roundRect(bBlockX+1,by+1,bBlockW-2,blockH-2,3); ctx.fill();
    ctx.shadowBlur=0;
    // Shine
    ctx.fillStyle='rgba(255,255,255,.18)';
    ctx.beginPath(); ctx.roundRect(bBlockX+2,by+2,bBlockW*.45,6,2); ctx.fill();
    // Edge
    ctx.strokeStyle=`hsla(${hue+20},80%,70%,.3)`; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(bBlockX+1,by+1,bBlockW-2,blockH-2,3); ctx.stroke();
  }
  // Moving block
  const topHue=hues[numStacked%hues.length];
  const topReduction=numStacked*W*.05;
  const topW=bw-topReduction;
  const moveSpeed=3+numStacked*.2;
  const moveX=bx+((f*moveSpeed)%(bw+topW+20))-topW*.5;
  const moveY=groundY-numStacked*(blockH+2)-blockH*2;
  const mg=ctx.createLinearGradient(moveX,moveY,moveX,moveY+blockH);
  mg.addColorStop(0,`hsl(${topHue},90%,70%)`);
  mg.addColorStop(1,`hsl(${topHue},80%,45%)`);
  ctx.fillStyle=mg;
  ctx.shadowColor=`hsl(${topHue},100%,60%)`; ctx.shadowBlur=14;
  ctx.beginPath(); ctx.roundRect(moveX,moveY,topW,blockH,3); ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,.25)';
  ctx.beginPath(); ctx.roundRect(moveX+2,moveY+2,topW*.4,5,2); ctx.fill();
  // Guide dashes from top of stack
  const topBlockX=bx+(bw-(bw-topReduction))/2;
  ctx.strokeStyle='rgba(255,255,255,.07)'; ctx.lineWidth=1; ctx.setLineDash([3,5]);
  ctx.beginPath(); ctx.moveTo(topBlockX,groundY-numStacked*(blockH+2)); ctx.lineTo(topBlockX,moveY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(topBlockX+(bw-topReduction),groundY-numStacked*(blockH+2)); ctx.lineTo(topBlockX+(bw-topReduction),moveY); ctx.stroke();
  ctx.setLineDash([]);
  // Level + score HUD
  ctx.fillStyle='rgba(200,160,255,.85)'; ctx.font='bold 10px monospace'; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(`LVL ${numStacked}`, 10, 8);
  ctx.textAlign='right';
  ctx.fillText(`${Math.floor(f*.12)*10}`, W-10, 8);
};

ANIM.gravityFlip = function(ctx,W,H,f){
  bg(ctx,W,H,'#000a14','#001828');
  // Animated scanlines
  for(let y=0;y<H;y+=8){ ctx.fillStyle='rgba(0,0,0,.12)'; ctx.fillRect(0,y,W,4); }
  const flipCycle=140;
  const phase=(f%flipCycle)/flipCycle;
  const flipped=Math.floor(f/flipCycle)%2===1;
  // Gravity transition effect
  const flipPulse=phase<.1?phase/.1:phase>.9?1-(phase-.9)/.1:1;
  if(flipPulse>.1){
    ctx.fillStyle=`rgba(100,200,255,${flipPulse*.12})`;
    ctx.fillRect(0,0,W,H);
  }
  // Floor/ceiling
  const floorHue=flipped?200:120;
  const floor1G=ctx.createLinearGradient(0,H*.9,0,H);
  floor1G.addColorStop(0,`hsla(${floorHue},70%,25%,.9)`);
  floor1G.addColorStop(1,`hsla(${floorHue},70%,15%,.9)`);
  ctx.fillStyle=floor1G; ctx.fillRect(0,H*.9,W,H*.1);
  ctx.shadowColor=`hsl(${floorHue},100%,50%)`; ctx.shadowBlur=10;
  ctx.strokeStyle=`hsl(${floorHue},100%,55%)`; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,H*.9); ctx.lineTo(W,H*.9); ctx.stroke(); ctx.shadowBlur=0;
  // Ceiling
  const ceil1G=ctx.createLinearGradient(0,0,0,H*.1);
  ceil1G.addColorStop(0,`hsla(${floorHue},70%,15%,.9)`);
  ceil1G.addColorStop(1,`hsla(${floorHue},70%,25%,.9)`);
  ctx.fillStyle=ceil1G; ctx.fillRect(0,0,W,H*.1);
  ctx.strokeStyle=`hsl(${floorHue},100%,55%)`; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,H*.1); ctx.lineTo(W,H*.1); ctx.stroke();
  // Spikes on floor and ceiling
  const spikeSide=flipped?'ceil':'floor';
  [[0],[1]].forEach(([side])=>{
    const sy=side===0?H*.9:H*.1;
    const dir=side===0?1:-1;
    for(let i=0;i<9;i++){
      const sx=i*(W/9)+W/18;
      ctx.fillStyle=side===0?`hsl(${floorHue},90%,55%,0.6)`:
                             `hsl(${floorHue},90%,55%,0.6)`;
      ctx.beginPath(); ctx.moveTo(sx-8,sy); ctx.lineTo(sx,sy+dir*16); ctx.lineTo(sx+8,sy); ctx.closePath(); ctx.fill();
    }
  });
  // Obstacles (floating platforms)
  for(let i=0;i<3;i++){
    const ox=(i*W*.35+f*1.5)%(W+80)-40;
    const oy=H*.35+i*H*.08;
    const og=ctx.createLinearGradient(ox,oy,ox+60,oy+10);
    og.addColorStop(0,'rgba(60,180,255,.6)'); og.addColorStop(1,'rgba(30,100,180,.6)');
    ctx.fillStyle=og; ctx.shadowColor='rgba(60,180,255,.4)'; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.roundRect(ox,oy,60,10,4); ctx.fill(); ctx.shadowBlur=0;
  }
  // Player character
  const px=W*.38;
  const baseY=flipped?H*.78:H*.8;
  const py=baseY+Math.sin(f*.08)*6*(flipped?-1:1);
  const scale=flipped?-1:1;
  ctx.save(); ctx.translate(px,py); ctx.scale(1,scale);
  // Body
  const bodyG=ctx.createRadialGradient(-2,-4,2,0,0,14);
  bodyG.addColorStop(0,'#44aaff'); bodyG.addColorStop(1,'#1155aa');
  ctx.fillStyle=bodyG; ctx.shadowColor='#44aaff'; ctx.shadowBlur=16;
  ctx.beginPath(); ctx.roundRect(-11,-16,22,22,6); ctx.fill(); ctx.shadowBlur=0;
  // Eyes
  const eyePhase=flipped?-1:1;
  ctx.fillStyle='white'; ctx.beginPath(); ctx.ellipse(-4,-8,4,5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='white'; ctx.beginPath(); ctx.ellipse(4,-8,4,5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#002266';
  ctx.beginPath(); ctx.arc(-3,-7,2.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5,-7,2.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='white'; // shine
  ctx.beginPath(); ctx.arc(-4,-8,1,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4,-8,1,0,Math.PI*2); ctx.fill();
  // Flip arrow indicator
  if(flipPulse>.5){
    ctx.strokeStyle=`rgba(100,255,255,${flipPulse*.8})`; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(-6,scale>0?-20:8); ctx.lineTo(0,scale>0?-28:16); ctx.lineTo(6,scale>0?-20:8); ctx.stroke();
  }
  ctx.restore();
  // HUD
  ctx.fillStyle='rgba(100,220,255,.85)'; ctx.font='bold 10px monospace'; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(`FLIPS: ${Math.floor(f/flipCycle)}`, 10, 14);
  ctx.textAlign='right';
  ctx.fillText(`${Math.floor(f*.08)*5}`, W-10, 14);
};

ANIM.stackDrop = function(ctx,W,H,f){
  bg(ctx,W,H,'#06040e','#0d0820');
  star(ctx,W,H,f);
  // Ground platform
  const groundG=ctx.createLinearGradient(0,H*.92,0,H);
  groundG.addColorStop(0,'#2a1a4a'); groundG.addColorStop(1,'#180d2e');
  ctx.fillStyle=groundG; ctx.fillRect(0,H*.92,W,H*.08);
  ctx.strokeStyle='rgba(160,100,255,.4)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,H*.92); ctx.lineTo(W,H*.92); ctx.stroke();
  // Stacked blocks (3 layers, narrowing)
  const stackDefs=[
    {w:W*.82,hue:260,y:H*.92-20},
    {w:W*.66,hue:280,y:H*.92-42},
    {w:W*.50,hue:300,y:H*.92-64},
  ];
  stackDefs.forEach(({w,hue,y})=>{
    const sx=(W-w)/2;
    const sg=ctx.createLinearGradient(sx,y,sx+w,y+18);
    sg.addColorStop(0,`hsl(${hue},75%,55%)`); sg.addColorStop(1,`hsl(${hue},75%,30%)`);
    ctx.fillStyle=sg; ctx.shadowColor=`hsl(${hue},100%,60%)`; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.roundRect(sx+1,y+1,w-2,17,4); ctx.fill(); ctx.shadowBlur=0;
    // Shine
    ctx.fillStyle='rgba(255,255,255,.18)';
    ctx.beginPath(); ctx.roundRect(sx+3,y+2,w*.35,6,3); ctx.fill();
    // Edge highlight
    ctx.strokeStyle=`hsla(${hue+30},90%,70%,.25)`; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(sx+1,y+1,w-2,17,4); ctx.stroke();
  });
  // Moving platform (swings back and forth)
  const platW=W*.48;
  const platX=W*.5+Math.sin(f*.04)*(W*.24)-platW/2;
  const platY=H*.25;
  const platG=ctx.createLinearGradient(platX,platY,platX+platW,platY+14);
  platG.addColorStop(0,'hsl(190,80%,55%)'); platG.addColorStop(1,'hsl(190,80%,30%)');
  ctx.fillStyle=platG; ctx.shadowColor='hsl(190,100%,55%)'; ctx.shadowBlur=12;
  ctx.beginPath(); ctx.roundRect(platX,platY,platW,14,5); ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,.22)';
  ctx.beginPath(); ctx.roundRect(platX+3,platY+2,platW*.3,5,3); ctx.fill();
  // Dropping block
  const dropCycle=90;
  const dropPhase=(f%dropCycle)/dropCycle;
  const dropHue=200+Math.floor(f/dropCycle)*25;
  const dropW=W*.44;
  const dropX=platX+(platW-dropW)/2;
  const dropY=platY+14+dropPhase*(H*.92-64-(platY+14)-20);
  const dg=ctx.createLinearGradient(dropX,dropY,dropX+dropW,dropY+18);
  dg.addColorStop(0,`hsl(${dropHue},85%,65%)`); dg.addColorStop(1,`hsl(${dropHue},85%,35%)`);
  ctx.fillStyle=dg; ctx.shadowColor=`hsl(${dropHue},100%,55%)`; ctx.shadowBlur=14;
  ctx.beginPath(); ctx.roundRect(dropX,dropY,dropW,18,4); ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,.25)';
  ctx.beginPath(); ctx.roundRect(dropX+3,dropY+2,dropW*.4,6,3); ctx.fill();
  // Drop shadow below falling block
  const shadowA=(dropY/(H*.7))*.3;
  ctx.fillStyle=`rgba(100,50,200,${shadowA})`;
  ctx.beginPath(); ctx.ellipse(dropX+dropW/2,H*.92-64,dropW*.4,8,0,0,Math.PI*2); ctx.fill();
  // Score HUD
  ctx.fillStyle='rgba(180,120,255,.9)'; ctx.font='bold 10px monospace'; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(`STACK: ${Math.floor(f*.06)+3}`, 10, 8);
  ctx.textAlign='right';
  ctx.fillText(`${Math.floor(f*.1)*10}`, W-10, 8);
};

ANIM.frogger = function(ctx,W,H,f){
  // Sky zone (safe)
  const skyG=ctx.createLinearGradient(0,0,0,H*.12);
  skyG.addColorStop(0,'#1a3d1a'); skyG.addColorStop(1,'#2a5a2a');
  ctx.fillStyle=skyG; ctx.fillRect(0,0,W,H*.12);
  // Road zone (cars)
  const roadG=ctx.createLinearGradient(0,H*.12,0,H*.52);
  roadG.addColorStop(0,'#1a1a1a'); roadG.addColorStop(1,'#2a2a2a');
  ctx.fillStyle=roadG; ctx.fillRect(0,H*.12,W,H*.4);
  // Road markings
  ctx.strokeStyle='rgba(255,230,0,.4)'; ctx.lineWidth=2; ctx.setLineDash([12,10]);
  [H*.22,H*.32,H*.42].forEach(y=>{ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); });
  ctx.setLineDash([]);
  // Safe grass median
  ctx.fillStyle='#2a5a2a'; ctx.fillRect(0,H*.52,W,H*.08);
  // Water zone (logs)
  const waterG=ctx.createLinearGradient(0,H*.6,0,H*.9);
  waterG.addColorStop(0,'#0a3080'); waterG.addColorStop(1,'#0a2050');
  ctx.fillStyle=waterG; ctx.fillRect(0,H*.6,W,H*.3);
  // Water ripples
  for(let i=0;i<5;i++){
    const wy=H*.65+i*H*.05;
    ctx.strokeStyle=`rgba(100,160,255,${.08+i*.015})`; ctx.lineWidth=1; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo((f*.8+i*30)%W-20,wy); ctx.bezierCurveTo((f*.8+i*30)%W+10,wy-3,(f*.8+i*30)%W+30,wy+3,(f*.8+i*30)%W+50,wy); ctx.stroke();
  }
  // Safe ground
  const groundG=ctx.createLinearGradient(0,H*.9,0,H);
  groundG.addColorStop(0,'#2a5a2a'); groundG.addColorStop(1,'#1a3d1a');
  ctx.fillStyle=groundG; ctx.fillRect(0,H*.9,W,H*.1);
  // Logs
  [[0,2.0],[H*.07,1.5],[H*.14,2.5]].forEach(([offset,speed],i)=>{
    const lx=((f*speed+i*90)%(W+100))-30;
    const ly=H*.62+i*H*.09;
    // Log body
    const lg=ctx.createLinearGradient(lx,ly,lx+90,ly+16);
    lg.addColorStop(0,'#8B5E3C'); lg.addColorStop(.5,'#A0714F'); lg.addColorStop(1,'#6B4423');
    ctx.fillStyle=lg; ctx.shadowColor='rgba(100,60,20,.3)'; ctx.shadowBlur=4;
    ctx.beginPath(); ctx.roundRect(lx,ly,90,16,8); ctx.fill(); ctx.shadowBlur=0;
    // Log grain lines
    ctx.strokeStyle='rgba(80,40,10,.4)'; ctx.lineWidth=1;
    for(let g=0;g<3;g++){ ctx.beginPath(); ctx.moveTo(lx+10+g*25,ly+2); ctx.lineTo(lx+10+g*25,ly+14); ctx.stroke(); }
    // End caps
    ctx.fillStyle='#5C3D1E'; ctx.beginPath(); ctx.ellipse(lx+5,ly+8,5,8,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(lx+85,ly+8,5,8,0,0,Math.PI*2); ctx.fill();
  });
  // Cars
  const carDefs=[
    {offset:0,speed:2.8,lane:H*.15,hue:0,len:50},
    {offset:120,speed:-2.0,lane:H*.25,hue:200,len:60},
    {offset:60,speed:3.2,lane:H*.35,hue:30,len:44},
    {offset:200,speed:-1.6,lane:H*.45,hue:120,len:55},
  ];
  carDefs.forEach(({offset,speed,lane,hue,len})=>{
    const cx=speed>0?((f*Math.abs(speed)+offset)%(W+len+20))-len:(W-(f*Math.abs(speed)+offset)%(W+len+20));
    const cy=lane;
    const cg=ctx.createLinearGradient(cx,cy,cx+len,cy+18);
    cg.addColorStop(0,`hsl(${hue},70%,50%)`); cg.addColorStop(1,`hsl(${hue},70%,30%)`);
    ctx.fillStyle=cg; ctx.shadowColor=`hsl(${hue},100%,55%)`; ctx.shadowBlur=6;
    ctx.beginPath(); ctx.roundRect(cx,cy+2,len,14,4); ctx.fill(); ctx.shadowBlur=0;
    // Windshield
    ctx.fillStyle='rgba(180,220,255,.5)';
    ctx.beginPath(); ctx.roundRect(cx+len*.28,cy+3,len*.35,8,2); ctx.fill();
    // Headlights
    const hlSide=speed>0?cx+len-4:cx+2;
    ctx.fillStyle=`rgba(255,240,180,.9)`; ctx.shadowColor='rgba(255,240,100,.8)'; ctx.shadowBlur=6;
    ctx.beginPath(); ctx.arc(hlSide,cy+6,3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(hlSide,cy+14,3,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    // Wheels
    ctx.fillStyle='#111';
    ctx.beginPath(); ctx.arc(cx+10,cy+16,4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+len-10,cy+16,4,0,Math.PI*2); ctx.fill();
  });
  // Frog
  const frogLane=Math.floor(f/50)%7;
  const frogLaneY=[H*.93,H*.82,H*.74,H*.66,H*.54,H*.44,H*.34,H*.14];
  const fy=frogLaneY[Math.min(frogLane,frogLaneY.length-1)];
  const frogHop=(f%50)/50<.3?Math.sin((f%50)/50*Math.PI/.3)*8:0;
  const fx=W*.45+Math.sin(f*.02)*W*.05;
  ctx.save(); ctx.translate(fx,fy-frogHop);
  // Body
  const fbg=ctx.createRadialGradient(-2,-2,2,0,0,13);
  fbg.addColorStop(0,'#66dd44'); fbg.addColorStop(1,'#2a8a1a');
  ctx.fillStyle=fbg; ctx.shadowColor='#44cc22'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.ellipse(0,0,13,10,0,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  // Spots
  ctx.fillStyle='rgba(0,100,0,.4)';
  ctx.beginPath(); ctx.arc(-3,2,4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5,-1,3,0,Math.PI*2); ctx.fill();
  // Eyes (on top)
  [[{ex:-7,ey:-7},{ex:7,ey:-7}]].flat().forEach(({ex,ey})=>{
    ctx.fillStyle='#44ee22'; ctx.beginPath(); ctx.arc(ex,ey,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(ex+1,ey,2.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(ex,ey-1,1,0,Math.PI*2); ctx.fill();
  });
  // Legs
  ctx.strokeStyle='#2a8a1a'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(-13,2); ctx.lineTo(-18,8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(13,2); ctx.lineTo(18,8); ctx.stroke();
  ctx.restore();
  // Score
  ctx.fillStyle='rgba(100,255,80,.9)'; ctx.font='bold 10px monospace'; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(`SCORE: ${frogLane*100}`, 10, 8);
};

ANIM.pianoTiles = function(ctx,W,H,f){
  bg(ctx,W,H,'#080808','#101010');
  const cols=4, cw=W/cols;
  // Column separators
  for(let c=0;c<=cols;c++){
    ctx.strokeStyle='rgba(255,255,255,.06)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(c*cw,0); ctx.lineTo(c*cw,H); ctx.stroke();
  }
  // Piano keys strip at bottom
  const keyH=H*.14;
  const whiteH=keyH, blackH=keyH*.6;
  const whiteCount=cols*2;
  const ww=W/whiteCount;
  for(let k=0;k<whiteCount;k++){
    ctx.fillStyle='rgba(255,255,255,.92)';
    ctx.beginPath(); ctx.roundRect(k*ww+1,H-whiteH,ww-2,whiteH-2,3); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.2)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(k*ww+1,H-whiteH,ww-2,whiteH-2,3); ctx.stroke();
  }
  // Black keys
  const blackPattern=[1,1,0,1,1,1,0]; // positions of black keys
  let bk=0;
  for(let k=0;k<whiteCount-1;k++){
    if(blackPattern[k%7]){
      ctx.fillStyle='rgba(10,10,20,.95)';
      ctx.beginPath(); ctx.roundRect(k*ww+ww*.6,H-whiteH,ww*.8,blackH,2); ctx.fill();
      ctx.fillStyle='rgba(50,50,80,.8)';
      ctx.beginPath(); ctx.roundRect(k*ww+ww*.62,H-whiteH,ww*.76,blackH*.4,2); ctx.fill();
    }
  }
  // Falling tiles
  const tileDefs=[
    {col:0,offset:0,speed:4.5},
    {col:2,offset:55,speed:4.0},
    {col:1,offset:110,speed:5.0},
    {col:3,offset:30,speed:4.2},
    {col:0,offset:170,speed:4.8},
    {col:3,offset:85,speed:3.8},
    {col:2,offset:140,speed:4.5},
  ];
  tileDefs.forEach(({col,offset,speed})=>{
    const ty=(offset+f*speed)%(H+80+80)-80;
    const tx=col*cw+2;
    const tileH=70;
    // Tile body
    const isActive=ty>H-whiteH-tileH-10&&ty<H-whiteH+10;
    const tg=ctx.createLinearGradient(tx,ty,tx,ty+tileH);
    tg.addColorStop(0,isActive?'rgba(100,80,255,.95)':'rgba(0,0,0,.92)');
    tg.addColorStop(1,isActive?'rgba(50,30,180,.95)':'rgba(20,20,20,.92)');
    ctx.fillStyle=tg;
    if(isActive){ ctx.shadowColor='rgba(120,100,255,.8)'; ctx.shadowBlur=18; }
    ctx.beginPath(); ctx.roundRect(tx,ty,cw-4,tileH,4); ctx.fill();
    ctx.shadowBlur=0;
    // Tile border/shine
    ctx.strokeStyle=isActive?'rgba(160,140,255,.6)':'rgba(80,80,80,.3)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(tx,ty,cw-4,tileH,4); ctx.stroke();
    // Inner shine
    ctx.fillStyle=isActive?'rgba(200,180,255,.2)':'rgba(100,100,100,.08)';
    ctx.beginPath(); ctx.roundRect(tx+3,ty+3,cw-10,tileH*.3,3); ctx.fill();
    // Note tap flash
    if(isActive){
      ctx.fillStyle='rgba(200,160,255,.35)';
      ctx.beginPath(); ctx.roundRect(0,H-whiteH-5,W,5+whiteH,0); ctx.fill();
      // Note particle
      ctx.fillStyle='rgba(220,200,255,.7)'; ctx.font='bold 12px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      const notes=['&#xE2;&#x2122;&#xA9;','&#xE2;&#x2122;&#xAA;','&#xE2;&#x2122;&#xAB;','&#xE2;&#x2122;&#xAC;'];
      ctx.fillText(notes[col], tx+cw/2, H-whiteH-20);
    }
  });
  // Score + combo
  ctx.fillStyle='rgba(200,160,255,.85)'; ctx.font='bold 10px monospace'; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(`SCORE: ${Math.floor(f*.2)*50}`, 10, 8);
  ctx.textAlign='right';
  ctx.fillText(`COMBO x${Math.floor(f*.03)%10+1}`, W-10, 8);
};

ANIM.fruitSlicer = function(ctx,W,H,f){
  bg(ctx,W,H,'#0d0005','#1a000a');
  star(ctx,W,H,f);
  // Fruit definitions: each follows a parabolic arc
  const fruitDefs=[
    {col:W*.22,hue:120,type:'watermelon',offset:0,speed:.055,amp:H*.55},
    {col:W*.5,hue:30,type:'orange',offset:40,speed:.048,amp:H*.5},
    {col:W*.75,hue:0,type:'apple',offset:80,speed:.062,amp:H*.52},
    {col:W*.35,hue:60,type:'banana',offset:120,speed:.05,amp:H*.48},
    {col:W*.62,hue:300,type:'plum',offset:160,speed:.057,amp:H*.53},
  ];
  fruitDefs.forEach(({col,hue,type,offset,speed,amp})=>{
    const t=((f+offset)*speed)%(Math.PI);
    const fy=H+10-Math.sin(t)*amp;
    const fx=col+Math.sin(t*.7+offset)*(W*.06);
    const sliced=(f+offset)%120>60&&(f+offset)%120<90;
    if(sliced){
      // Juice splatter
      for(let p=0;p<6;p++){
        const pa=(p/6)*Math.PI*2;
        const pr=12+p*4;
        ctx.fillStyle=`hsla(${hue},80%,55%,${.4-p*.05})`;
        ctx.beginPath(); ctx.arc(fx+Math.cos(pa)*pr,fy+Math.sin(pa)*pr*.5,3,0,Math.PI*2); ctx.fill();
      }
    }
    // Draw fruit by type
    ctx.save(); ctx.translate(fx,fy);
    if(type==='watermelon'){
      // Watermelon slice (half circle)
      const wg=ctx.createRadialGradient(-2,-2,2,0,0,16);
      wg.addColorStop(0,'#ff4466'); wg.addColorStop(.75,'#cc2244'); wg.addColorStop(1,'#1a7a1a');
      ctx.fillStyle=wg; ctx.shadowColor='#ff4466'; ctx.shadowBlur=12;
      ctx.beginPath(); ctx.arc(0,0,16,Math.PI,0); ctx.closePath(); ctx.fill(); ctx.shadowBlur=0;
      // Rind
      ctx.strokeStyle='#2a9a2a'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(0,0,16,Math.PI,0); ctx.stroke();
      // Seeds
      ctx.fillStyle='#1a0a0a';
      [[-6,0],[-2,-4],[4,-2],[7,3]].forEach(([sx,sy])=>{
        ctx.beginPath(); ctx.ellipse(sx,sy,2,1.2,.4,0,Math.PI*2); ctx.fill();
      });
    } else if(type==='orange'){
      const og=ctx.createRadialGradient(-3,-3,2,0,0,15);
      og.addColorStop(0,'#ffcc44'); og.addColorStop(1,'#ee7700');
      ctx.fillStyle=og; ctx.shadowColor='#ff9900'; ctx.shadowBlur=10;
      ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
      // Segments
      ctx.strokeStyle='rgba(200,100,0,.3)'; ctx.lineWidth=1;
      for(let s=0;s<6;s++){
        const sa=s/6*Math.PI*2;
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(sa)*14,Math.sin(sa)*14); ctx.stroke();
      }
      // Navel
      ctx.fillStyle='rgba(180,80,0,.4)'; ctx.beginPath(); ctx.arc(0,0,3,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.25)'; ctx.beginPath(); ctx.ellipse(-4,-4,4,3,-.5,0,Math.PI*2); ctx.fill();
    } else if(type==='apple'){
      const ag=ctx.createRadialGradient(-3,-3,2,0,0,14);
      ag.addColorStop(0,'#ff5544'); ag.addColorStop(1,'#cc1100');
      ctx.fillStyle=ag; ctx.shadowColor='#ff3322'; ctx.shadowBlur=10;
      ctx.beginPath(); ctx.arc(0,2,14,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
      // Indent top
      ctx.fillStyle='rgba(150,0,0,.4)'; ctx.beginPath(); ctx.arc(0,-10,4,0,Math.PI*2); ctx.fill();
      // Stem
      ctx.strokeStyle='#5a3010'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(0,-12); ctx.quadraticCurveTo(5,-18,4,-22); ctx.stroke();
      // Leaf
      ctx.fillStyle='#44aa22';
      ctx.beginPath(); ctx.ellipse(6,-19,6,3,.5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.2)'; ctx.beginPath(); ctx.ellipse(-4,-3,4,6,-.3,0,Math.PI*2); ctx.fill();
    } else if(type==='banana'){
      // Banana arc
      ctx.strokeStyle='#ffdd22'; ctx.lineWidth=10; ctx.lineCap='round';
      ctx.shadowColor='#ddaa00'; ctx.shadowBlur=8;
      ctx.beginPath(); ctx.arc(0,5,12,.2,Math.PI-.2); ctx.stroke(); ctx.shadowBlur=0;
      ctx.strokeStyle='rgba(255,255,255,.2)'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(0,5,10,.4,Math.PI-.4); ctx.stroke();
    } else {
      // Plum
      const pg=ctx.createRadialGradient(-3,-3,2,0,0,13);
      pg.addColorStop(0,'#dd66ee'); pg.addColorStop(1,'#660099');
      ctx.fillStyle=pg; ctx.shadowColor='#cc44ff'; ctx.shadowBlur=10;
      ctx.beginPath(); ctx.arc(0,0,13,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
      ctx.strokeStyle='rgba(180,100,220,.4)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(0,12); ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.2)'; ctx.beginPath(); ctx.ellipse(-4,-4,3,4,-.5,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  });
  // Slash effect
  const slashCycle=100;
  const slashPhase=f%slashCycle;
  if(slashPhase<28){
    const sp=slashPhase/28;
    const sx1=W*.12+sp*W*.3, sy1=H*.35+sp*H*.15;
    const sx2=W*.55+sp*W*.35, sy2=H*.5-sp*H*.12;
    ctx.strokeStyle=`rgba(255,255,255,${.9*(1-sp)})`; ctx.lineWidth=3+sp*2; ctx.lineCap='round';
    ctx.shadowColor='rgba(255,255,255,.8)'; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.moveTo(sx1,sy1); ctx.lineTo(sx2,sy2); ctx.stroke(); ctx.shadowBlur=0;
    // Slash highlight
    ctx.strokeStyle=`rgba(255,220,100,${.5*(1-sp)})`; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(sx1-2,sy1+2); ctx.lineTo(sx2-2,sy2+2); ctx.stroke();
  }
  // HUD
  ctx.fillStyle='rgba(255,180,80,.9)'; ctx.font='bold 10px monospace'; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(`SLICED: ${Math.floor(f*.07)}`, 10, 8);
  ctx.textAlign='right';
  ctx.fillText(`COMBO x${Math.floor(f*.02)%6+1}`, W-10, 8);
};

ANIM.jetpack = function(ctx,W,H,f){
  bg(ctx,W,H,'#000a14','#001a28');
  star(ctx,W,H,f);
  // Clouds scrolling
  [[W*.2,H*.2,60],[W*.65,H*.35,80],[W*.45,H*.12,100]].forEach(([cx,cy,cw],i)=>{
    const cloudX=((cx-f*(0.4+i*.15)+W*2)%(W+cw+40))-cw/2;
    ctx.fillStyle='rgba(180,220,255,.1)'; ctx.shadowColor='rgba(180,220,255,.08)'; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.ellipse(cloudX,cy,cw/2,18,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cloudX-cw*.25,cy+8,cw*.3,13,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cloudX+cw*.3,cy+5,cw*.28,12,0,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  });
  // Ground
  const groundG=ctx.createLinearGradient(0,H*.88,0,H);
  groundG.addColorStop(0,'#0a2a0a'); groundG.addColorStop(1,'#040d04');
  ctx.fillStyle=groundG; ctx.fillRect(0,H*.88,W,H*.12);
  ctx.strokeStyle='rgba(80,180,80,.3)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(0,H*.88); ctx.lineTo(W,H*.88); ctx.stroke();
  // Ground details
  for(let t=0;t<8;t++){
    const tx=((t*55+f*1.8)%(W+30))-15;
    ctx.strokeStyle='rgba(60,140,60,.4)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(tx,H*.88); ctx.lineTo(tx-4,H*.82); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tx,H*.88); ctx.lineTo(tx+5,H*.80); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tx,H*.88); ctx.lineTo(tx,H*.79); ctx.stroke();
  }
  // Player position (bobbing + jet thrust movement)
  const px=W*.32;
  const py=H*.45+Math.sin(f*.07)*H*.28;
  // Jetpack exhaust flames (behind player)
  const flameSize=0.7+Math.sin(f*.2)*.3;
  for(let j=0;j<2;j++){
    const jx=px+(j===0?-6:6), jy=py+22;
    const fg=ctx.createRadialGradient(jx,jy+2,1,jx,jy+8,10*flameSize);
    fg.addColorStop(0,'rgba(255,220,50,1)'); fg.addColorStop(.4,'rgba(255,100,20,.8)'); fg.addColorStop(1,'transparent');
    ctx.fillStyle=fg; ctx.shadowColor='rgba(255,150,0,.6)'; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(jx,jy+8,10*flameSize,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
    // Smoke trail
    for(let s=0;s<4;s++){
      const st=s/4;
      ctx.fillStyle=`rgba(100,120,160,${.12-st*.03})`;
      ctx.beginPath(); ctx.arc(jx+(s*1.5-3),jy+22+s*8,3+s*1.5,0,Math.PI*2); ctx.fill();
    }
  }
  // Player body (astronaut/jetpack hero)
  ctx.save(); ctx.translate(px,py);
  // Jetpack unit
  const jpg=ctx.createLinearGradient(-4,-20,4,-20);
  jpg.addColorStop(0,'#334466'); jpg.addColorStop(1,'#1a2233');
  ctx.fillStyle=jpg; ctx.shadowColor='rgba(100,160,255,.4)'; ctx.shadowBlur=6;
  ctx.beginPath(); ctx.roundRect(-10,-20,8,22,3); ctx.fill();
  ctx.beginPath(); ctx.roundRect(2,-20,8,22,3); ctx.fill();
  ctx.shadowBlur=0;
  // Body
  const bg3=ctx.createRadialGradient(-2,-4,2,0,0,15);
  bg3.addColorStop(0,'#5588ff'); bg3.addColorStop(1,'#1133aa');
  ctx.fillStyle=bg3; ctx.shadowColor='#4488ff'; ctx.shadowBlur=14;
  ctx.beginPath(); ctx.roundRect(-10,-20,20,24,5); ctx.fill(); ctx.shadowBlur=0;
  // Helmet
  const hg=ctx.createRadialGradient(-2,-24,3,0,-20,14);
  hg.addColorStop(0,'#aaccff'); hg.addColorStop(.5,'#5588dd'); hg.addColorStop(1,'#1133aa');
  ctx.fillStyle=hg; ctx.shadowColor='#4488ff'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.arc(0,-20,12,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  // Visor
  ctx.fillStyle='rgba(180,220,255,.4)';
  ctx.beginPath(); ctx.ellipse(1,-21,7,6,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.25)';
  ctx.beginPath(); ctx.ellipse(-1,-23,3,2.5,-.4,0,Math.PI*2); ctx.fill();
  // Arms
  ctx.strokeStyle='#3366cc'; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-10,-10); ctx.lineTo(-18,-4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10,-10); ctx.lineTo(18,-5); ctx.stroke();
  // Legs
  ctx.beginPath(); ctx.moveTo(-5,4); ctx.lineTo(-7,14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(5,4); ctx.lineTo(7,14); ctx.stroke();
  ctx.restore();
  // Obstacle obstacles (pillars)
  for(let p=0;p<2;p++){
    const obs=((f*2.2+p*W*.6)%(W+60))-30;
    const gap=H*.35, gapY=H*.3+Math.sin(f*.03+p)*H*.15;
    // Top pillar
    const topG=ctx.createLinearGradient(obs,0,obs+30,0);
    topG.addColorStop(0,'rgba(60,80,140,.7)'); topG.addColorStop(1,'rgba(30,50,100,.7)');
    ctx.fillStyle=topG; ctx.shadowColor='rgba(100,140,255,.3)'; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.roundRect(obs,0,30,gapY,4); ctx.fill(); ctx.shadowBlur=0;
    // Cap
    ctx.fillStyle='rgba(80,100,180,.8)';
    ctx.beginPath(); ctx.roundRect(obs-3,gapY-8,36,10,4); ctx.fill();
    // Bottom pillar
    ctx.fillStyle=topG; ctx.shadowColor='rgba(100,140,255,.3)'; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.roundRect(obs,gapY+gap,30,H-(gapY+gap),4); ctx.fill(); ctx.shadowBlur=0;
    ctx.fillStyle='rgba(80,100,180,.8)';
    ctx.beginPath(); ctx.roundRect(obs-3,gapY+gap-2,36,10,4); ctx.fill();
  }
  // HUD
  ctx.fillStyle='rgba(100,200,255,.9)'; ctx.font='bold 10px monospace'; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(`ALT: ${Math.round((H-py)/H*100)}m`, 10, 8);
  ctx.textAlign='right';
  ctx.fillText(`${Math.floor(f*.12)*10}`, W-10, 8);
};

ANIM.spinJump = function(ctx,W,H,f){
  bg(ctx,W,H,'#050010','#0d0025');
  star(ctx,W,H,f);
  // Ground platform
  const groundG=ctx.createLinearGradient(0,H*.88,0,H);
  groundG.addColorStop(0,'#1a0a30'); groundG.addColorStop(1,'#0a0518');
  ctx.fillStyle=groundG; ctx.fillRect(0,H*.88,W,H*.12);
  ctx.strokeStyle='rgba(160,100,255,.4)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(0,H*.88); ctx.lineTo(W,H*.88); ctx.stroke();
  // Orbiting rings/pillars
  const ringDefs=[
    {cx:W*.25,hue:260,speed:.032,r:H*.14,offset:0},
    {cx:W*.5,hue:300,speed:.028,r:H*.16,offset:2.1},
    {cx:W*.75,hue:200,speed:.036,r:H*.13,offset:4.2},
  ];
  ringDefs.forEach(({cx,hue,speed,r,offset})=>{
    const angle=f*speed+offset;
    // Orbit ring
    ctx.strokeStyle=`hsla(${hue},70%,50%,.2)`; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(cx,H*.62,r,0,Math.PI*2); ctx.stroke();
    // Orbiting platform
    const px=cx+Math.cos(angle)*r;
    const py=H*.62+Math.sin(angle)*r*.5;
    const platG=ctx.createLinearGradient(px-25,py,px+25,py+10);
    platG.addColorStop(0,`hsl(${hue},75%,55%)`); platG.addColorStop(1,`hsl(${hue},75%,30%)`);
    ctx.fillStyle=platG; ctx.shadowColor=`hsl(${hue},100%,55%)`; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.roundRect(px-25,py-5,50,10,5); ctx.fill(); ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,.2)';
    ctx.beginPath(); ctx.roundRect(px-20,py-4,20,4,2); ctx.fill();
    // Coin on each platform
    const coinG=ctx.createRadialGradient(px-1,py-10,1,px,py-10,6);
    coinG.addColorStop(0,'#ffee44'); coinG.addColorStop(1,'#cc8800');
    ctx.fillStyle=coinG; ctx.shadowColor='rgba(255,220,0,.5)'; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(px,py-14,6,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,100,.4)';
    ctx.beginPath(); ctx.ellipse(px-2,py-15,2,3,.2,0,Math.PI*2); ctx.fill();
  });
  // Player character
  const jumpCycle=80;
  const jumpPhase=(f%jumpCycle)/jumpCycle;
  const jumpArc=Math.sin(jumpPhase*Math.PI)*H*.22;
  const px=W*.5+Math.sin(f*.025)*W*.28;
  const py=H*.82-jumpArc;
  const spinAngle=(f*.12)%(Math.PI*2);
  ctx.save(); ctx.translate(px,py); ctx.rotate(jumpArc>5?spinAngle:0);
  // Body
  const bodyG=ctx.createRadialGradient(-2,-4,2,0,0,14);
  bodyG.addColorStop(0,'#cc66ff'); bodyG.addColorStop(1,'#6600cc');
  ctx.fillStyle=bodyG; ctx.shadowColor='#cc44ff'; ctx.shadowBlur=16;
  ctx.beginPath(); ctx.roundRect(-11,-16,22,24,6); ctx.fill(); ctx.shadowBlur=0;
  // Head
  const headG=ctx.createRadialGradient(-2,-22,2,0,-20,10);
  headG.addColorStop(0,'#ffcc88'); headG.addColorStop(1,'#cc8844');
  ctx.fillStyle=headG; ctx.beginPath(); ctx.arc(0,-20,10,0,Math.PI*2); ctx.fill();
  // Eyes
  ctx.fillStyle='white'; ctx.beginPath(); ctx.ellipse(-3,-20,3.5,4,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(3,-20,3.5,4,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#220044'; ctx.beginPath(); ctx.arc(-3,-19,2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(3,-19,2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(-4,-20,1,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(2,-20,1,0,Math.PI*2); ctx.fill();
  // Cape/trail spin effect
  if(jumpArc>5){
    ctx.strokeStyle='rgba(200,100,255,.4)'; ctx.lineWidth=4; ctx.lineCap='round';
    for(let t=1;t<=5;t++){
      const tr=t/5;
      ctx.globalAlpha=.4*(1-tr);
      ctx.beginPath();
      ctx.arc(0,0,14+t*3,-spinAngle+t*.3,-spinAngle+t*.3+.8);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  ctx.restore();
  // Spin trail particles
  if(jumpArc>8){
    for(let t=0;t<4;t++){
      const tAngle=spinAngle-t*.4;
      ctx.fillStyle=`rgba(200,100,255,${.4-t*.1})`;
      ctx.beginPath(); ctx.arc(px+Math.cos(tAngle)*16,py+Math.sin(tAngle)*6,3-t*.5,0,Math.PI*2); ctx.fill();
    }
  }
  // HUD
  ctx.fillStyle='rgba(200,120,255,.9)'; ctx.font='bold 10px monospace'; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(`SPIN x${Math.floor(f*.03)%6+1}`, 10, 8);
  ctx.textAlign='right';
  ctx.fillText(`${Math.floor(f*.1)*20}`, W-10, 8);
};

ANIM.tunnelRush = function(ctx,W,H,f){
  bg(ctx,W,H,'#000308','#000510');
  const cx=W/2, cy=H/2;
  const numRings=10;
  // Draw rings from back to front (smallest first)
  for(let ring=numRings-1;ring>=0;ring--){
    const progress=((ring/numRings+f*.007)%1);
    const z=Math.pow(progress,1.5);
    const r=W*.5*z;
    const hue=180+f*.5+ring*20;
    const alpha=Math.min(1,z*1.4);
    // Tunnel wall segments (hexagonal-ish)
    const sides=6;
    const twistAngle=f*.02+ring*.15;
    // Draw the polygon ring
    ctx.strokeStyle=`hsla(${hue},100%,55%,${alpha*.7})`;
    ctx.lineWidth=Math.max(1,z*5);
    ctx.beginPath();
    for(let s=0;s<=sides;s++){
      const a=s/sides*Math.PI*2+twistAngle;
      const rx=cx+Math.cos(a)*r;
      const ry=cy+Math.sin(a)*r*.6;
      s===0?ctx.moveTo(rx,ry):ctx.lineTo(rx,ry);
    }
    ctx.stroke();
    // Corner glow nodes
    if(z>.4){
      for(let s=0;s<sides;s++){
        const a=s/sides*Math.PI*2+twistAngle;
        const nx=cx+Math.cos(a)*r;
        const ny=cy+Math.sin(a)*r*.6;
        ctx.fillStyle=`hsla(${hue+30},100%,70%,${alpha*.6})`;
        ctx.shadowColor=`hsla(${hue},100%,55%,${alpha*.4})`;
        ctx.shadowBlur=6;
        ctx.beginPath(); ctx.arc(nx,ny,Math.max(.5,z*3),0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
      }
    }
    // Connecting lines between rings (tunnel perspective walls)
    if(ring<numRings-1){
      const nextProgress=((( ring+1)/numRings+f*.007)%1);
      const nextZ=Math.pow(nextProgress,1.5);
      const nextR=W*.5*nextZ;
      const nextTwist=f*.02+(ring+1)*.15;
      for(let s=0;s<sides;s++){
        const a=s/sides*Math.PI*2+twistAngle;
        const na=s/sides*Math.PI*2+nextTwist;
        ctx.strokeStyle=`hsla(${hue},80%,45%,${alpha*.2})`;
        ctx.lineWidth=1;
        ctx.beginPath();
        ctx.moveTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r*.6);
        ctx.lineTo(cx+Math.cos(na)*nextR, cy+Math.sin(na)*nextR*.6);
        ctx.stroke();
      }
    }
  }
  // Tunnel centerpoint glow
  const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,30);
  cg.addColorStop(0,`hsla(${200+f*.5},100%,70%,.3)`);
  cg.addColorStop(1,'transparent');
  ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(cx,cy,30,0,Math.PI*2); ctx.fill();
  // Player reticle at center
  ctx.strokeStyle=`rgba(255,255,255,.5)`; ctx.lineWidth=1.5;
  const crossSize=10;
  ctx.beginPath(); ctx.moveTo(cx-crossSize,cy); ctx.lineTo(cx+crossSize,cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,cy-crossSize); ctx.lineTo(cx,cy+crossSize); ctx.stroke();
  ctx.strokeStyle='rgba(100,255,255,.4)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(cx,cy,6,0,Math.PI*2); ctx.stroke();
  // Upcoming obstacle warning
  const obstacleAngle=f*.04;
  const obR=W*.12;
  ctx.fillStyle='rgba(255,100,50,.7)'; ctx.shadowColor='rgba(255,100,50,.5)'; ctx.shadowBlur=12;
  const ox=cx+Math.cos(obstacleAngle)*obR;
  const oy=cy+Math.sin(obstacleAngle)*obR*.6;
  ctx.beginPath(); ctx.arc(ox,oy,5,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  // HUD
  ctx.fillStyle='rgba(100,255,255,.8)'; ctx.font='bold 10px monospace'; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(`SPEED: ${Math.floor(f*.04)+1}x`, 10, 8);
  ctx.textAlign='right';
  ctx.fillText(`${Math.floor(f*.15)*10}m`, W-10, 8);
};

ANIM.colorSwitch = function(ctx,W,H,f){
  bg(ctx,W,H,'#050010','#0d0025');
  star(ctx,W,H,f);
  const hues=[0,120,240,60];
  const spinAngle=f*.025;
  const cx=W/2, cy=H*.44;
  const outerR=W*.3, innerR=W*.21;
  // Outer glow ring
  ctx.strokeStyle='rgba(255,255,255,.04)'; ctx.lineWidth=28;
  ctx.beginPath(); ctx.arc(cx,cy,outerR,0,Math.PI*2); ctx.stroke();
  // 4-color spinning ring
  for(let i=0;i<4;i++){
    const start=spinAngle+i*Math.PI*.5;
    const end=start+Math.PI*.5-.06;
    const hue=hues[i];
    ctx.strokeStyle=`hsl(${hue},90%,55%)`; ctx.lineWidth=18;
    ctx.shadowColor=`hsl(${hue},100%,55%)`; ctx.shadowBlur=20;
    ctx.beginPath(); ctx.arc(cx,cy,outerR,start,end); ctx.stroke(); ctx.shadowBlur=0;
    // Inner segment match
    ctx.strokeStyle=`hsla(${hue},80%,45%,.4)`; ctx.lineWidth=8;
    ctx.beginPath(); ctx.arc(cx,cy,innerR,start,end); ctx.stroke();
    // Segment cap dots
    ctx.fillStyle=`hsl(${hue},100%,65%)`; ctx.shadowColor=`hsl(${hue},100%,55%)`; ctx.shadowBlur=10;
    const capA=start+Math.PI*.25;
    ctx.beginPath(); ctx.arc(cx+Math.cos(capA)*outerR,cy+Math.sin(capA)*outerR,5,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }
  // Center hub
  const hubG=ctx.createRadialGradient(cx-3,cy-3,2,cx,cy,16);
  hubG.addColorStop(0,'rgba(255,255,255,.8)'); hubG.addColorStop(1,'rgba(80,40,180,.6)');
  ctx.fillStyle=hubG; ctx.shadowColor='rgba(200,180,255,.5)'; ctx.shadowBlur=15;
  ctx.beginPath(); ctx.arc(cx,cy,14,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  // Spokes
  for(let i=0;i<4;i++){
    const sa=spinAngle+i*Math.PI*.5+Math.PI*.25;
    ctx.strokeStyle='rgba(200,180,255,.2)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(cx+Math.cos(sa)*14,cy+Math.sin(sa)*14);
    ctx.lineTo(cx+Math.cos(sa)*innerR,cy+Math.sin(sa)*innerR); ctx.stroke();
  }
  // Bouncing ball
  const ballHueIdx=Math.floor(f/40)%4;
  const ballHue=hues[ballHueIdx];
  const bx=cx+Math.sin(f*.04)*W*.12;
  const by=H*.72+Math.sin(f*.07)*H*.08;
  const bg4=ctx.createRadialGradient(bx-3,by-3,2,bx,by,12);
  bg4.addColorStop(0,`hsl(${ballHue},90%,70%)`); bg4.addColorStop(1,`hsl(${ballHue},90%,40%)`);
  ctx.fillStyle=bg4; ctx.shadowColor=`hsl(${ballHue},100%,55%)`; ctx.shadowBlur=18;
  ctx.beginPath(); ctx.arc(bx,by,12,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.ellipse(bx-3,by-4,4,3,-.5,0,Math.PI*2); ctx.fill();
  // Color indicator band below ball
  const bandW=W*.7;
  for(let i=0;i<4;i++){
    ctx.fillStyle=`hsla(${hues[i]},80%,${i===ballHueIdx?55:30}%,${i===ballHueIdx?.9:.3})`;
    ctx.beginPath(); ctx.roundRect(W*.15+i*bandW/4+2,H*.85,bandW/4-4,10,5); ctx.fill();
  }
  // HUD
  ctx.fillStyle='rgba(200,160,255,.85)'; ctx.font='bold 10px monospace'; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(`MATCH!`, 10, 8);
  ctx.textAlign='right';
  ctx.fillText(`${Math.floor(f*.12)*10}`, W-10, 8);
};

ANIM.asteroids = function(ctx,W,H,f){
  bg(ctx,W,H,'#010508','#01080e');
  star(ctx,W,H,f);
  // Nebula wisps
  [[W*.3,H*.3,'rgba(40,0,80,.12)'],[W*.7,H*.6,'rgba(0,40,80,.1)']].forEach(([nx,ny,nc])=>{
    const ng=ctx.createRadialGradient(nx,ny,20,nx,ny,80);
    ng.addColorStop(0,nc); ng.addColorStop(1,'transparent');
    ctx.fillStyle=ng; ctx.beginPath(); ctx.arc(nx,ny,80,0,Math.PI*2); ctx.fill();
  });
  // Irregular asteroids
  const asteroidDefs=[
    {r:60,speed:.008,offset:0,size:28,rot:.012},
    {r:100,speed:.006,offset:1.57,size:18,rot:-.018},
    {r:140,speed:.005,offset:3.14,size:35,rot:.01},
    {r:85,speed:.009,offset:4.71,size:14,rot:.022},
    {r:50,speed:.014,offset:.8,size:10,rot:-.025},
  ];
  asteroidDefs.forEach(({r,speed,offset,size,rot},i)=>{
    const a=offset+f*speed;
    const ax=W/2+Math.cos(a)*r;
    const ay=H/2+Math.sin(a)*r*.7;
    const rotAngle=f*rot+i;
    ctx.save(); ctx.translate(ax,ay); ctx.rotate(rotAngle);
    // Irregular polygon body
    const points=8, varSeed=i*17;
    ctx.beginPath();
    for(let p=0;p<=points;p++){
      const pa=p/points*Math.PI*2;
      const variation=size*(0.75+Math.sin(p*2.3+varSeed+i*1.1)*.28);
      const px=Math.cos(pa)*variation;
      const py=Math.sin(pa)*variation;
      p===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
    }
    ctx.closePath();
    // Fill with rocky gradient
    const ag=ctx.createRadialGradient(-size*.2,-size*.2,size*.1,0,0,size);
    ag.addColorStop(0,'#9a8870'); ag.addColorStop(.5,'#6a5840'); ag.addColorStop(1,'#3a2820');
    ctx.fillStyle=ag; ctx.fill();
    // Edge highlight
    ctx.strokeStyle='rgba(200,180,140,.4)'; ctx.lineWidth=1.5;
    ctx.stroke();
    // Craters
    [[size*.3,-size*.2,size*.18],[-size*.25,size*.15,size*.12]].forEach(([cx,cy,cr])=>{
      ctx.fillStyle='rgba(0,0,0,.35)';
      ctx.beginPath(); ctx.arc(cx,cy,Math.abs(cr),0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(160,140,100,.3)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(cx,cy,Math.abs(cr),0,Math.PI*2); ctx.stroke();
    });
    // Rim light
    ctx.strokeStyle='rgba(220,200,160,.2)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(-size*.2,-size*.3,size*.5,Math.PI*.7,Math.PI*1.1); ctx.stroke();
    ctx.restore();
  });
  // Player ship
  const sx=W/2+Math.cos(f*.03)*55;
  const sy=H/2+Math.sin(f*.03)*40;
  const shipAngle=Math.atan2(Math.cos(f*.03)*40,Math.sin(f*.03)*-55)+Math.PI/2;
  ctx.save(); ctx.translate(sx,sy); ctx.rotate(shipAngle);
  // Engine exhaust
  const exFlicker=0.6+Math.sin(f*.3)*.4;
  const exG=ctx.createRadialGradient(0,16,1,0,20,10*exFlicker);
  exG.addColorStop(0,'rgba(100,200,255,.9)'); exG.addColorStop(.4,'rgba(0,100,255,.6)'); exG.addColorStop(1,'transparent');
  ctx.fillStyle=exG; ctx.beginPath(); ctx.arc(0,20,10*exFlicker,0,Math.PI*2); ctx.fill();
  // Ship body
  const sg=ctx.createLinearGradient(-10,-14,10,-14);
  sg.addColorStop(0,'#6688cc'); sg.addColorStop(1,'#334488');
  ctx.fillStyle=sg; ctx.shadowColor='rgba(100,160,255,.5)'; ctx.shadowBlur=12;
  ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(-10,12); ctx.lineTo(0,8); ctx.lineTo(10,12); ctx.closePath(); ctx.fill(); ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(150,180,255,.5)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(-10,12); ctx.lineTo(0,8); ctx.lineTo(10,12); ctx.closePath(); ctx.stroke();
  // Cockpit
  ctx.fillStyle='rgba(180,220,255,.4)'; ctx.beginPath(); ctx.ellipse(0,-4,4,6,0,0,Math.PI*2); ctx.fill();
  // Wing accents
  ctx.strokeStyle='rgba(100,180,255,.4)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(-8,8); ctx.lineTo(-16,14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(8,8); ctx.lineTo(16,14); ctx.stroke();
  ctx.restore();
  // Laser bolts
  const laserT=(f*1.6)%100;
  if(laserT<60){
    const lt=laserT/60;
    const lx=sx+Math.cos(shipAngle-Math.PI/2)*(lt*120);
    const ly=sy+Math.sin(shipAngle-Math.PI/2)*(lt*120);
    ctx.fillStyle='rgba(100,255,255,.8)'; ctx.shadowColor='rgba(100,255,255,.6)'; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(lx,ly,3,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
    // Trail
    ctx.strokeStyle=`rgba(100,255,255,${.4*(1-lt)})`; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(lx,ly); ctx.stroke();
  }
  // HUD
  ctx.fillStyle='rgba(100,255,220,.85)'; ctx.font='bold 10px monospace'; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(`SCORE: ${Math.floor(f*.08)*50}`, 10, 8);
  ctx.textAlign='right';
  ctx.fillText(`LIVES: 3`, W-10, 8);
};

ANIM.helixJump = function(ctx,W,H,f){
  bg(ctx,W,H,'#050010','#0d0025');
  star(ctx,W,H,f);
  const cx=W/2;
  const hues=[280,320,200,160,240,300];
  const numRings=6;
  const ringSpacing=H*.13;
  const ringW=W*.32;
  // Helix platform rings (thick arcs with gap)
  for(let ring=0;ring<numRings;ring++){
    const ry=H*.88-ring*ringSpacing;
    if(ry<-20||ry>H+20) continue;
    const hue=hues[ring%hues.length];
    const rot=f*.022+ring*.95+ring*Math.PI*.3;
    const gapSize=Math.PI*.55;
    const gapCenter=rot+Math.PI; // gap position rotates
    // Ring shadow glow
    ctx.strokeStyle=`hsla(${hue},100%,55%,.12)`; ctx.lineWidth=24;
    ctx.beginPath(); ctx.arc(cx,ry,ringW,gapCenter+gapSize/2,gapCenter-gapSize/2); ctx.stroke();
    // Main ring
    const rg=ctx.createLinearGradient(cx-ringW,ry,cx+ringW,ry);
    rg.addColorStop(0,`hsl(${hue},80%,40%)`); rg.addColorStop(.5,`hsl(${hue},90%,60%)`); rg.addColorStop(1,`hsl(${hue},80%,40%)`);
    ctx.strokeStyle=rg; ctx.lineWidth=14;
    ctx.shadowColor=`hsl(${hue},100%,55%)`; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(cx,ry,ringW,gapCenter+gapSize/2,gapCenter-gapSize/2); ctx.stroke(); ctx.shadowBlur=0;
    // Ring edge highlight (inner)
    ctx.strokeStyle=`hsla(${hue+30},100%,75%,.4)`; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(cx,ry,ringW-7,gapCenter+gapSize/2,gapCenter-gapSize/2); ctx.stroke();
    // Ring end caps
    [[gapCenter+gapSize/2],[gapCenter-gapSize/2]].forEach(([capA])=>{
      ctx.fillStyle=`hsl(${hue},100%,65%)`; ctx.shadowColor=`hsl(${hue},100%,60%)`; ctx.shadowBlur=8;
      ctx.beginPath(); ctx.arc(cx+Math.cos(capA)*ringW,ry+Math.sin(capA)*ringW,5,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
    });
  }
  // Central pole
  const poleG=ctx.createLinearGradient(cx-3,0,cx+3,0);
  poleG.addColorStop(0,'rgba(140,100,200,.3)'); poleG.addColorStop(1,'rgba(80,40,160,.3)');
  ctx.fillStyle=poleG; ctx.shadowColor='rgba(160,120,255,.2)'; ctx.shadowBlur=8;
  ctx.fillRect(cx-3,0,6,H); ctx.shadowBlur=0;
  // Pole glow rings
  for(let pg=0;pg<4;pg++){
    const pgy=((pg*H/4+f*1.5)%H);
    ctx.strokeStyle='rgba(180,140,255,.08)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(cx,pgy,8,0,Math.PI*2); ctx.stroke();
  }
  // Ball player
  const ballDropY=H*.04+Math.sin(f*.04)*H*.06;
  const ballBounceY=ballDropY+((f*.8%40)/40)*H*.82;
  const bFinalY=Math.min(ballBounceY,H*.84);
  const ballG=ctx.createRadialGradient(cx-3,bFinalY-3,2,cx,bFinalY,13);
  ballG.addColorStop(0,'#ffffff'); ballG.addColorStop(.3,'#88ddff'); ballG.addColorStop(1,'#0066cc');
  ctx.fillStyle=ballG; ctx.shadowColor='rgba(100,220,255,.7)'; ctx.shadowBlur=18;
  ctx.beginPath(); ctx.arc(cx,bFinalY,13,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  // Ball specular
  ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.beginPath(); ctx.ellipse(cx-4,bFinalY-4,4,3,-.5,0,Math.PI*2); ctx.fill();
  // Ball trail
  for(let t=1;t<=5;t++){
    const tY=bFinalY-t*7;
    if(tY>0){
      ctx.fillStyle=`rgba(100,200,255,${.15-t*.02})`;
      ctx.beginPath(); ctx.arc(cx,tY,13-t*1.5,0,Math.PI*2); ctx.fill();
    }
  }
  // Impact ripple when at a ring level
  const nearRing=hues.findIndex((h,i)=>{
    const ry=H*.88-i*ringSpacing;
    return Math.abs(bFinalY-ry)<8;
  });
  if(nearRing>=0){
    const rippleHue=hues[nearRing];
    ctx.strokeStyle=`hsla(${rippleHue},100%,65%,.6)`; ctx.lineWidth=2;
    ctx.shadowColor=`hsl(${rippleHue},100%,55%)`; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.arc(cx,bFinalY,20+((f%8)*3),0,Math.PI*2); ctx.stroke(); ctx.shadowBlur=0;
  }
  // HUD
  ctx.fillStyle='rgba(180,120,255,.9)'; ctx.font='bold 10px monospace'; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(`FLOOR: ${numRings-Math.floor(bFinalY/ringSpacing)}`, 10, 8);
  ctx.textAlign='right';
  ctx.fillText(`${Math.floor(f*.1)*20}`, W-10, 8);
};

ANIM.default = function(ctx,W,H,f){
  bg(ctx,W,H,'#070709','#101018');
  for(let i=0;i<6;i++) glow(ctx,W*.15+Math.sin(f*.03+i)*W*.3+W*.35,H*.15+Math.cos(f*.04+i*.8)*H*.3+H*.35,8,i*60,.7);
};

// ===================== FILTER + SEARCH + RENDER =====================
let currentCat='all';
let searchQuery='';

document.getElementById('cat-strip').addEventListener('click',e=>{
  const btn=e.target.closest('.cat-btn');
  if(!btn) return;
  document.querySelectorAll('.cat-btn,.sidebar-cat').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll(`.sidebar-cat[data-cat="${btn.dataset.cat}"]`).forEach(b=>b.classList.add('active'));
  currentCat=btn.dataset.cat;
  renderAll();
});

document.querySelector('.sidebar').addEventListener('click',e=>{
  const btn=e.target.closest('.sidebar-cat');
  if(!btn) return;
  document.querySelectorAll('.cat-btn,.sidebar-cat').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll(`.cat-btn[data-cat="${btn.dataset.cat}"]`).forEach(b=>b.classList.add('active'));
  currentCat=btn.dataset.cat;
  renderAll();
});

let searchTimer;
document.getElementById('search-input').addEventListener('input',e=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{
    searchQuery=e.target.value.toLowerCase().trim();
    renderAll();
  },200);
});

function matchGame(g){
  const catOk=currentCat==='all'||g.cats.includes(currentCat);
  if(!catOk) return false;
  if(!searchQuery) return true;
  return g.name.toLowerCase().includes(searchQuery)||g.tags.some(t=>t.toLowerCase().includes(searchQuery));
}

function renderFeatured(game){
  const wrap=document.getElementById('featured-wrap');
  if(!game){wrap.innerHTML='';return;}
  wrap.innerHTML=`
    <div class="featured-wrap">
      <div class="featured-inner">
        <div class="featured-thumb">
          <canvas width="400" height="250"></canvas>
        </div>
        <div class="featured-info">
          <div class="featured-label">&#x2B50; Featured Game</div>
          <div class="featured-title">${game.name}</div>
          <div class="featured-tags">
            ${game.tags.map(t=>`<span class="tag" style="${tagStyle(t)}">${t}</span>`).join('')}
          </div>
          <a class="featured-play" href="${game.href}">Play Now</a>
        </div>
      </div>
    </div>
  `;
  const cv=wrap.querySelector('canvas');
  startAnim(cv,game.draw);
}

function renderAll(){
  const newGrid=document.getElementById('new-grid');
  const allGrid=document.getElementById('all-grid');
  newGrid.innerHTML='';allGrid.innerHTML='';
  const newFiltered=NEW_GAMES.filter(matchGame);
  const allFiltered=LIBRARY_GAMES.filter(matchGame);
  newFiltered.forEach(g=>newGrid.appendChild(makeCard(g,true)));
  allFiltered.forEach(g=>allGrid.appendChild(makeCard(g,false)));
  const total=newFiltered.length+allFiltered.length;
  document.getElementById('stat-count').textContent=total;
  document.getElementById('new-count').textContent=newFiltered.length+' games';
  document.getElementById('all-count').textContent=allFiltered.length+' games';
  document.getElementById('new-section').style.display=newGrid.children.length?'':'none';
  const featGame=newFiltered[0]||allFiltered[0]||null;
  renderFeatured(featGame);
}

renderAll();
