<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08091a;
  --bg2:#0f1028;
  --sidebar:#0b0c20;
  --card:#14152e;
  --card-hover:#1c1d38;
  --border:rgba(255,255,255,.07);
  --text:#f0f0ff;
  --muted:rgba(240,240,255,.4);
  --orange:#ff6b2d;
  --orange2:#ff9a60;
  --pink:#ff4fa0;
  --cyan:#00e5ff;
  --gold:#ffd460;
  --radius:12px;
  --radius-sm:8px;
  --grid-min:155px;
  --nav-h:62px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden}

/* ---- TOP NAV ---- */
.top-nav{
  position:sticky;top:0;z-index:200;height:var(--nav-h);
  display:flex;align-items:center;gap:14px;padding:0 20px;
  background:rgba(8,9,26,.95);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}
.nav-logo{
  display:flex;align-items:center;gap:9px;
  font-family:'Cinzel Decorative',serif;font-size:1.25rem;
  color:#fff;white-space:nowrap;text-decoration:none;flex-shrink:0;
}
.nav-logo-icon{
  width:36px;height:36px;border-radius:9px;
  background:linear-gradient(135deg,var(--orange),var(--pink));
  display:flex;align-items:center;justify-content:center;font-size:1.1rem;
  box-shadow:0 2px 14px rgba(255,107,45,.35);
}
.nav-search{flex:1;max-width:460px;position:relative;}
.nav-search input{
  width:100%;height:38px;border-radius:20px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  color:#fff;font-family:'Nunito',sans-serif;font-size:.85rem;
  padding:0 16px 0 42px;outline:none;
  transition:border-color .2s,background .2s;
}
.nav-search input:focus{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);}
.nav-search input::placeholder{color:var(--muted);}
.nav-search::before{content:'\1F50D';position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:.85rem;pointer-events:none;}
.nav-stats{
  display:flex;gap:20px;flex-shrink:0;
  font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);
}
.nav-stats strong{color:var(--gold);font-size:.95rem;display:block;letter-spacing:0;}

/* ---- CATEGORY STRIP ---- */
.cat-strip{
  display:flex;gap:6px;padding:10px 20px;overflow-x:auto;
  background:var(--bg2);border-bottom:1px solid var(--border);
  scrollbar-width:none;position:sticky;top:var(--nav-h);z-index:150;
}
.cat-strip::-webkit-scrollbar{display:none;}
.cat-btn{
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  padding:7px 16px;border-radius:20px;border:none;
  background:rgba(255,255,255,.06);color:var(--muted);
  font-family:'Nunito',sans-serif;font-size:.8rem;font-weight:700;
  cursor:pointer;letter-spacing:.04em;transition:all .2s;user-select:none;
}
.cat-btn:hover{background:rgba(255,255,255,.1);color:#fff;}
.cat-btn.active{
  background:linear-gradient(135deg,var(--orange),var(--pink));
  color:#fff;box-shadow:0 2px 14px rgba(255,107,45,.35);
}

/* ---- AD BANNER ---- */
.ad-top{
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:8px;text-align:center;min-height:92px;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
}
.ad-label{
  font-size:.58rem;text-transform:uppercase;letter-spacing:.18em;
  color:rgba(255,255,255,.18);margin-bottom:4px;display:block;
}

/* ---- LAYOUT ---- */
.app-layout{display:flex;max-width:1600px;margin:0 auto;}
.sidebar{
  width:220px;min-width:220px;flex-shrink:0;
  background:var(--sidebar);border-right:1px solid var(--border);
  padding:16px 12px;display:flex;flex-direction:column;gap:14px;
  min-height:calc(100vh - var(--nav-h) - 50px);
}
.main-content{flex:1;min-width:0;padding:20px 20px 50px;}

/* ---- SIDEBAR ---- */
.sidebar-title{
  font-size:.6rem;text-transform:uppercase;letter-spacing:.18em;
  color:rgba(255,255,255,.22);margin-bottom:6px;padding:0 4px;
}
.sidebar-cat{
  display:flex;align-items:center;gap:10px;padding:8px 10px;
  border-radius:8px;cursor:pointer;transition:background .15s;
  font-size:.82rem;font-weight:700;color:var(--muted);
  background:transparent;border:none;width:100%;text-align:left;
}
.sidebar-cat:hover{background:rgba(255,255,255,.06);color:#fff;}
.sidebar-cat.active{background:rgba(255,107,45,.15);color:var(--orange);}
.sidebar-cat-icon{font-size:1.05rem;width:26px;text-align:center;}
.sidebar-ad{
  background:rgba(255,255,255,.025);border:1px solid var(--border);
  border-radius:var(--radius);padding:8px;text-align:center;
  min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  margin-top:auto;
}

/* ---- FEATURED ---- */
.featured-wrap{
  margin-bottom:24px;border-radius:var(--radius);overflow:hidden;
  background:linear-gradient(135deg,#1a0a28,#0a1a3a);
  border:1px solid rgba(255,107,45,.18);position:relative;
}
.featured-inner{display:flex;align-items:stretch;}
.featured-thumb{
  width:clamp(180px,36%,290px);flex-shrink:0;position:relative;overflow:hidden;
}
.featured-thumb canvas{width:100%;height:100%;display:block;}
.featured-info{
  flex:1;padding:22px 24px;display:flex;flex-direction:column;gap:10px;justify-content:center;
}
.featured-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.22em;color:var(--orange);font-weight:700;}
.featured-title{
  font-family:'Cinzel',serif;font-size:clamp(1.3rem,3vw,2rem);color:#fff;line-height:1.1;
}
.featured-tags{display:flex;gap:7px;flex-wrap:wrap;}
.featured-play{touch-action:manipulation;
  display:inline-flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,var(--orange),var(--pink));
  color:#fff;font-family:'Cinzel',serif;font-size:.82rem;font-weight:700;
  letter-spacing:.08em;padding:11px 24px;border-radius:24px;
  text-decoration:none;width:fit-content;
  box-shadow:0 4px 18px rgba(255,107,45,.4);transition:transform .18s,box-shadow .18s;
}
.featured-play:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(255,107,45,.5);}
.featured-play::before{content:'\25B6\0020';font-size:.85rem;}

/* ---- SECTIONS ---- */
.section{margin-bottom:28px;}
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.section-header h2{
  font-family:'Cinzel',serif;font-size:clamp(.9rem,2vw,1.1rem);
  color:#fff;letter-spacing:.06em;white-space:nowrap;
}
.section-count{
  font-size:.68rem;background:rgba(255,255,255,.07);
  border-radius:12px;padding:2px 10px;color:var(--muted);
}
.section-header::after{content:'';flex:1;height:1px;background:var(--border);}

/* ---- CARDS ---- */
.card-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(var(--grid-min),1fr));
  gap:12px;
}
.game-card{
  display:block;text-decoration:none;border-radius:var(--radius);
  background:var(--card);overflow:hidden;border:1px solid var(--border);
  transition:transform .18s,box-shadow .18s,border-color .18s;position:relative;touch-action:manipulation;
}
.game-card:hover{
  transform:translateY(-5px) scale(1.025);
  border-color:rgba(255,107,45,.3);
  box-shadow:0 12px 36px rgba(0,0,0,.7),0 0 24px rgba(255,107,45,.12);
}
.card-thumb{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;display:flex;align-items:center;justify-content:center;}

.card-play{display:none;}

.card-body{padding:9px 11px 11px;}
.card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px;}
.tag{
  font-size:.52rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 7px;border-radius:4px;border:1px solid;
}
.card-name{
  font-family:'Cinzel',serif;font-size:.82rem;font-weight:700;
  color:var(--text);letter-spacing:.03em;line-height:1.2;
}
.card-meta{display:flex;align-items:center;gap:8px;margin-top:4px;}
.card-stars{color:#ffd460;font-size:.68rem;letter-spacing:1px;}
.card-plays{font-size:.6rem;color:var(--muted);}
.badge-new{
  position:absolute;top:8px;left:8px;
  background:linear-gradient(135deg,var(--orange),var(--pink));
  color:#fff;font-size:.5rem;font-weight:700;letter-spacing:.08em;
  padding:3px 8px;border-radius:4px;text-transform:uppercase;
  box-shadow:0 2px 10px rgba(255,107,45,.4);z-index:5;
}
.badge-hot{
  position:absolute;top:8px;right:8px;
  background:rgba(255,70,70,.85);backdrop-filter:blur(4px);
  color:#fff;font-size:.5rem;font-weight:700;letter-spacing:.08em;
  padding:3px 8px;border-radius:4px;text-transform:uppercase;z-index:5;
}

/* ---- MID AD ---- */
.ad-mid{
  background:rgba(255,255,255,.025);border:1px dashed rgba(255,255,255,.07);
  border-radius:var(--radius);padding:8px;text-align:center;
  min-height:92px;margin:20px 0;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
}

/* ---- FOOTER ---- */
footer{
  background:var(--sidebar);border-top:1px solid var(--border);
  padding:28px 20px;text-align:center;
  color:rgba(255,255,255,.18);font-size:.65rem;letter-spacing:.1em;
}
.footer-links{
  display:flex;justify-content:center;gap:20px;margin-bottom:12px;flex-wrap:wrap;
}
.footer-links a{color:rgba(255,255,255,.3);text-decoration:none;font-size:.7rem;transition:color .15s;}
.footer-links a:hover{color:rgba(255,255,255,.65);}

/* ---- RESPONSIVE ---- */
@media(max-width:900px){
  .sidebar{display:none;}
  .nav-stats{display:none;}
  :root{--grid-min:140px;}
}
@media(max-width:600px){
  :root{--grid-min:130px;}
  .main-content{padding:14px 12px 40px;}
  .featured-inner{flex-direction:column;}
  .featured-thumb{width:100%;height:160px;}
}
@media(max-width:420px){:root{--grid-min:120px;}}
@media(min-width:1200px){:root{--grid-min:168px;}}
</style>

const PLAY_COUNTS=['12.4k','8.7k','21k','5.2k','16.3k','9.8k','31k','4.1k','7.6k','18.5k','11k','6.3k'];
const HOT_KEYS=['darkRealm','neonBrawl','spaceBlaster','snake','frogger','tunnelRush','asteroids','helixJump'];

const CAT_THEME = {
  action:  {icon:'&#x26A1;', bg:'135deg,#1a1a2e 0%,#16213e 100%'},
  puzzle:  {icon:'&#x1F9E9;', bg:'135deg,#1a0a2e 0%,#2d1b69 100%'},

  word:    {icon:'&#x1F4AC;', bg:'135deg,#4facfe 0%,#00f2fe 100%'},
};
function makeCard(g, isNew){
  const a = document.createElement('a');
  a.className='game-card';
  a.href=g.href;
  const tags=g.tags.slice(0,2).map(t=>`<span class="tag" style="${tagStyle(t)}">${t}</span>`).join('');
  const rIdx=g.draw.charCodeAt(0)%RATINGS.length;
  const rating=RATINGS[rIdx];
  const fullStars=Math.floor(rating);
  const starsHtml='&#x2605;'.repeat(fullStars)+'&#x2606;'.repeat(5-fullStars);
  const plays=PLAY_COUNTS[g.draw.charCodeAt(1)%PLAY_COUNTS.length];
  const isHot=HOT_KEYS.includes(g.draw);
  const theme = CAT_THEME[g.cats[0]] || CAT_THEME.action;
  a.innerHTML=`
    <div class="card-thumb" style="background:linear-gradient(${theme.bg})">
      <span style="font-size:3rem;line-height:1;user-select:none;pointer-events:none">${theme.icon}</span>

    </div>
    <div class="card-body">
      <div class="card-tags">${tags}</div>
      <div class="card-name">${g.name}</div>
      <div class="card-meta">
        <span class="card-stars">${starsHtml}</span>
        <span class="card-plays">${plays}</span>
      </div>
    </div>
    ${isNew?'<span class="badge-new">New</span>':''}
    ${isHot?'<span class="badge-hot">&#x1F525; Hot</span>':''}
  `;
  return a;
}

// ===================== ANIMATION ENGINE =====================
function startAnim(cv, fn){
  const ctx=cv.getContext('2d');
  const W=cv.width, H=cv.height;
  let f=0, raf;
  const draws = ANIM[fn]||ANIM.default;
  function loop(){ raf=requestAnimationFrame(loop); draws(ctx,W,H,f++); }
  // Only animate when visible
  const obs=new IntersectionObserver(entries=>{
    if(entries[0].isIntersecting){loop();}
    else{cancelAnimationFrame(raf);}
  },{threshold:0.1});
  obs.observe(cv);
}

// --- Shared helpers ---
function bg(ctx,W,H,c1,c2){ const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H); }
function star(ctx,W,H,f){ ctx.fillStyle='rgba(255,255,255,.5)';for(let i=0;i<30;i++){ctx.beginPath();ctx.arc((i*77+f*.5)%W,(i*53+f*.3)%H,.8+Math.sin(i+f*.03),0,Math.PI*2);ctx.fill();} }
function glow(ctx,x,y,r,hue,a=1){ ctx.shadowColor=`hsla(${hue},100%,60%,${a})`;ctx.shadowBlur=16;ctx.fillStyle=`hsla(${hue},90%,55%,${a})`;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0; }

ANIM.gemCrush = function(ctx,W,H,f){
  bg(ctx,W,H,'#1a0530','#2d0d4f');
  const hues=[320,220,140,30,270,0];
  const cols=['#ff4499','#4499ff','#44ff99','#ff9944','#9944ff','#ff4444'];
  const sel=Math.floor(f/50)%12;
  for(let r=0;r<3;r++) for(let c=0;c<4;c++){
    const idx=r*4+c, offset=(r%2)*.5;
    const cx2=(c+offset)*W/3.5+W/8, cy2=r*H/2.8+H/5;
    const col=cols[(idx*3+1)%6], hue=hues[(idx*3+1)%6];
    const isSel=idx===sel, R=isSel?20:16;
    ctx.save(); ctx.translate(cx2,cy2);
    if(isSel) ctx.rotate(Math.sin(f*.08)*.12);
    ctx.shadowColor=col; ctx.shadowBlur=isSel?22:7;
    const g=ctx.createRadialGradient(-R*.3,-R*.3,0,0,0,R*1.1);
    g.addColorStop(0,'rgba(255,255,255,.55)'); g.addColorStop(.4,col); g.addColorStop(1,col.replace('ff','44'));
    ctx.fillStyle=g;
    ctx.beginPath();
    for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/6;i===0?ctx.moveTo(Math.cos(a)*R,Math.sin(a)*R):ctx.lineTo(Math.cos(a)*R,Math.sin(a)*R);}
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.22)';
    ctx.beginPath(); ctx.moveTo(0,-R*.55); ctx.lineTo(-R*.48,R*.28); ctx.lineTo(R*.48,R*.28); ctx.closePath(); ctx.fill();
    ctx.restore();
    if(isSel&&f%50<28) for(let s=0;s<4;s++){const sa=s*Math.PI*.5+f*.15,sr=R+f%50*.7;ctx.fillStyle=`rgba(255,255,200,${1-f%50/28})`;ctx.beginPath();ctx.arc(cx2+Math.cos(sa)*sr,cy2+Math.sin(sa)*sr,2,0,Math.PI*2);ctx.fill();}
  }
  ctx.shadowBlur=0;
};

ANIM.wordHunt = function(ctx,W,H,f){
  bg(ctx,W,H,'#001a18','#003030');
  const letters=[['W','O','R','D','S'],['H','U','N','T','E'],['R','G','A','M','E'],['C','L','U','E','S']];
  const path=[[0,0],[0,1],[0,2],[0,3]];
  const cw=W/5.4, ch=H/4.8, ox=(W-cw*5)/2, oy=(H-ch*4)/2;
  for(let r=0;r<4;r++) for(let c=0;c<5;c++){
    const x=ox+c*cw, y=oy+r*ch;
    const pIdx=path.findIndex(([pr,pc])=>pr===r&&pc===c);
    const isPath=pIdx>=0;
    ctx.fillStyle=isPath?`rgba(0,220,160,${0.5+Math.sin(f*.06+pIdx)*.2})`:`rgba(0,55,65,${0.6+Math.sin(f*.04+(r+c)*.5)*.1})`;
    ctx.shadowColor=isPath?'#00ffaa':'transparent'; ctx.shadowBlur=isPath?12:0;
    ctx.beginPath(); ctx.roundRect(x+2,y+2,cw-4,ch-4,5); ctx.fill(); ctx.shadowBlur=0;
    ctx.strokeStyle=isPath?'rgba(0,255,180,.5)':'rgba(255,255,255,.1)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(x+2,y+2,cw-4,ch-4,5); ctx.stroke();

    ctx.font=`bold ${Math.round(ch*.44)}px 'Courier New',monospace`; ctx.textAlign='center'; ctx.textBaseline='middle';

  }
  ctx.strokeStyle='rgba(0,255,160,.4)'; ctx.lineWidth=2; ctx.setLineDash([4,3]);
  for(let i=0;i<path.length-1;i++){

  ctx.setLineDash([]);
};

      const cx=sx, cy=sy+card*18+Math.sin(f*.03+col);
      const isTop=card===num-1;
      ctx.fillStyle='rgba(0,0,0,.28)'; ctx.beginPath(); ctx.roundRect(cx-cw/2+2,cy+2,cw,ch,4); ctx.fill();
      ctx.fillStyle=isTop?'#f0f0e8':'#2244aa'; ctx.beginPath(); ctx.roundRect(cx-cw/2,cy,cw,ch,4); ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.2)'; ctx.lineWidth=.5; ctx.beginPath(); ctx.roundRect(cx-cw/2,cy,cw,ch,4); ctx.stroke();
      if(isTop){
        const vi=(col*7+3)%4;
        ctx.fillStyle=suitCols[vi]; ctx.font=`bold ${Math.round(cw*.32)}px serif`; ctx.textAlign='left'; ctx.textBaseline='top'; ctx.fillText(ranks[col%5],cx-cw/2+3,cy+2);
        ctx.font=`${Math.round(cw*.38)}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(suits[vi],cx,cy+ch/2);
      } else {
        ctx.strokeStyle='rgba(80,120,200,.3)'; ctx.lineWidth=1;
        for(let d=-ch;d<cw+ch;d+=8){ctx.beginPath();ctx.moveTo(cx-cw/2+d,cy);ctx.lineTo(cx-cw/2+d+ch,cy+ch);ctx.stroke();}
      }
    }
  }
};

ANIM.stacker = function(ctx,W,H,f){
  bg(ctx,W,H,'#050508','#0a0a18');
  const BW=Math.round(W*.8), BX=(W-BW)/2;
  ctx.fillStyle='rgba(255,255,255,.025)'; ctx.fillRect(BX,8,BW,H-16);
  ctx.strokeStyle='rgba(96,160,255,.2)'; ctx.lineWidth=1.5; ctx.strokeRect(BX,8,BW,H-16);
  const bH=Math.round((H-16)/26), hues=[280,220,180,140,60,30,0,320,260,200];
  const nStack=8;
  for(let i=0;i<nStack;i++){
    const hue=hues[i%hues.length], w=BW-i*Math.round(BW*.06), x=BX+(BW-w)/2, y=H-16-bH*(i+1);
    ctx.shadowColor=`hsl(${hue},80%,60%)`; ctx.shadowBlur=i===nStack-1?12:4;
    const g=ctx.createLinearGradient(x,y,x,y+bH);
    g.addColorStop(0,`hsl(${hue},80%,62%)`); g.addColorStop(1,`hsl(${hue-20},80%,45%)`);
    ctx.fillStyle=g; ctx.fillRect(x+1,y+1,w-2,bH-2);
    ctx.fillStyle='rgba(255,255,255,.18)'; ctx.fillRect(x+1,y+1,w-2,Math.round(bH*.35));
    ctx.strokeStyle=`hsl(${hue+20},80%,70%)`; ctx.lineWidth=.8; ctx.strokeRect(x+1,y+1,w-2,bH-2); ctx.shadowBlur=0;
  }
  const mHue=hues[nStack%hues.length], mW=BW-nStack*Math.round(BW*.06);
  const bounce=((f*2.5)%(BW*.9)), mX=BX+(bounce<BW*.45?bounce:BW*.9-bounce);
  const mY=H-16-bH*(nStack+1);
  if(mY>=8){
    ctx.shadowColor=`hsl(${mHue},100%,60%)`; ctx.shadowBlur=16;
    const g2=ctx.createLinearGradient(mX,mY,mX,mY+bH);
    g2.addColorStop(0,`hsl(${mHue},80%,70%)`); g2.addColorStop(1,`hsl(${mHue-20},80%,50%)`);
    ctx.fillStyle=g2; ctx.fillRect(mX,mY,mW-2,bH-2);
    ctx.fillStyle='rgba(255,255,255,.25)'; ctx.fillRect(mX,mY,mW-2,Math.round(bH*.35)); ctx.shadowBlur=0;
  }
  const fill=nStack/26;
  const fg=ctx.createLinearGradient(0,H,0,8); fg.addColorStop(0,'#f060a0'); fg.addColorStop(.5,'#60a0ff'); fg.addColorStop(1,'#60ffb0');
  ctx.fillStyle=fg; ctx.fillRect(BX+BW+4,H-16-Math.round((H-24)*fill),4,Math.round((H-24)*fill));
};

ANIM.neonGlider = function(ctx,W,H,f){
  bg(ctx,W,H,'#04040a','#060a1a');
  ctx.strokeStyle='rgba(0,255,200,.035)'; ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  for(let i=0;i<30;i++){ctx.fillStyle=`rgba(255,255,255,${.3+Math.random()*.1})`;ctx.beginPath();ctx.arc((i*77+f*.4)%W,(i*41+f*.2)%H,.7,0,Math.PI*2);ctx.fill();}
  for(let i=0;i<2;i++){
    const px=W+40-((f*2.5+i*160)%(W+180));
    const gapY=H*.35+Math.sin(f*.04+i)*H*.2, gapH=H*.28;
    const hue=180+(i*60+f*.5)%120;
    if(gapY>0){const g=ctx.createLinearGradient(px-22,0,px+22,0);g.addColorStop(0,`hsla(${hue},80%,20%,.85)`);g.addColorStop(.5,`hsla(${hue},100%,40%,.95)`);g.addColorStop(1,`hsla(${hue},80%,20%,.85)`);ctx.shadowColor=`hsl(${hue},100%,60%)`;ctx.shadowBlur=12;ctx.fillStyle=g;ctx.fillRect(px-22,0,44,gapY);ctx.fillStyle=`hsl(${hue},100%,65%)`;ctx.fillRect(px-22,gapY-6,44,6);}
    const botY=gapY+gapH, botH=H-botY;
    if(botH>0){const g=ctx.createLinearGradient(px-22,0,px+22,0);g.addColorStop(0,`hsla(${hue},80%,20%,.85)`);g.addColorStop(.5,`hsla(${hue},100%,40%,.95)`);g.addColorStop(1,`hsla(${hue},80%,20%,.85)`);ctx.fillStyle=g;ctx.fillRect(px-22,botY,44,botH);ctx.fillStyle=`hsl(${hue},100%,65%)`;ctx.fillRect(px-22,botY,44,6);ctx.shadowBlur=0;}
  }
  const shipX=W*.25, shipY=H/2+Math.sin(f*.12)*45;
  ctx.save(); ctx.translate(shipX,shipY); ctx.rotate(Math.min(Math.max(Math.cos(f*.12)*-.4,-.4),.8));
  ctx.shadowColor='#00ffcc'; ctx.shadowBlur=18;
  const sg=ctx.createLinearGradient(-14,0,14,0); sg.addColorStop(0,'#004a44'); sg.addColorStop(1,'#00ffcc');
  ctx.fillStyle=sg; ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(-14,-10); ctx.lineTo(-8,0); ctx.lineTo(-14,10); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#00ffcc'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(-14,-10); ctx.lineTo(-8,0); ctx.lineTo(-14,10); ctx.closePath(); ctx.stroke();
  ctx.fillStyle='rgba(0,255,200,.4)'; ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI*2); ctx.fill();
  ctx.shadowColor='#ff8800'; ctx.shadowBlur=12; ctx.fillStyle='rgba(255,140,0,.8)'; ctx.beginPath(); ctx.ellipse(-8,0,4+Math.random()*2,2,0,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0; ctx.restore();
};

ANIM.blockPuzzle = function(ctx,W,H,f){
  bg(ctx,W,H,'#080818','#0d0d2a');
  const cell=Math.round(W*.085), cols2=10, rows2=Math.floor((H-20)/cell);
  const wellX=(W-cols2*cell)/2, wellY=H-rows2*cell-10;
  ctx.strokeStyle='rgba(80,80,180,.4)'; ctx.lineWidth=1.5; ctx.strokeRect(wellX-1,wellY-1,cols2*cell+2,rows2*cell+2);
  ctx.strokeStyle='rgba(255,255,255,.04)'; ctx.lineWidth=.5;
  for(let c=1;c<cols2;c++){ctx.beginPath();ctx.moveTo(wellX+c*cell,wellY);ctx.lineTo(wellX+c*cell,wellY+rows2*cell);ctx.stroke();}
  for(let r=1;r<rows2;r++){ctx.beginPath();ctx.moveTo(wellX,wellY+r*cell);ctx.lineTo(wellX+cols2*cell,wellY+r*cell);ctx.stroke();}
  const placed=[
    {cells:[[0,rows2-1],[1,rows2-1],[2,rows2-1],[3,rows2-1],[4,rows2-1],[5,rows2-1],[6,rows2-1],[7,rows2-1]],hue:200},
    {cells:[[0,rows2-2],[1,rows2-2],[2,rows2-2],[3,rows2-2],[4,rows2-2],[5,rows2-2]],hue:120},
    {cells:[[0,rows2-3],[1,rows2-3],[2,rows2-3],[3,rows2-3],[7,rows2-3],[8,rows2-3],[9,rows2-3]],hue:40},
    {cells:[[0,rows2-4],[1,rows2-4],[2,rows2-4],[3,rows2-4],[4,rows2-4]],hue:280},
    {cells:[[7,rows2-2],[8,rows2-2],[9,rows2-2],[9,rows2-3],[9,rows2-4]],hue:0}
  ];
  placed.forEach(piece=>piece.cells.forEach(([c,r])=>{
    const x=wellX+c*cell+1,y=wellY+r*cell+1,s=cell-2;
    ctx.fillStyle=`hsl(${piece.hue},80%,50%)`; ctx.shadowColor=`hsl(${piece.hue},80%,60%)`; ctx.shadowBlur=4;
    ctx.fillRect(x,y,s,s); ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,.2)'; ctx.fillRect(x,y,s,Math.round(s*.3)); ctx.fillRect(x,y,Math.round(s*.2),s);
  }));
  const dropY=Math.floor((f*.8)%(rows2-5));
  [[4,dropY],[5,dropY],[6,dropY],[7,dropY]].forEach(([c,r])=>{
    const x=wellX+c*cell+1,y=wellY+r*cell+1,s=cell-2;
    ctx.fillStyle='rgba(0,220,255,.9)'; ctx.shadowColor='#00aaff'; ctx.shadowBlur=10;
    ctx.fillRect(x,y,s,s); ctx.fillStyle='rgba(255,255,255,.3)'; ctx.fillRect(x,y,s,Math.round(s*.35)); ctx.shadowBlur=0;
  });
  [[4,rows2-2],[5,rows2-2],[6,rows2-2],[7,rows2-2]].forEach(([c,r])=>{
    const x=wellX+c*cell+1,y=wellY+r*cell+1,s=cell-2;
    ctx.strokeStyle='rgba(0,180,255,.22)'; ctx.lineWidth=1; ctx.strokeRect(x,y,s,s);
  });
};

// --- Existing library games ---
ANIM.darkRealm = function(ctx,W,H,f){
  bg(ctx,W,H,'#0a0004','#140008');
  // Torch flicker
  const flicker=0.7+Math.sin(f*.11)*0.18+Math.sin(f*.07)*0.12;
  ctx.shadowColor=`rgba(255,120,0,${flicker})`; ctx.shadowBlur=40*flicker;
  ctx.fillStyle=`rgba(255,100,0,${0.18*flicker})`; ctx.fillRect(0,0,W,H);
  ctx.shadowBlur=0;
  // Stone corridor perspective walls
  const vanX=W/2, vanY=H*.32;
  ctx.fillStyle='#1a1010';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(vanX-60,vanY); ctx.lineTo(vanX+60,vanY); ctx.lineTo(W,0); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(vanX-60,vanY); ctx.lineTo(vanX+60,vanY); ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#111'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,H); ctx.lineTo(vanX-60,vanY); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#111'; ctx.beginPath(); ctx.moveTo(W,0); ctx.lineTo(W,H); ctx.lineTo(vanX+60,vanY); ctx.closePath(); ctx.fill();
  // Stone block lines
  ctx.strokeStyle='rgba(255,255,255,.07)'; ctx.lineWidth=1;
  for(let i=1;i<5;i++){const t=i/5;const lx=vanX-60*t,rx=vanX+60*t,ly=vanY+(H/2-vanY)*t;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(rx,ly);ctx.stroke();}
  for(let i=1;i<4;i++){const t=i/4;ctx.beginPath();ctx.moveTo(0,H*t);ctx.lineTo(vanX-60*(1-t*.7),vanY+(H/2-vanY)*(1-t*.7));ctx.stroke();}
  // Torch on wall
  const tx=W*.18, ty=H*.45;
  ctx.shadowColor=`rgba(255,120,0,${flicker})`; ctx.shadowBlur=24*flicker;
  ctx.fillStyle='#8B4513'; ctx.fillRect(tx-3,ty-14,6,14);
  ctx.fillStyle=`rgba(255,${120+Math.sin(f*.13)*40},0,${0.9*flicker})`;
  ctx.beginPath(); ctx.ellipse(tx,ty-18,5+flicker*3,8+flicker*4,0,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  // Monster glowing red eyes in tunnel
  const eyeDrift=Math.sin(f*.025)*10;
  [[-16,0],[16,0]].forEach(([ex])=>{
    ctx.shadowColor='#ff0000'; ctx.shadowBlur=12+Math.sin(f*.07)*5;
    ctx.fillStyle='rgba(255,0,0,.85)';
    ctx.beginPath(); ctx.ellipse(vanX+ex+eyeDrift,vanY-5,4,3,0,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  });
  // Armored knight silhouette (bottom left)
  const kx=W*.22, ky=H*.75;
  ctx.fillStyle='rgba(60,55,65,.95)';
  ctx.fillRect(kx-10,ky-45,20,32); // body
  ctx.beginPath(); ctx.arc(kx,ky-50,11,0,Math.PI*2); ctx.fill(); // helm
  ctx.fillStyle='rgba(180,160,100,.4)'; ctx.fillRect(kx-2,ky-46,4,28); // sword highlight
  ctx.fillStyle='rgba(60,55,65,.95)'; ctx.fillRect(kx-16,ky-38,8,22); // shield arm
  ctx.fillStyle='rgba(180,150,80,.6)'; ctx.fillRect(kx-18,ky-40,10,24); // shield face
  ctx.shadowColor=`rgba(255,120,0,${flicker*.7})`; ctx.shadowBlur=15*flicker;
  ctx.strokeStyle=`rgba(255,120,0,${0.3*flicker})`; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(kx,ky-50,11,0,Math.PI*2); ctx.stroke();
  ctx.shadowBlur=0;
};

ANIM.neonBrawl = function(ctx,W,H,f){
  bg(ctx,W,H,'#06000f','#0d0018');
  // Arena floor
  ctx.fillStyle='rgba(255,255,255,.04)'; ctx.fillRect(0,H*.72,W,H*.28);
  ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(W/2,H*.72); ctx.lineTo(W/2,H); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2,H*.72,40,0,Math.PI*2); ctx.stroke();
  // HP bars
  const hp1=0.72, hp2=0.48;
  ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(10,8,W*.35,10);
  ctx.fillStyle='#00ffcc'; ctx.fillRect(10,8,W*.35*hp1,10);
  ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(W-10-W*.35,8,W*.35,10);
  ctx.fillStyle='#ff4466'; ctx.fillRect(W-10-W*.35*hp2,8,W*.35*hp2,10);
  // Fighter 1 (blue, left)
  const p1x=W*.3+Math.sin(f*.04)*8, p1y=H*.62;
  const punch1=Math.sin(f*.12)>.5;
  ctx.save(); ctx.translate(p1x,p1y);
  ctx.shadowColor='#00aaff'; ctx.shadowBlur=18;
  ctx.fillStyle='#0066cc'; ctx.fillRect(-10,-36,20,28); // body
  ctx.fillStyle='#44aaee'; ctx.beginPath(); ctx.arc(0,-42,12,0,Math.PI*2); ctx.fill(); // head
  ctx.fillStyle='rgba(100,220,255,.6)'; ctx.beginPath(); ctx.arc(2,-44,6,0,Math.PI); ctx.fill(); // visor
  ctx.fillStyle='#0055bb';
  ctx.fillRect(-10,-8,8,22); ctx.fillRect(2,-8,8,22); // legs
  if(punch1){ ctx.fillStyle='#44aaee'; ctx.fillRect(10,-28,22,10); // punch arm
    ctx.shadowColor='rgba(255,255,255,.8)'; ctx.shadowBlur=20; ctx.fillStyle='rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.arc(32,-23,8,0,Math.PI*2); ctx.fill(); }
  else { ctx.fillStyle='#44aaee'; ctx.fillRect(12,-32,10,10); ctx.fillRect(-22,-32,10,10); }
  ctx.shadowBlur=0; ctx.restore();
  // Fighter 2 (red, right)
  const p2x=W*.7+Math.sin(f*.04+Math.PI)*8, p2y=H*.62;
  const punch2=Math.sin(f*.12+1.5)>.5;
  ctx.save(); ctx.translate(p2x,p2y); ctx.scale(-1,1);
  ctx.shadowColor='#ff4466'; ctx.shadowBlur=18;
  ctx.fillStyle='#aa2233'; ctx.fillRect(-10,-36,20,28);
  ctx.fillStyle='#ee5566'; ctx.beginPath(); ctx.arc(0,-42,12,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,100,120,.5)'; ctx.beginPath(); ctx.arc(2,-44,6,0,Math.PI); ctx.fill();
  ctx.fillStyle='#991122'; ctx.fillRect(-10,-8,8,22); ctx.fillRect(2,-8,8,22);
  if(punch2){ ctx.fillStyle='#ee5566'; ctx.fillRect(10,-28,22,10);
    ctx.shadowColor='rgba(255,100,100,.8)'; ctx.shadowBlur=20; ctx.fillStyle='rgba(255,80,80,.5)';
    ctx.beginPath(); ctx.arc(32,-23,8,0,Math.PI*2); ctx.fill(); }
  else { ctx.fillStyle='#ee5566'; ctx.fillRect(12,-32,10,10); ctx.fillRect(-22,-32,10,10); }
  ctx.shadowBlur=0; ctx.restore();
  // Impact flash
  if(punch1&&punch2){ ctx.fillStyle='rgba(255,255,200,.12)'; ctx.fillRect(0,0,W,H); }
};

ANIM.bubbleBlast = function(ctx,W,H,f){
  bg(ctx,W,H,'#06021a','#0d0530');
  // Hex bubble grid
  const hues=[0,60,120,180,240,300];
  const R=22, cols=8, rows=4;
  const HEX_W=R*1.73, HEX_H=R*2;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const hue=hues[(r*cols+c)%6];
    const ox=(r%2)*.5*HEX_W;
    const cx2=(c+.5)*HEX_W+ox+4, cy2=r*HEX_H*.75+R+10;
    const pulse=0.8+Math.sin(f*.06+(r*cols+c)*.4)*.2;
    // Hex outline
    ctx.shadowColor=`hsl(${hue},100%,60%)`; ctx.shadowBlur=10*pulse;
    ctx.strokeStyle=`hsl(${hue},80%,55%)`; ctx.lineWidth=2;
    ctx.beginPath();
    for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/6;i===0?ctx.moveTo(cx2+Math.cos(a)*R,cy2+Math.sin(a)*R):ctx.lineTo(cx2+Math.cos(a)*R,cy2+Math.sin(a)*R);}
    ctx.closePath(); ctx.stroke();
    // Bubble fill
    const fillG=ctx.createRadialGradient(cx2-R*.3,cy2-R*.3,0,cx2,cy2,R);
    fillG.addColorStop(0,`hsla(${hue},60%,80%,.22)`); fillG.addColorStop(1,`hsla(${hue},80%,30%,.35)`);
    ctx.fillStyle=fillG; ctx.fill();
    // Specular highlight
    ctx.fillStyle='rgba(255,255,255,.15)';
    ctx.beginPath(); ctx.ellipse(cx2-R*.28,cy2-R*.28,R*.3,R*.18,-Math.PI/4,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }
  // Cannon at bottom center
  const canX=W/2, canY=H-18;
  ctx.fillStyle='#2a2a4a'; ctx.beginPath(); ctx.roundRect(canX-14,canY-8,28,22,4); ctx.fill();
  ctx.fillStyle='rgba(180,160,255,.6)'; ctx.fillRect(canX-5,canY-22,10,18);
  // Aim line
  const aimAng=-Math.PI/2+Math.sin(f*.03)*.5;
  ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1.5; ctx.setLineDash([5,8]);
  ctx.beginPath(); ctx.moveTo(canX,canY-22); ctx.lineTo(canX+Math.cos(aimAng)*70,canY-22+Math.sin(aimAng)*70); ctx.stroke();
  ctx.setLineDash([]);
  // Loaded bubble
  const loadHue=hues[Math.floor(f/30)%6];
  ctx.shadowColor=`hsl(${loadHue},100%,60%)`; ctx.shadowBlur=12;
  ctx.fillStyle=`hsl(${loadHue},80%,60%)`;
  ctx.beginPath(); ctx.arc(canX,canY-28,9,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(canX-3,canY-31,4,2.5,-.4,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  // Flying bubble from cannon
  const fb={x:canX+Math.cos(aimAng)*(f%60)*2,y:canY-22+Math.sin(aimAng)*(f%60)*2};
  if(f%60<50){
    ctx.shadowColor=`hsl(${loadHue},100%,60%)`; ctx.shadowBlur=10;
    ctx.fillStyle=`hsla(${loadHue},80%,60%,.85)`;
    ctx.beginPath(); ctx.arc(fb.x,fb.y,8,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.3)'; ctx.beginPath(); ctx.ellipse(fb.x-2,fb.y-2,3,2,-.4,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }
};

ANIM.roadRush = function(ctx,W,H,f){
  bg(ctx,W,H,'#070a0d','#0d1218');
  // Vanishing point perspective road
  const vanX=W/2, vanY=H*.28;
  // Sky gradient
  const sky=ctx.createLinearGradient(0,0,0,vanY);
  sky.addColorStop(0,'#0a1428'); sky.addColorStop(1,'#1a2a3a');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,vanY);
  // Road surface
  ctx.fillStyle='#2a2a2a';
  ctx.beginPath(); ctx.moveTo(vanX-8,vanY); ctx.lineTo(0,H); ctx.lineTo(W,H); ctx.lineTo(vanX+8,vanY); ctx.closePath(); ctx.fill();
  // Road edges (perspective lines)
  ctx.strokeStyle='rgba(255,220,0,.6)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(vanX-8,vanY); ctx.lineTo(0,H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(vanX+8,vanY); ctx.lineTo(W,H); ctx.stroke();
  // Centre lane markings (scrolling)
  for(let i=0;i<8;i++){
    const t=((i/8)+f*.012)%1;
    const lw=4+t*20, ly=vanY+t*(H-vanY);
    const lx1=vanX-lw/2, lx2=vanX+lw/2;
    ctx.fillStyle=`rgba(255,255,255,${0.6*t})`;
    ctx.fillRect(lx1,ly,lx2-lx1,Math.max(1,t*12));
  }
  // Verges (grass)
  ctx.fillStyle='#1a3a0a';
  ctx.beginPath(); ctx.moveTo(0,vanY); ctx.lineTo(vanX-8,vanY); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(W,vanY); ctx.lineTo(vanX+8,vanY); ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  // Traffic cars (scrolling toward camera)
  const cars=[{lane:-.22,offset:0,col:'#cc3311'},{lane:.22,offset:.4,col:'#1133cc'},{lane:0,offset:.7,col:'#11aa33'}];
  cars.forEach(car=>{
    const t=((car.offset+f*.014)%1);
    const cw=Math.max(2,t*32), ch=Math.max(1,t*18);
    const cx=vanX+car.lane*t*(W*.9);
    const cy=vanY+t*(H-vanY);
    ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillRect(cx-cw/2+2,cy+2,cw,ch);
    ctx.fillStyle=car.col; ctx.beginPath(); ctx.roundRect(cx-cw/2,cy,cw,ch,2); ctx.fill();
    ctx.fillStyle='rgba(255,255,200,.6)'; ctx.fillRect(cx-cw/2+2,cy+2,cw*.35,ch*.35);
    ctx.fillRect(cx+cw*.13,cy+2,cw*.35,ch*.35);
  });
  // Player car (bottom centre, drifting left/right)
  const px=W/2+Math.sin(f*.03)*45, py=H-30;
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(px+3,py+5,20,8,0,0,Math.PI*2); ctx.fill();
  ctx.shadowColor='#ff4422'; ctx.shadowBlur=12;
  ctx.fillStyle='#cc2211'; ctx.beginPath(); ctx.roundRect(px-16,py-20,32,22,4); ctx.fill();
  ctx.fillStyle='rgba(100,200,255,.65)'; ctx.beginPath(); ctx.roundRect(px-10,py-18,18,8,2); ctx.fill();
  ctx.shadowBlur=0;
  // Speed lines
  for(let i=0;i<6;i++){const lx=px-25+i*10,la=0.1+i*.07;ctx.strokeStyle=`rgba(255,255,255,${la*.5})`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(lx,py-5);ctx.lineTo(lx-(i-3)*3,py+30);ctx.stroke();}
};

ANIM.penaltyFever = function(ctx,W,H,f){
  bg(ctx,W,H,'#030d03','#061a08');
  // Grass with subtle stripes
  for(let i=0;i<8;i++){ctx.fillStyle=i%2?'rgba(0,0,0,.06)':'rgba(255,255,255,.03)';ctx.fillRect(i*(W/8),0,W/8,H);}
  // Crowd silhouette
  ctx.fillStyle='rgba(0,0,0,.55)';
  for(let i=0;i<30;i++){ctx.beginPath();ctx.arc(i*(W/30)+W/60,H*.12-Math.sin(i*.7)*12,7+Math.sin(i*.5)*3,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='rgba(255,255,100,.08)'; ctx.fillRect(0,0,W,H*.14); // stadium lights tint
  // Goal net
  ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1;
  for(let x=W*.2;x<=W*.8;x+=15){ctx.beginPath();ctx.moveTo(x,H*.14);ctx.lineTo(x,H*.46);ctx.stroke();}
  for(let y=H*.14;y<=H*.46;y+=10){ctx.beginPath();ctx.moveTo(W*.2,y);ctx.lineTo(W*.8,y);ctx.stroke();}
  // Goal posts and crossbar
  ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(W*.2,H*.14); ctx.lineTo(W*.2,H*.46); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W*.8,H*.14); ctx.lineTo(W*.8,H*.46); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W*.2,H*.14); ctx.lineTo(W*.8,H*.14); ctx.stroke();
  // Goalkeeper (diving)
  const diveT=Math.sin(f*.04);
  const gkX=W*.5+diveT*W*.22, gkY=H*.32;
  ctx.save(); ctx.translate(gkX,gkY); ctx.rotate(diveT*.4);
  ctx.fillStyle='#ff8800'; // kit
  ctx.beginPath(); ctx.roundRect(-12,-14,24,20,4); ctx.fill();

  ctx.fillStyle='#ff8800'; ctx.fillRect(-18,-18,8,10); ctx.fillRect(10,-18,8,10); // arms
  ctx.restore();
  // Ball in arc
  const bt=((f*.025)%1);
  const ballX=W*.28+bt*W*.44;

  ctx.shadowColor='rgba(255,255,255,.6)'; ctx.shadowBlur=10;
  const ballG=ctx.createRadialGradient(ballX-4,ballY-4,0,ballX,ballY,10);
  ballG.addColorStop(0,'#ffffff'); ballG.addColorStop(1,'#cccccc');
  ctx.fillStyle=ballG; ctx.beginPath(); ctx.arc(ballX,ballY,10,0,Math.PI*2); ctx.fill();
  // Panel lines on ball
  ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(ballX,ballY,10,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ballX-5,ballY-8); ctx.lineTo(ballX+3,ballY-5); ctx.lineTo(ballX+5,ballY+2); ctx.lineTo(ballX-3,ballY+6); ctx.closePath(); ctx.fillStyle='rgba(0,0,0,.2)'; ctx.fill();
  ctx.shadowBlur=0;
};

ANIM.lilChef = function(ctx,W,H,f){
  bg(ctx,W,H,'#1a0c04','#280e06');
  // Kitchen counter
  ctx.fillStyle='#5a3a1a'; ctx.fillRect(0,H*.7,W,H*.3);
  ctx.fillStyle='#8a6a4a'; ctx.fillRect(0,H*.7,W,8);
  // Kitchen tiles on wall
  ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.lineWidth=.5;
  for(let x=0;x<W;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H*.7);ctx.stroke();}
  for(let y=0;y<H*.7;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // Frying pan
  const panX=W*.58, panY=H*.64;
  ctx.fillStyle='#2a2a2a'; ctx.beginPath(); ctx.ellipse(panX,panY,38,20,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1a1a1a'; ctx.fillRect(panX+30,panY-5,30,10);
  ctx.strokeStyle='#444'; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(panX,panY,38,20,0,0,Math.PI*2); ctx.stroke();
  // Pan contents (sizzling)
  ctx.fillStyle='rgba(255,180,0,.85)'; ctx.beginPath(); ctx.ellipse(panX,panY,28,14,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.7)'; ctx.beginPath(); ctx.ellipse(panX,panY-4,10,6,0,0,Math.PI*2); ctx.fill();
  // Steam from pan
  for(let i=0;i<3;i++){
    const sx=panX-14+i*14, sy=panY-20-((f*1.2+i*22)%35);
    const sa=0.5-((f*1.2+i*22)%35)/35*.5;
    ctx.strokeStyle=`rgba(255,255,255,${sa})`; ctx.lineWidth=2; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(sx,sy); ctx.bezierCurveTo(sx+8,sy-10,sx-8,sy-20,sx+5,sy-30); ctx.stroke();
  }
  // Falling ingredients
  const ingr=[{x:W*.28,col:'#cc2211',r:9,shape:'tomato'},{x:W*.18,col:'#44aa22',r:7,shape:'herb'},{x:W*.38,col:'#ff8800',r:8,shape:'carrot'}];
  ingr.forEach((it,i)=>{
    const fy=(H*.1+(f*1.4+i*55)%H*.7);
    ctx.shadowColor=it.col; ctx.shadowBlur=6;
    ctx.fillStyle=it.col;
    ctx.beginPath(); ctx.arc(it.x,fy,it.r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.25)'; ctx.beginPath(); ctx.ellipse(it.x-2,fy-3,it.r*.4,it.r*.25,-.3,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  });
  // Cute chef character
  const chefX=W*.3, chefY=H*.68;
  // Body
  ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.roundRect(chefX-11,chefY-32,22,24,4); ctx.fill();
  ctx.fillStyle='#cccccc'; ctx.fillRect(chefX-13,chefY-28,4,16); ctx.fillRect(chefX+9,chefY-28,4,16); // arms
  // Head
  ctx.fillStyle='#f5d5a0'; ctx.beginPath(); ctx.arc(chefX,chefY-38,13,0,Math.PI*2); ctx.fill();
  // Chef hat (tall white)
  ctx.fillStyle='white'; ctx.beginPath(); ctx.roundRect(chefX-10,chefY-70,20,32,3); ctx.fill();
  ctx.fillRect(chefX-13,chefY-50,26,10);
  // Face
  ctx.fillStyle='#333'; ctx.beginPath(); ctx.arc(chefX-4,chefY-39,2,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(chefX+4,chefY-39,2,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#c47a4a'; ctx.lineWidth=1.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(chefX,chefY-33,4,0.2,Math.PI-.2); ctx.stroke();
  // Ladle
  const ladAng=Math.sin(f*.07)*.35;
  ctx.save(); ctx.translate(chefX+13,chefY-26); ctx.rotate(ladAng);
  ctx.strokeStyle='#888'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(16,10); ctx.stroke();
  ctx.fillStyle='#999'; ctx.beginPath(); ctx.arc(16,10,7,0,Math.PI*2); ctx.fill();
  ctx.restore();
};

ANIM.dinoJump = function(ctx,W,H,f){
  // Sky - pixel-style light desert
  bg(ctx,W,H,'#e8d090','#f0d8a0');
  // Ground
  ctx.fillStyle='#c8a850'; ctx.fillRect(0,H*.72,W,H*.28);
  ctx.fillStyle='#b89840'; ctx.fillRect(0,H*.72,W,5);
  // Clouds
  [[W*.2,H*.15],[W*.6,H*.1],[W*.82,H*.2]].forEach(([cx,cy])=>{
    ctx.fillStyle='rgba(255,255,255,.75)';
    ctx.beginPath(); ctx.ellipse(cx,cy,22,10,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx-14,cy+4,15,8,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+12,cy+5,14,7,0,0,Math.PI*2); ctx.fill();
  });
  // Score/distance display
  ctx.fillStyle='rgba(0,0,0,.55)'; ctx.font='bold 11px monospace';
  ctx.textAlign='right'; ctx.textBaseline='top';
  ctx.fillText(`HI ${String(Math.floor(f*.4)+1200).padStart(5,'0')}  ${String(Math.floor(f*.4)).padStart(5,'0')}`, W-10, 10);
  // Cacti (scrolling)
  [[0,22,42],[1,15,28],[2,18,38]].forEach(([i,w,h])=>{
    const cx=(W+40-(f*3+i*160)%(W+120));
    if(cx>-30&&cx<W+10){
      ctx.fillStyle='#4a8a2a';
      ctx.fillRect(cx-w/2,H*.72-h,w,h); // main trunk
      ctx.fillRect(cx-w/2-w*.6,H*.72-h*.6,w*.5,h*.3); // left arm
      ctx.fillRect(cx+w/2,H*.72-h*.7,w*.5,h*.3); // right arm
      ctx.fillRect(cx-w/2-w*.6,H*.72-h*.6-h*.15,w*.5,h*.15); // left top
      ctx.fillRect(cx+w/2,H*.72-h*.7-h*.15,w*.5,h*.15); // right top
    }
  });
  // T-Rex character
  const groundY=H*.72;
  const jh=Math.abs(Math.sin(f*.07));
  const jy=groundY-jh*72;
  const dinoX=W*.25;
  // Shadow
  ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(dinoX+5,groundY+3,20*(.3+jh*.7),4,0,0,Math.PI*2); ctx.fill();
  // Body
  ctx.fillStyle='#555'; ctx.beginPath(); ctx.roundRect(dinoX-10,jy-28,30,24,5); ctx.fill();
  // Head
  ctx.fillStyle='#555'; ctx.beginPath(); ctx.roundRect(dinoX+8,jy-40,22,18,5); ctx.fill();
  // Jaw
  ctx.fillStyle='#555'; ctx.beginPath(); ctx.roundRect(dinoX+8,jy-24,20,10,3); ctx.fill();
  // Eye
  ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(dinoX+22,jy-34,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(dinoX+23,jy-34,2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.8)'; ctx.beginPath(); ctx.arc(dinoX+22,jy-35,1,0,Math.PI*2); ctx.fill();
  // Tiny arms
  ctx.fillStyle='#666'; ctx.fillRect(dinoX+8,jy-24,8,6);
  // Legs (animate when on ground)
  const legA=jh>.1?0:Math.sin(f*.18)*.4;
  ctx.fillStyle='#555';
  ctx.save(); ctx.translate(dinoX+2,jy-6); ctx.rotate(-legA); ctx.fillRect(-5,0,8,18); ctx.restore();
  ctx.save(); ctx.translate(dinoX+12,jy-6); ctx.rotate(legA); ctx.fillRect(-3,0,8,18); ctx.restore();
  // Tail
  ctx.fillStyle='#555'; ctx.beginPath(); ctx.moveTo(dinoX-10,jy-14); ctx.lineTo(dinoX-30,jy-8); ctx.lineTo(dinoX-28,jy-18); ctx.closePath(); ctx.fill();
  // Pterodactyl (high up, moving left)
  const ptX=(W+100-(f*2.2)%(W+200));
  const ptY=H*.2+Math.sin(f*.04)*18;
  const wingF=Math.sin(f*.18)*.4;
  ctx.fillStyle='#777';
  ctx.save(); ctx.translate(ptX,ptY);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-24,-8+wingF*10); ctx.lineTo(-18,0); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(24,-8+wingF*10); ctx.lineTo(18,0); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-6,-4,16,8,4); ctx.fill();
  ctx.restore();
};

ANIM.spaceBlaster = function(ctx,W,H,f){
  bg(ctx,W,H,'#010508','#020a14');
  star(ctx,W,H,f);
  // Formation bob
  const bob=Math.sin(f*.025)*6;
  const formX=Math.sin(f*.015)*W*.12;
  // 3 alien rows: row 0=squid(pink), row 1=crab(green), row 2=ufo(cyan)
  const cols=5, rowDefs=[{hue:300,y:H*.14},{hue:120,y:H*.26},{hue:190,y:H*.38}];
  rowDefs.forEach(({hue,y},row)=>{
    for(let c=0;c<cols;c++){
      const ax=W*.12+c*(W*.16)+formX;
      const ay=y+bob;
      ctx.save(); ctx.translate(ax,ay);
      // Glow
      ctx.shadowColor=`hsl(${hue},100%,55%)`; ctx.shadowBlur=10;
      ctx.fillStyle=`hsl(${hue},80%,55%)`;
      if(row===0){
        // Squid: round body + tentacles
        ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2); ctx.fill();
        ctx.fillStyle=`hsl(${hue},80%,70%)`;
        for(let t=-1;t<=1;t+=2){ ctx.fillRect(t*5,5,3,5); ctx.fillRect(t*10,3,3,7); }
        ctx.fillRect(-2,5,4,8);
        // Eyes
        ctx.fillStyle='black'; ctx.beginPath(); ctx.arc(-3,-1,2,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(3,-1,2,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(-2,-1.5,1,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(4,-1.5,1,0,Math.PI*2); ctx.fill();
      } else if(row===1){
        // Crab: wide body + claws
        ctx.fillRect(-10,-6,20,10);
        ctx.fillStyle=`hsl(${hue},80%,70%)`;
        ctx.fillRect(-16,-4,8,6); ctx.fillRect(8,-4,8,6); // arms
        ctx.fillRect(-18,-8,4,5); ctx.fillRect(14,-8,4,5); // claws
        ctx.fillStyle=`hsl(${hue},80%,55%)`;
        // Legs
        for(let l=0;l<3;l++){ ctx.fillRect(-8+l*6,4,3,6); }
        // Eyes
        ctx.fillStyle='black'; ctx.beginPath(); ctx.arc(-4,-2,2,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(4,-2,2,0,Math.PI*2); ctx.fill();
      } else {
        // UFO: saucer shape
        ctx.beginPath(); ctx.ellipse(0,2,12,5,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle=`hsl(${hue},80%,75%)`;
        ctx.beginPath(); ctx.ellipse(0,-2,7,5,0,0,Math.PI*2); ctx.fill();
        // Portholes
        ctx.fillStyle='rgba(0,0,0,.5)';
        for(let p=-1;p<=1;p++){ ctx.beginPath(); ctx.arc(p*4,2,1.5,0,Math.PI*2); ctx.fill(); }
      }
      ctx.shadowBlur=0;
      ctx.restore();
    }
  });
  // Player ship
  const sx=W*.5+Math.sin(f*.04)*W*.3;
  const shipY=H*.83;
  ctx.save(); ctx.translate(sx,shipY);
  ctx.shadowColor='#44aaff'; ctx.shadowBlur=16;
  const sg=ctx.createLinearGradient(0,-20,0,14);
  sg.addColorStop(0,'#88ccff'); sg.addColorStop(1,'#1155aa');
  ctx.fillStyle=sg;
  ctx.beginPath(); ctx.moveTo(0,-20); ctx.lineTo(-16,14); ctx.lineTo(16,14); ctx.closePath(); ctx.fill();
  // Cockpit
  ctx.fillStyle='rgba(150,220,255,.7)'; ctx.beginPath(); ctx.ellipse(0,-4,6,10,0,0,Math.PI*2); ctx.fill();
  // Wings
  ctx.fillStyle='#2266bb';
  ctx.beginPath(); ctx.moveTo(-16,14); ctx.lineTo(-28,20); ctx.lineTo(-10,14); ctx.fill();
  ctx.beginPath(); ctx.moveTo(16,14); ctx.lineTo(28,20); ctx.lineTo(10,14); ctx.fill();
  // Exhaust
  const exFlicker=0.5+Math.random()*.5;
  ctx.fillStyle=`rgba(80,180,255,${exFlicker})`;
  ctx.beginPath(); ctx.moveTo(-8,14); ctx.lineTo(0,14+16*exFlicker); ctx.lineTo(8,14); ctx.fill();
  ctx.shadowBlur=0; ctx.restore();
  // Laser bolt
  const lt=(f*1.4)%100;
  if(lt<70){
    const ly=H*.83-(lt/70)*H*.7;
    ctx.strokeStyle='rgba(255,255,100,.9)'; ctx.lineWidth=3;
    ctx.shadowColor='yellow'; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.moveTo(sx,ly); ctx.lineTo(sx,ly-18); ctx.stroke();
    ctx.shadowBlur=0;
  }
  // Explosion flash on alien hit
  const hitRow=Math.floor(f/40)%3;
  const hitCol=Math.floor(f/13)%cols;
  const hdef=rowDefs[hitRow];
  const hax=W*.12+hitCol*W*.16+formX;
  if(lt>60&&lt<80){
    const ea=(80-lt)/20;
    ctx.fillStyle=`rgba(255,200,50,${ea*.8})`;
    ctx.beginPath(); ctx.arc(hax,hdef.y+bob,18*ea,0,Math.PI*2); ctx.fill();
    for(let sp=0;sp<6;sp++){
      const sa=(sp/6)*Math.PI*2; const sr=20*ea;
      ctx.fillStyle=`rgba(255,120,0,${ea*.7})`;
      ctx.beginPath(); ctx.arc(hax+Math.cos(sa)*sr,hdef.y+bob+Math.sin(sa)*sr,4*ea,0,Math.PI*2); ctx.fill();
    }
  }
  // Score
  ctx.fillStyle='rgba(100,200,255,.7)'; ctx.font='bold 11px monospace';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(`SCORE ${(Math.floor(f*.3)*10).toString().padStart(5,'0')}`, 8, 8);
};

ANIM.memoryMatch = function(ctx,W,H,f){
  bg(ctx,W,H,'#0d1a2e','#162440');
  // Felt table surface
  ctx.fillStyle='rgba(10,60,30,.35)'; ctx.fillRect(0,H*.55,W,H*.45);
  ctx.strokeStyle='rgba(80,180,80,.12)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,H*.55); ctx.lineTo(W,H*.55); ctx.stroke();
  // Card grid: 4 cols x 3 rows
  const cols=4, rows=3, total=cols*rows;
  const cw=W*.19, ch=H*.24, padX=(W-cols*cw)/(cols+1), padY=(H-.06*H-rows*ch)/(rows+1);
  // Symbol pairs (6 pairs for 12 cards)
  const symbols=['&#xE2;&#x2122;&#xA0;','&#xE2;&#x2122;&#xA5;','&#xE2;&#x2122;&#xA6;','&#xE2;&#x2122;&#xA3;','&#x2605;','&#xE2;&#x2122;&#xAB;','&#xE2;&#x2122;&#xA0;','&#xE2;&#x2122;&#xA5;','&#xE2;&#x2122;&#xA6;','&#xE2;&#x2122;&#xA3;','&#x2605;','&#xE2;&#x2122;&#xAB;'];
  const symColors=['#aaddff','#ff6680','#ff9944','#aaddff','#ffee44','#cc88ff','#aaddff','#ff6680','#ff9944','#aaddff','#ffee44','#cc88ff'];
  // Animate: cycle through revealing pairs
  const revealCycle=Math.floor(f/90)%6;
  const revealT=(f%90)/90;
  // Two cards revealed at a time (matching pair)
  const pair1=revealCycle*2, pair2=revealCycle*2+1;
  // Matched pairs (earlier cycles): first 2 cycles are "matched" = face-up with green glow
  const matchedPairs=Math.floor(f/360)%3;
  for(let i=0;i<total;i++){
    const c=i%cols, r=Math.floor(i/cols);
    const x=padX+(c+.5)*cw+c*padX;
    const y=H*.03+padY+(r+.5)*ch+r*padY;
    const isReveal=(i===pair1||i===pair2)&&revealT<.75;
    const isMatched=i<matchedPairs*2;
    // Flip animation
    const scaleX=isReveal?Math.abs(Math.cos(revealT*Math.PI)):1;
    const faceUp=isReveal&&revealT>.5;
    ctx.save(); ctx.translate(x,y); ctx.scale(scaleX,1);
    // Shadow
    ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=8; ctx.shadowOffsetY=3;
    if(faceUp||isMatched){
      // Face-up card
      const cg=ctx.createLinearGradient(-cw/2,-ch/2,cw/2,ch/2);
      cg.addColorStop(0,'#2a1a4a'); cg.addColorStop(1,'#1a1038');
      ctx.fillStyle=cg;
      ctx.beginPath(); ctx.roundRect(-cw/2,-ch/2,cw,ch,5); ctx.fill();
      ctx.shadowBlur=0;
      // Border
      if(isMatched){
        ctx.strokeStyle='rgba(80,255,120,.7)'; ctx.lineWidth=2;
        ctx.shadowColor='rgba(80,255,120,.5)'; ctx.shadowBlur=12;
      } else {
        ctx.strokeStyle='rgba(180,120,255,.5)'; ctx.lineWidth=1.5;
      }
      ctx.beginPath(); ctx.roundRect(-cw/2,-ch/2,cw,ch,5); ctx.stroke();
      ctx.shadowBlur=0;
      // Symbol
      ctx.fillStyle=symColors[i]; ctx.font=`bold ${Math.round(ch*.38)}px serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(symbols[i],0,0);
      // Corner labels
      ctx.font=`bold ${Math.round(ch*.17)}px serif`;
      ctx.fillText(symbols[i],-cw*.35,-ch*.35);
      ctx.save(); ctx.scale(-1,-1); ctx.fillText(symbols[i],-cw*.35,-ch*.35); ctx.restore();
    } else {
      // Face-down card
      const bg2=ctx.createLinearGradient(-cw/2,-ch/2,cw/2,ch/2);
      bg2.addColorStop(0,'#1e3a6e'); bg2.addColorStop(1,'#122855');
      ctx.fillStyle=bg2;
      ctx.beginPath(); ctx.roundRect(-cw/2,-ch/2,cw,ch,5); ctx.fill();
      ctx.shadowBlur=0;
      ctx.strokeStyle='rgba(80,140,255,.35)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.roundRect(-cw/2,-ch/2,cw,ch,5); ctx.stroke();
      // Back pattern: diamond grid
      ctx.strokeStyle='rgba(100,160,255,.2)'; ctx.lineWidth=1;
      const step=cw*.22;
      for(let di=-2;di<=2;di++){
        for(let dj=-2;dj<=2;dj++){
          ctx.beginPath();
          ctx.moveTo(di*step,dj*step-step/2);
          ctx.lineTo(di*step+step/2,dj*step);
          ctx.lineTo(di*step,dj*step+step/2);
          ctx.lineTo(di*step-step/2,dj*step);
          ctx.closePath(); ctx.stroke();
        }
      }
      // Center diamond
      ctx.fillStyle='rgba(80,140,255,.15)';
      ctx.beginPath(); ctx.moveTo(0,-ch*.18); ctx.lineTo(cw*.12,0); ctx.lineTo(0,ch*.18); ctx.lineTo(-cw*.12,0); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  // HUD
  ctx.fillStyle='rgba(180,220,255,.7)'; ctx.font='bold 11px monospace';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(`PAIRS: ${matchedPairs} / 6`, 10, 8);
  ctx.textAlign='right';
  ctx.fillText(`MOVES: ${Math.floor(f*.12)}`, W-10, 8);
};

ANIM.moleBash = function(ctx,W,H,f){
  // Sky and grass
  bg(ctx,W,H,'#87ceeb','#4a9e3f');
  // Clouds
  [[W*.2,H*.1],[W*.65,H*.07]].forEach(([cx,cy])=>{
    ctx.fillStyle='rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.ellipse(cx,cy,30,14,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx-18,cy+6,20,10,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+16,cy+7,18,10,0,0,Math.PI*2); ctx.fill();
  });
  // Ground strip
  ctx.fillStyle='#5ab040'; ctx.fillRect(0,H*.65,W,H*.35);
  ctx.fillStyle='#3d7a2a'; ctx.fillRect(0,H*.65,W,6);
  // Grass tufts
  ctx.strokeStyle='#2d6a1a'; ctx.lineWidth=2;
  for(let g=0;g<12;g++){
    const gx=g*(W/11);
    ctx.beginPath(); ctx.moveTo(gx,H*.65); ctx.lineTo(gx-4,H*.58); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gx,H*.65); ctx.lineTo(gx+4,H*.57); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gx,H*.65); ctx.lineTo(gx,H*.55); ctx.stroke();
  }
  // Score HUD
  ctx.fillStyle='rgba(0,0,0,.55)'; ctx.font='bold 12px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText(`SCORE: ${Math.floor(f*.8)*10}`, W*.5, 8);
  // 6 holes (3x2 grid)
  const holes=[[W*.17,H*.72],[W*.5,H*.72],[W*.83,H*.72],[W*.17,H*.9],[W*.5,H*.9],[W*.83,H*.9]];
  const activeIdx=Math.floor(f/35)%6;
  const popT=(f%35)/35;
  holes.forEach(([hx,hy],i)=>{
    // Hole shadow
    ctx.fillStyle='rgba(0,0,0,.55)'; ctx.beginPath(); ctx.ellipse(hx,hy,22,10,0,0,Math.PI*2); ctx.fill();
    // Hole rim
    ctx.fillStyle='#2a1800'; ctx.beginPath(); ctx.ellipse(hx,hy,20,9,0,0,Math.PI*2); ctx.fill();
    if(i===activeIdx&&popT<.75){
      const phase=popT<.4?popT/.4:1-(popT-.4)/.35;
      const moleY=hy-phase*32;
      // Mole body
      ctx.fillStyle='#8b5e3c';
      ctx.beginPath(); ctx.ellipse(hx,moleY,13,15,0,0,Math.PI*2); ctx.fill();
      // Mole face
      ctx.fillStyle='#c8906a'; ctx.beginPath(); ctx.ellipse(hx,moleY-4,9,10,0,0,Math.PI*2); ctx.fill();
      // Eyes
      ctx.fillStyle='black'; ctx.beginPath(); ctx.arc(hx-4,moleY-6,2,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(hx+4,moleY-6,2,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(hx-3,moleY-7,1,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(hx+5,moleY-7,1,0,Math.PI*2); ctx.fill();
      // Nose
      ctx.fillStyle='#ff9999'; ctx.beginPath(); ctx.ellipse(hx,moleY-3,3,2,0,0,Math.PI*2); ctx.fill();
      // Ears
      ctx.fillStyle='#8b5e3c';
      ctx.beginPath(); ctx.ellipse(hx-9,moleY-10,4,5,-.3,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(hx+9,moleY-10,4,5,.3,0,Math.PI*2); ctx.fill();
      // Hard hat (optional style)
      ctx.fillStyle='#cc3300';
      ctx.beginPath(); ctx.ellipse(hx,moleY-14,11,5,.0,0,Math.PI*2); ctx.fill();
      ctx.fillRect(hx-11,moleY-16,22,4);
      // Hit flash
      if(popT>.55&&popT<.7){
        const flash=(popT-.55)/.15;
        ctx.fillStyle=`rgba(255,255,100,${flash*.7})`;
        ctx.beginPath(); ctx.arc(hx,moleY-8,20,0,Math.PI*2); ctx.fill();
        ctx.fillStyle=`rgba(255,100,0,${flash*.5})`;
        for(let sp=0;sp<5;sp++){
          const sa=(sp/5)*Math.PI*2;
          ctx.beginPath(); ctx.arc(hx+Math.cos(sa)*20,moleY-8+Math.sin(sa)*18,4,0,Math.PI*2); ctx.fill();
        }
      }
    }
  });
  // Hammer
  const hammerSwing=Math.sin(f*.12)*0.4;
  const hx2=holes[activeIdx][0];
  const hy2=holes[activeIdx][1]-50;
  ctx.save(); ctx.translate(hx2+30,hy2); ctx.rotate(hammerSwing-0.5);
  ctx.fillStyle='#8B4513'; ctx.fillRect(-4,-30,8,30);
  ctx.fillStyle='#555'; ctx.fillRect(-10,-42,20,16); ctx.restore();
};

ANIM.popParade = function(ctx,W,H,f){
  bg(ctx,W,H,'#000a0a','#001a1a');
  // Grid floor perspective
  ctx.strokeStyle='rgba(0,200,180,.12)'; ctx.lineWidth=1;
  for(let i=0;i<8;i++){
    const t=i/7; const y=H*.5+t*H*.5;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
  for(let i=0;i<9;i++){
    const t=i/8;
    ctx.beginPath(); ctx.moveTo(W*t,H*.5); ctx.lineTo(W*(t*.3+.35),H); ctx.stroke();
  }
  // Balloon types: round, heart, star, long
  const balloons=[
    {x:.12,speed:1.1,hue:0,size:18,shape:'round',offset:0},
    {x:.28,speed:.9,hue:60,size:16,shape:'star',offset:20},
    {x:.44,speed:1.3,hue:120,size:20,shape:'round',offset:10},
    {x:.6,speed:.8,hue:180,size:17,shape:'heart',offset:35},
    {x:.76,speed:1.2,hue:270,size:19,shape:'round',offset:5},
    {x:.9,speed:1.0,hue:40,size:15,shape:'star',offset:50},
  ];
  balloons.forEach(({x,speed,hue,size,shape,offset})=>{
    const bx=W*x+Math.sin(f*.02+offset)*(W*.03);
    const by=H-((f*speed+offset*4)%(H+size*2+50));
    const wobble=Math.sin(f*.04+offset)*.05;
    if(by<-size*3) return;
    ctx.save(); ctx.translate(bx,by); ctx.rotate(wobble);
    ctx.shadowColor=`hsl(${hue},100%,55%)`; ctx.shadowBlur=18;
    // Specular highlight
    if(shape==='round'){
      const rg=ctx.createRadialGradient(-size*.3,-size*.3,size*.1,0,0,size);
      rg.addColorStop(0,`hsl(${hue},80%,80%)`);
      rg.addColorStop(.5,`hsl(${hue},90%,55%)`);
      rg.addColorStop(1,`hsl(${hue},80%,30%)`);
      ctx.fillStyle=rg;
      ctx.beginPath(); ctx.arc(0,0,size,0,Math.PI*2); ctx.fill();
      // Shine
      ctx.fillStyle='rgba(255,255,255,.35)';
      ctx.beginPath(); ctx.ellipse(-size*.35,-size*.35,size*.28,size*.2,-.5,0,Math.PI*2); ctx.fill();
      // Knot
      ctx.fillStyle=`hsl(${hue},70%,40%)`;
      ctx.beginPath(); ctx.arc(0,size+2,3,0,Math.PI*2); ctx.fill();
    } else if(shape==='star'){
      ctx.fillStyle=`hsl(${hue},90%,55%)`;
      const pts=5; const r2=size*.45;
      ctx.beginPath();
      for(let p=0;p<pts*2;p++){
        const a=(p/pts/2)*Math.PI*2-Math.PI/2;
        const r=p%2===0?size:r2;
        p===0?ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r):ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.3)';
      ctx.beginPath(); ctx.ellipse(-size*.2,-size*.2,size*.3,size*.2,-.4,0,Math.PI*2); ctx.fill();
    } else {
      // Heart
      ctx.fillStyle=`hsl(${hue},90%,55%)`;
      ctx.beginPath();
      ctx.moveTo(0,size*.3);
      ctx.bezierCurveTo(-size,size*.3-size,-size,size*-1.1,0,-size*.5);
      ctx.bezierCurveTo(size,size*-1.1,size,size*.3-size,0,size*.3);
      ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.3)';
      ctx.beginPath(); ctx.ellipse(-size*.28,-size*.45,size*.25,size*.18,-.6,0,Math.PI*2); ctx.fill();
    }
    ctx.shadowBlur=0;
    // String
    ctx.strokeStyle=`hsla(${hue},60%,50%,.5)`; ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(0,shape==='round'?size+2:size*.3);
    ctx.quadraticCurveTo(size*.3,size*.5+15,0,size*.5+30);
    ctx.stroke();
    ctx.restore();
    // Pop burst on reaching top
    if(by<30){
      const popA=Math.min(1,(30-by)/30);
      ctx.fillStyle=`hsla(${hue},100%,60%,${popA*.8})`;
      for(let sp=0;sp<8;sp++){
        const sa=(sp/8)*Math.PI*2;
        ctx.beginPath(); ctx.arc(bx+Math.cos(sa)*size*1.5,by+Math.sin(sa)*size*1.5,3+Math.random()*3,0,Math.PI*2); ctx.fill();
      }
    }
  });
  // Score
  ctx.fillStyle='rgba(0,255,200,.7)'; ctx.font='bold 12px monospace';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText(`POP! x${Math.floor(f*.05)+1}`, W*.5, 8);
};

ANIM.starTap = function(ctx,W,H,f){
  bg(ctx,W,H,'#000a1a','#001a30');
  // Cosmic background: nebula wisps
  for(let n=0;n<4;n++){
    const nx=W*(.15+n*.22);
    const ny=H*(.2+n*.15);
    const rg=ctx.createRadialGradient(nx,ny,0,nx,ny,60+n*20);
    rg.addColorStop(0,`hsla(${200+n*40},80%,50%,0.07)`);
    rg.addColorStop(1,'transparent');
    ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
  }
  star(ctx,W,H,f);
  // Score ring at center
  const ringA=(f*.015)%(Math.PI*2);
  ctx.strokeStyle='rgba(80,160,255,.12)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(W*.5,H*.5,H*.28,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(W*.5,H*.5,H*.38,0,Math.PI*2); ctx.stroke();
  // 8 orbiting stars at different orbits
  const orbits=[
    {r:H*.12,speed:.025,size:14,hue:50,phase:0},
    {r:H*.2,speed:.018,size:18,hue:200,phase:1.2},
    {r:H*.28,speed:.012,size:12,hue:280,phase:2.4},
    {r:H*.35,speed:.022,size:16,hue:120,phase:0.7},
    {r:H*.18,speed:.03,size:10,hue:30,phase:3.6},
    {r:H*.32,speed:.016,size:20,hue:180,phase:5.0},
    {r:H*.08,speed:.04,size:8,hue:60,phase:1.8},
    {r:H*.38,speed:.01,size:14,hue:320,phase:4.2},
  ];
  orbits.forEach(({r,speed,size,hue,phase},idx)=>{
    const angle=f*speed+phase;
    const sx=W*.5+Math.cos(angle)*r;
    const sy=H*.5+Math.sin(angle)*r;
    const pulse=0.6+Math.sin(f*.08+idx)*.4;
    ctx.save(); ctx.translate(sx,sy);
    ctx.rotate(angle*.5);
    ctx.shadowColor=`hsl(${hue},100%,65%)`; ctx.shadowBlur=18*pulse;
    // 5-point star shape
    ctx.fillStyle=`hsl(${hue},90%,${50+pulse*20}%)`;
    const pts=5; const outer=size; const inner=size*.42;
    ctx.beginPath();
    for(let p=0;p<pts*2;p++){
      const a=(p/pts/2)*Math.PI*2-Math.PI/2;
      const rr=p%2===0?outer:inner;
      p===0?ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);
    }
    ctx.closePath(); ctx.fill();
    // Specular shine
    ctx.fillStyle=`rgba(255,255,255,${pulse*.35})`;
    ctx.beginPath(); ctx.ellipse(-size*.25,-size*.25,size*.3,size*.2,-.5,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    // Tap ripple effect
    const tapCycle=(f+idx*15)%80;
    if(tapCycle<30){
      const rippleA=(30-tapCycle)/30;
      const rippleR=size+tapCycle*1.2;
      ctx.strokeStyle=`hsla(${hue},100%,70%,${rippleA*.6})`;
      ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,0,rippleR,0,Math.PI*2); ctx.stroke();
    }
    ctx.restore();
  });
  // Central score multiplier orb
  const orbPulse=0.7+Math.sin(f*.07)*.3;
  const cr=ctx.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,22);
  cr.addColorStop(0,`rgba(200,220,255,${orbPulse*.8})`);
  cr.addColorStop(.5,`rgba(80,140,255,${orbPulse*.5})`);
  cr.addColorStop(1,'transparent');
  ctx.fillStyle=cr; ctx.beginPath(); ctx.arc(W*.5,H*.5,22,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=`rgba(255,255,255,${orbPulse*.8})`;
  ctx.font=`bold ${Math.round(W*.055)}px sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(`x${Math.floor(f*.03)+1}`,W*.5,H*.5);
  // HUD
  ctx.fillStyle='rgba(180,220,255,.7)'; ctx.font='bold 11px monospace';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(`STARS: ${Math.floor(f*.12)}`, 10, 8);
};

ANIM.shapeCatch = function(ctx,W,H,f){
  bg(ctx,W,H,'#050010','#0d0028');
  star(ctx,W,H,f);
  // Combo display
  const combo=Math.floor(f*.04)+1;
  ctx.fillStyle='rgba(255,200,80,.7)'; ctx.font='bold 12px monospace';
  ctx.textAlign='right'; ctx.textBaseline='top';
  ctx.fillText(`COMBO x${combo}`, W-10, 8);
  ctx.textAlign='left';
  ctx.fillStyle='rgba(180,180,255,.6)';
  ctx.fillText(`SCORE ${Math.floor(f*1.4)*10}`, 10, 8);
  // Bucket (catcher) with rounded body
  const bx=W*.5+Math.sin(f*.04)*W*.32;
  const by=H*.83;
  const bw=52, bh=18;
  ctx.fillStyle='rgba(80,60,160,.8)';
  ctx.beginPath(); ctx.roundRect(bx-bw/2,by,bw,bh,5); ctx.fill();
  ctx.strokeStyle='rgba(160,120,255,.7)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(bx-bw/2,by,bw,bh,5); ctx.stroke();
  // Bucket opening top edge highlight
  ctx.strokeStyle='rgba(200,180,255,.5)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(bx-bw/2,by); ctx.lineTo(bx+bw/2,by); ctx.stroke();
  // Falling shapes: 5 columns with different shapes and speeds
  const shapeDefs=[
    {col:.1,speed:1.0,offset:0,hue:0,type:'triangle'},
    {col:.28,speed:1.3,offset:30,hue:60,type:'circle'},
    {col:.46,speed:.9,offset:60,hue:120,type:'square'},
    {col:.64,speed:1.2,offset:15,hue:200,type:'diamond'},
    {col:.82,speed:1.1,offset:45,hue:280,type:'star'},
  ];
  shapeDefs.forEach(({col,speed,offset,hue,type})=>{
    const sx=W*col+Math.sin(f*.015+offset)*(W*.04);
    const sy=(offset*2+f*speed)%(H*1.1)-20;
    if(sy>H+20) return;
    const sz=14;
    ctx.save(); ctx.translate(sx,sy);
    ctx.shadowColor=`hsl(${hue},100%,60%)`; ctx.shadowBlur=14;
    const sg=ctx.createRadialGradient(-sz*.3,-sz*.3,0,0,0,sz);
    sg.addColorStop(0,`hsl(${hue},80%,80%)`);
    sg.addColorStop(1,`hsl(${hue},80%,40%)`);
    ctx.fillStyle=sg;
    if(type==='triangle'){
      ctx.beginPath(); ctx.moveTo(0,-sz); ctx.lineTo(sz,sz*.7); ctx.lineTo(-sz,sz*.7); ctx.closePath(); ctx.fill();
    } else if(type==='circle'){
      ctx.beginPath(); ctx.arc(0,0,sz,0,Math.PI*2); ctx.fill();
    } else if(type==='square'){
      ctx.rotate(Math.sin(f*.03+offset)*.3);
      ctx.fillRect(-sz,-sz,sz*2,sz*2);
    } else if(type==='diamond'){
      ctx.beginPath(); ctx.moveTo(0,-sz*1.3); ctx.lineTo(sz*.8,0); ctx.lineTo(0,sz*1.3); ctx.lineTo(-sz*.8,0); ctx.closePath(); ctx.fill();
    } else {
      const pts=5; const outer=sz; const inner=sz*.42;
      ctx.beginPath();
      for(let p=0;p<pts*2;p++){
        const a=(p/pts/2)*Math.PI*2-Math.PI/2;
        const r=p%2===0?outer:inner;
        p===0?ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r):ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
      }
      ctx.closePath(); ctx.fill();
    }
    // Shine
    ctx.fillStyle='rgba(255,255,255,.25)';
    ctx.beginPath(); ctx.ellipse(-sz*.35,-sz*.35,sz*.35,sz*.22,-.5,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    // Catch flash: near bucket
    if(sy>H*.75&&sy<H*.88&&Math.abs(sx-bx)<bw/2+sz){
      const catchA=1-(sy-H*.75)/(H*.13);
      ctx.fillStyle=`hsla(${hue},100%,70%,${catchA*.7})`;
      ctx.beginPath(); ctx.arc(0,0,sz*1.8,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  });
};

ANIM.snake = function(ctx,W,H,f){
  bg(ctx,W,H,'#040a04','#071407');
  const size=16, gx=Math.floor(W/size), gy=Math.floor(H/size);
  // Grid lines
  ctx.strokeStyle='rgba(0,80,0,.25)'; ctx.lineWidth=.5;
  for(let gxi=0;gxi<=gx;gxi++){ ctx.beginPath(); ctx.moveTo(gxi*size,0); ctx.lineTo(gxi*size,H); ctx.stroke(); }
  for(let gyi=0;gyi<=gy;gyi++){ ctx.beginPath(); ctx.moveTo(0,gyi*size); ctx.lineTo(W,gyi*size); ctx.stroke(); }
  // Snake path: a smooth winding route across the grid
  const path=[];
  let cx=Math.floor(gx*.2), cy=Math.floor(gy*.5);
  const directions=[[1,0],[0,1],[-1,0],[0,-1]]; // R,D,L,U
  let dir=0, stepCount=0, turnAt=Math.floor(gx*.5);
  for(let s=0;s<28;s++){
    path.push([cx,cy]);
    cx+=directions[dir][0]; cy+=directions[dir][1];
    stepCount++;
    if(stepCount>=turnAt){ dir=(dir+1)%4; stepCount=0; turnAt=Math.floor(2+Math.random()*6); }
    cx=Math.max(0,Math.min(gx-1,cx)); cy=Math.max(0,Math.min(gy-1,cy));
  }
  const headIdx=(Math.floor(f*.12))%path.length;
  const len=10;
  // Draw body segments
  for(let i=0;i<len;i++){
    const segIdx=(headIdx-i+path.length)%path.length;
    const [sgx,sgy]=path[segIdx];
    const sx=sgx*size, sy=sgy*size;
    const t=i/len;
    const alpha=1-t*.45;
    if(i===0){
      // Head: rounded with eyes and tongue
      ctx.shadowColor='rgba(0,255,80,.6)'; ctx.shadowBlur=12;
      const hg=ctx.createRadialGradient(sx+size/2-2,sy+size/2-2,0,sx+size/2,sy+size/2,size*.8);
      hg.addColorStop(0,'#80ff80'); hg.addColorStop(1,'#00cc40');
      ctx.fillStyle=hg;
      ctx.beginPath(); ctx.roundRect(sx+1,sy+1,size-2,size-2,5); ctx.fill();
      ctx.shadowBlur=0;
      // Eyes
      const nextSeg=path[(headIdx+1)%path.length];
      const faceDir=[path[headIdx][0]-nextSeg[0],path[headIdx][1]-nextSeg[1]];
      let ex1,ey1,ex2,ey2;
      if(Math.abs(faceDir[0])>Math.abs(faceDir[1])){
        const ex=faceDir[0]>0?sx+size-5:sx+5;
        ex1=ex; ey1=sy+4; ex2=ex; ey2=sy+size-5;
      } else {
        const ey=faceDir[1]>0?sy+size-5:sy+5;
        ex1=sx+4; ey1=ey; ex2=sx+size-5; ey2=ey;
      }
      ctx.fillStyle='black'; ctx.beginPath(); ctx.arc(ex1,ey1,2.5,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex2,ey2,2.5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.8)'; ctx.beginPath(); ctx.arc(ex1-.5,ey1-.5,1.2,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex2-.5,ey2-.5,1.2,0,Math.PI*2); ctx.fill();
      // Tongue (flicking)
      const tongueOut=Math.sin(f*.2)>.3;
      if(tongueOut){
        const tmx=sx+size/2+(faceDir[0]*10);
        const tmy=sy+size/2+(faceDir[1]*10);
        ctx.strokeStyle='#ff4466'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(sx+size/2+faceDir[0]*6,sy+size/2+faceDir[1]*6);
        ctx.lineTo(tmx,tmy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(tmx,tmy); ctx.lineTo(tmx+faceDir[1]*4,tmy+faceDir[0]*4); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(tmx,tmy); ctx.lineTo(tmx-faceDir[1]*4,tmy-faceDir[0]*4); ctx.stroke();
      }
    } else {
      // Body segment with scale pattern
      const bg2=ctx.createLinearGradient(sx,sy,sx+size,sy+size);
      bg2.addColorStop(0,`rgba(0,${180-t*80},${50+t*20},${alpha})`);
      bg2.addColorStop(1,`rgba(0,${120-t*60},${30+t*20},${alpha*.8})`);
      ctx.fillStyle=bg2;
      ctx.beginPath(); ctx.roundRect(sx+2,sy+2,size-4,size-4,3); ctx.fill();
      // Scale highlight
      if(i%2===0){
        ctx.fillStyle=`rgba(100,255,100,${alpha*.15})`;
        ctx.beginPath(); ctx.ellipse(sx+size/2,sy+size*.35,size*.3,size*.2,0,0,Math.PI*2); ctx.fill();
      }
    }
  }
  // Apple (food)
  const appleX=Math.floor(gx*.65)*size; const appleY=Math.floor(gy*.35)*size;
  const ag=ctx.createRadialGradient(appleX+5,appleY+5,2,appleX+size/2,appleY+size/2,size*.6);
  ag.addColorStop(0,'#ff8888'); ag.addColorStop(1,'#cc1111');
  ctx.fillStyle=ag; ctx.shadowColor='rgba(255,0,0,.5)'; ctx.shadowBlur=12;
  ctx.beginPath(); ctx.arc(appleX+size/2,appleY+size/2,size*.4,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#44aa44'; ctx.fillRect(appleX+size/2-1,appleY+size/2-size*.4-3,2,5);
  ctx.strokeStyle='#55bb55'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(appleX+size/2+1,appleY+size/2-size*.38-2); ctx.quadraticCurveTo(appleX+size/2+6,appleY+size/2-size*.38-5,appleX+size/2+5,appleY+size/2-size*.38); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.4)'; ctx.beginPath(); ctx.ellipse(appleX+size*.38,appleY+size*.38,size*.12,size*.08,-.5,0,Math.PI*2); ctx.fill();
  // Score
  ctx.fillStyle='rgba(0,255,80,.7)'; ctx.font='bold 11px monospace';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(`LENGTH: ${len+Math.floor(f*.02)}`, 8, 8);
};

ANIM.brickBreaker = function(ctx,W,H,f){
  bg(ctx,W,H,'#06001a','#100030');
  // Scanlines
  for(let sl=0;sl<H;sl+=4){ ctx.fillStyle='rgba(0,0,0,.08)'; ctx.fillRect(0,sl,W,2); }
  // Brick grid: 5 cols x 4 rows
  const cols=5, rows=4;
  const brickW=(W-20)/cols-4, brickH=14;
  const brickPad=4;
  // Some bricks destroyed (cycle)
  const destroyedMask=Math.floor(f/20)&0xFFFFF;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const idx=r*cols+c;
      const gone=(destroyedMask>>idx)&1;
      if(gone) continue;
      const bx=10+c*(brickW+brickPad);
      const by=H*.08+r*(brickH+brickPad);
      const hue=200+c*22+r*18;
      // Brick body
      ctx.shadowColor=`hsl(${hue},100%,55%)`; ctx.shadowBlur=6;
      const bg2=ctx.createLinearGradient(bx,by,bx,by+brickH);
      bg2.addColorStop(0,`hsl(${hue},75%,55%)`);
      bg2.addColorStop(1,`hsl(${hue},75%,30%)`);
      ctx.fillStyle=bg2;
      ctx.beginPath(); ctx.roundRect(bx,by,brickW,brickH,3); ctx.fill();
      ctx.shadowBlur=0;
      // Top shine
      ctx.fillStyle='rgba(255,255,255,.25)';
      ctx.beginPath(); ctx.roundRect(bx+2,by+2,brickW-4,4,2); ctx.fill();
      // Crack on "low HP" bricks (bottom rows)
      if(r>=2){
        ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(bx+brickW*.3,by+4); ctx.lineTo(bx+brickW*.5,by+brickH-3); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(bx+brickW*.5,by+brickH-3); ctx.lineTo(bx+brickW*.65,by+6); ctx.stroke();
      }
    }
  }
  // Ball with trail
  const ballAngle=f*.04;
  const ballX=W*.5+Math.sin(ballAngle)*W*.38;
  const ballY=H*.35+Math.cos(ballAngle*1.3)*H*.28;
  // Trail
  for(let t=1;t<=5;t++){
    const tAngle=ballAngle-t*.04;
    const tx=W*.5+Math.sin(tAngle)*W*.38;
    const ty=H*.35+Math.cos(tAngle*1.3)*H*.28;
    ctx.fillStyle=`rgba(140,80,255,${.2-t*.035})`;
    ctx.beginPath(); ctx.arc(tx,ty,8-t,0,Math.PI*2); ctx.fill();
  }
  // Ball
  const rg=ctx.createRadialGradient(ballX-3,ballY-3,1,ballX,ballY,10);
  rg.addColorStop(0,'#e0c0ff'); rg.addColorStop(1,'#8020ff');
  ctx.fillStyle=rg; ctx.shadowColor='rgba(160,80,255,.7)'; ctx.shadowBlur=18;
  ctx.beginPath(); ctx.arc(ballX,ballY,10,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  // Ball specular
  ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.beginPath(); ctx.ellipse(ballX-3,ballY-3,4,3,-.6,0,Math.PI*2); ctx.fill();
  // Impact flash near brick
  const nearBrick=ballY<H*.45;
  if(nearBrick){
    const flashA=Math.max(0,1-(ballY-H*.08)/(H*.37));
    ctx.fillStyle=`rgba(200,160,255,${flashA*.3})`;
    ctx.beginPath(); ctx.arc(ballX,ballY,22,0,Math.PI*2); ctx.fill();
  }
  // Paddle
  const padX=W*.5+Math.sin(f*.04)*W*.3;
  const padY=H*.84;
  const padW=W*.32, padH=10;
  ctx.shadowColor='rgba(140,80,255,.7)'; ctx.shadowBlur=14;
  const pg=ctx.createLinearGradient(padX-padW/2,padY,padX+padW/2,padY+padH);
  pg.addColorStop(0,'#9955ff'); pg.addColorStop(.5,'#cc99ff'); pg.addColorStop(1,'#9955ff');
  ctx.fillStyle=pg;
  ctx.beginPath(); ctx.roundRect(padX-padW/2,padY,padW,padH,padH/2); ctx.fill();
  ctx.shadowBlur=0;
  // Paddle center dot
  ctx.fillStyle='rgba(255,255,255,.4)';
  ctx.beginPath(); ctx.ellipse(padX,padY+padH/2,padW*.12,padH*.3,0,0,Math.PI*2); ctx.fill();
  // Score + lives
  ctx.fillStyle='rgba(180,120,255,.8)'; ctx.font='bold 11px monospace';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(`${Math.floor(f*2)*50}`, 10, 8);
  ctx.textAlign='right';
  ctx.fillText('&#xE2;&#x2122;&#xA5; &#xE2;&#x2122;&#xA5; &#xE2;&#x2122;&#xA5;', W-10, 8);
};

ANIM.tapFly = function(ctx,W,H,f){
  bg(ctx,W,H,'#040814','#08102a');
  star(ctx,W,H,f);
  // Score
  ctx.fillStyle='rgba(255,220,80,.8)'; ctx.font='bold 12px monospace';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText(Math.floor(f*.08), W*.5, 8);
  // Pipe pairs (2 on screen)
  const pipeW=28, gap=78;
  [[0,0],[1,180]].forEach(([i,offset])=>{
    const px=W+40-((f*2.5+offset)%(W+pipeW+40));
    const capH=Math.floor(H*.12+Math.sin(i*2.3)*H*.15);
    const gapY=capH;
    // Top pipe body
    ctx.shadowColor='rgba(0,200,100,.4)'; ctx.shadowBlur=8;
    const tg=ctx.createLinearGradient(px,0,px+pipeW,0);
    tg.addColorStop(0,'#1a6a30'); tg.addColorStop(.5,'#2aaa50'); tg.addColorStop(1,'#1a6a30');
    ctx.fillStyle=tg; ctx.fillRect(px,0,pipeW,gapY-14);
    // Top cap
    ctx.fillRect(px-5,gapY-18,pipeW+10,16);
    // Highlight on cap
    ctx.fillStyle='rgba(100,255,150,.2)'; ctx.fillRect(px,gapY-16,pipeW*.4,12);
    // Bottom pipe body
    ctx.fillStyle=tg; ctx.fillRect(px,gapY+gap+14,pipeW,H-(gapY+gap+14));
    // Bottom cap
    ctx.fillRect(px-5,gapY+gap,pipeW+10,16);
    ctx.fillStyle='rgba(100,255,150,.2)'; ctx.fillRect(px,gapY+gap+2,pipeW*.4,12);
    ctx.shadowBlur=0;
  });
  // Ground
  ctx.fillStyle='#2a6a1a'; ctx.fillRect(0,H*.9,W,H*.1);
  ctx.fillStyle='#1a4a0a'; ctx.fillRect(0,H*.9,W,5);
  // Ground scrolling pattern
  ctx.strokeStyle='rgba(0,80,0,.3)'; ctx.lineWidth=1;
  for(let g=0;g<6;g++){
    const gx=(g*W/5+W-(f*2.5)%(W/5+5))%(W);
    ctx.beginPath(); ctx.moveTo(gx,H*.9); ctx.lineTo(gx-15,H); ctx.stroke();
  }
  // Bird / character
  const py=H*.45+Math.sin(f*.12)*H*.3;
  const birdX=W*.25;
  const wingAngle=Math.sin(f*.18)*.5;
  ctx.save(); ctx.translate(birdX,py);
  ctx.rotate(Math.sin(f*.12)*.15);
  // Wing
  ctx.shadowColor='rgba(255,220,0,.5)'; ctx.shadowBlur=12;
  ctx.fillStyle='#ddaa00';
  ctx.save(); ctx.rotate(-wingAngle-.3);
  ctx.beginPath(); ctx.ellipse(0,2,12,6,-.3,0,Math.PI*2); ctx.fill();
  ctx.restore();
  // Body
  const bg2=ctx.createRadialGradient(-2,-2,2,0,0,13);
  bg2.addColorStop(0,'#ffe060'); bg2.addColorStop(1,'#cc8800');
  ctx.fillStyle=bg2;
  ctx.beginPath(); ctx.ellipse(0,0,13,10,0,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  // Eye
  ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(5,-2,3.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='black'; ctx.beginPath(); ctx.arc(6,-2,2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(5.5,-2.5,1,0,Math.PI*2); ctx.fill();
  // Beak
  ctx.fillStyle='#ff8800';
  ctx.beginPath(); ctx.moveTo(13,0); ctx.lineTo(20,-3); ctx.lineTo(20,3); ctx.closePath(); ctx.fill();
  // Tail feathers
  ctx.fillStyle='#ddaa00';
  ctx.beginPath(); ctx.moveTo(-13,0); ctx.lineTo(-22,-5); ctx.lineTo(-20,0); ctx.lineTo(-22,5); ctx.closePath(); ctx.fill();
  ctx.restore();
  // Exhaust particles behind bird
  for(let p=0;p<4;p++){
    const pa=(f*.3+p*1.5)%6;
    const px2=birdX-20-pa*8; const py2=py+(Math.random()-.5)*10;
    ctx.fillStyle=`rgba(255,200,50,${.6-pa*.1})`;
    ctx.beginPath(); ctx.arc(px2,py2,2+pa*.3,0,Math.PI*2); ctx.fill();
  }
};

ANIM.pong = function(ctx,W,H,f){
  bg(ctx,W,H,'#000a0a','#001a1a');
  // Court glow
  const cg=ctx.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,W*.6);
  cg.addColorStop(0,'rgba(0,180,160,.06)'); cg.addColorStop(1,'transparent');
  ctx.fillStyle=cg; ctx.fillRect(0,0,W,H);
  // Court border
  ctx.strokeStyle='rgba(0,200,180,.18)'; ctx.lineWidth=2;
  ctx.strokeRect(4,4,W-8,H-8);
  // Centre line dashes
  ctx.strokeStyle='rgba(0,200,200,.22)'; ctx.lineWidth=1.5; ctx.setLineDash([8,8]);
  ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke(); ctx.setLineDash([]);
  // Centre circle
  ctx.strokeStyle='rgba(0,200,200,.12)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(W*.5,H*.5,H*.12,0,Math.PI*2); ctx.stroke();
  // Scores
  ctx.fillStyle='rgba(0,230,210,.5)'; ctx.font=`bold ${Math.round(H*.08)}px monospace`;
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText(Math.floor(f*.04)%10, W*.28, 12);
  ctx.fillText(Math.floor(f*.03+3)%10, W*.72, 12);
  // Ball position (Lissajous path for realism)
  const by=H*.5+Math.sin(f*.07)*H*.38;
  const bx=W*.5+Math.cos(f*.05)*W*.38;
  // Ball trail
  for(let t=1;t<=5;t++){
    const tby=H*.5+Math.sin((f-t*1.5)*.07)*H*.38;
    const tbx=W*.5+Math.cos((f-t*1.5)*.05)*W*.38;
    ctx.fillStyle=`rgba(0,255,220,${.15-t*.025})`;
    ctx.beginPath(); ctx.arc(tbx,tby,10-t,0,Math.PI*2); ctx.fill();
  }
  // Ball
  const rg=ctx.createRadialGradient(bx-3,by-3,1,bx,by,10);
  rg.addColorStop(0,'#aaffee'); rg.addColorStop(1,'#00ccaa');
  ctx.fillStyle=rg; ctx.shadowColor='rgba(0,255,200,.7)'; ctx.shadowBlur=20;
  ctx.beginPath(); ctx.arc(bx,by,10,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  // Specular
  ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.beginPath(); ctx.ellipse(bx-3,by-3,4,3,-.5,0,Math.PI*2); ctx.fill();
  // Left paddle (follows ball Y)
  const lpy=by;
  const pH=46, pW=10;
  const lpg=ctx.createLinearGradient(8,lpy-pH/2,8+pW,lpy+pH/2);
  lpg.addColorStop(0,'#00eecc'); lpg.addColorStop(1,'#007755');
  ctx.fillStyle=lpg; ctx.shadowColor='rgba(0,220,180,.5)'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.roundRect(8,lpy-pH/2,pW,pH,4); ctx.fill();
  ctx.shadowBlur=0;
  // Right paddle (AI, lags a bit)
  const rpy=H*.5+Math.sin(f*.06)*H*.3;
  const rpg=ctx.createLinearGradient(W-18,rpy-pH/2,W-18+pW,rpy+pH/2);
  rpg.addColorStop(0,'#00ccaa'); rpg.addColorStop(1,'#005544');
  ctx.fillStyle=rpg; ctx.shadowColor='rgba(0,180,150,.4)'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.roundRect(W-18,rpy-pH/2,pW,pH,4); ctx.fill();
  ctx.shadowBlur=0;
  // Paddle shine
  ctx.fillStyle='rgba(255,255,255,.18)';
  ctx.beginPath(); ctx.roundRect(10,lpy-pH/2+2,pW*.4,pH-4,2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(W-16,rpy-pH/2+2,pW*.4,pH-4,2); ctx.fill();
  // Impact flash on walls
  if(by>H*.9||by<H*.1){
    const a=by>H*.9?(by-H*.9)/(H*.1):(H*.1-by)/(H*.1);
    ctx.fillStyle=`rgba(0,255,200,${a*.3})`;
    ctx.fillRect(0,by>H*.9?H*.9:0,W,H*.1);
  }
};

ANIM.slide2048 = function(ctx,W,H,f){
  bg(ctx,W,H,'#faf0e0','#f0dfc0');
  // Board background
  const boardPad=10, gap=5;
  const boardW=W-boardPad*2, boardH=H-boardPad*2;
  ctx.fillStyle='#bbaa99';
  ctx.beginPath(); ctx.roundRect(boardPad,boardPad,boardW,boardH,8); ctx.fill();
  // Fixed board state (deterministic from f cycle)
  const tileVals=[
    [2048,256,64,2],
    [512,128,32,0],
    [64,16,4,0],
    [8,0,0,2],
  ];
  // Animate one tile "sliding" into a merge (cycle every 120 frames)
  const slidePhase=(f%120)/120;
  const cols=4, rows=4;
  const tileW=(boardW-gap*(cols+1))/cols;
  const tileH=(boardH-gap*(rows+1))/rows;
  // Tile color map by value
  const tileColors={
    0:{bg:'rgba(0,0,0,.08)',text:'transparent'},
    2:{bg:'#eee4da',text:'#776e65'},
    4:{bg:'#ede0c8',text:'#776e65'},
    8:{bg:'#f2b179',text:'#fff'},
    16:{bg:'#f59563',text:'#fff'},
    32:{bg:'#f67c5f',text:'#fff'},
    64:{bg:'#f65e3b',text:'#fff'},
    128:{bg:'#edcf72',text:'#fff'},
    256:{bg:'#edcc61',text:'#fff'},
    512:{bg:'#edc850',text:'#fff'},
    1024:{bg:'#edc53f',text:'#fff'},
    2048:{bg:'#edc22e',text:'#fff'},
  };
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const v=tileVals[r][c];
      const tx=boardPad+gap+(c*(tileW+gap));
      const ty=boardPad+gap+(r*(tileH+gap));
      const col=tileColors[v]||{bg:'#3c3a32',text:'#fff'};
      // Animate the 2048 tile (top-left) with a subtle pulse
      let scale=1;
      if(r===0&&c===0) scale=1+Math.sin(f*.06)*.04;
      ctx.save();
      ctx.translate(tx+tileW/2,ty+tileH/2);
      ctx.scale(scale,scale);
      ctx.fillStyle=col.bg;
      ctx.shadowColor=v>=128?'rgba(200,150,50,.4)':'transparent';
      ctx.shadowBlur=v>=128?8:0;
      ctx.beginPath(); ctx.roundRect(-tileW/2,-tileH/2,tileW,tileH,5); ctx.fill();
      ctx.shadowBlur=0;
      // Shine on higher tiles
      if(v>=64){
        ctx.fillStyle='rgba(255,255,255,.12)';
        ctx.beginPath(); ctx.roundRect(-tileW/2,-tileH/2,tileW,tileH*.45,5); ctx.fill();
      }
      if(v>0){
        ctx.fillStyle=col.text;
        const fsize=v>=1000?Math.round(tileW*.22):v>=100?Math.round(tileW*.27):Math.round(tileW*.32);
        ctx.font=`bold ${fsize}px sans-serif`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(v,0,0);
      }
