<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Penalty Fever</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Orbitron:wght@700;900&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#050508;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px 10px 30px;user-select:none;-webkit-user-select:none;font-family:'Orbitron',monospace;overflow-x:hidden;}
h1{font-family:'Cinzel Decorative',serif;font-size:clamp(1rem,5vw,1.8rem);background:linear-gradient(90deg,#44ff88,#ffd460);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.08em;margin-bottom:5px;margin-top:4px;}
.scores{display:flex;gap:12px;margin-bottom:8px;flex-wrap:wrap;justify-content:center;}
.score-box{text-align:center;background:rgba(255,255,255,.04);border:1px solid rgba(68,255,136,.18);border-radius:6px;padding:3px 12px;}
.score-label{font-size:.5rem;color:rgba(255,255,255,.3);letter-spacing:.12em;text-transform:uppercase}
.score-val{font-size:1.1rem;color:#44ff88;letter-spacing:.05em}
canvas{display:block;border-radius:6px;box-shadow:0 0 40px rgba(68,255,136,.18);cursor:crosshair;touch-action:none;}
.hint{font-size:.55rem;color:rgba(255,255,255,.18);margin-top:6px;letter-spacing:.1em;text-transform:uppercase;text-align:center;}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);z-index:100;align-items:center;justify-content:center;}
#overlay.show{display:flex}
.ov-box{background:linear-gradient(145deg,#060a06,#050508);border:2px solid #44ff88;border-radius:14px;padding:28px 24px;text-align:center;max-width:260px;width:88%;box-shadow:0 0 60px rgba(68,255,136,.25);}
.ov-box h2{font-family:'Cinzel Decorative',serif;font-size:1.3rem;color:#44ff88;margin-bottom:4px}
.ov-box .ov-score{font-size:1.8rem;color:#fff;margin-bottom:4px}
.ov-box p{color:rgba(255,255,255,.35);font-size:.7rem;margin-bottom:16px;letter-spacing:.08em}
.btn{background:linear-gradient(135deg,#002010,#000800);border:1px solid #44ff88;border-radius:8px;color:#44ff88;font-family:'Orbitron',monospace;font-size:.8rem;font-weight:700;padding:11px 28px;cursor:pointer;letter-spacing:.08em;transition:transform .15s;}
.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div id="htp-overlay" style="position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.87);display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,sans-serif"><div style="background:#0d1117;border:2px solid #7c3aed;border-radius:18px;padding:26px 20px;max-width:320px;width:100%;text-align:center;color:#fff;box-shadow:0 0 50px rgba(124,58,237,.35)"><div style="font-size:2.2rem;margin-bottom:8px">&#127918;</div><h2 style="margin:0 0 12px;font-size:1.15rem;color:#a78bfa;letter-spacing:.02em">How to Play</h2><p style="margin:0 0 18px;font-size:.88rem;line-height:1.65;color:#cbd5e1">Swipe or tap to aim and kick the ball<br>Score past the goalkeeper<br>Don't miss the net!</p><button onclick="document.getElementById('htp-overlay').remove()" style="background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:1rem;font-weight:700;cursor:pointer;width:100%;letter-spacing:.04em">&#9654; Let's Play!</button></div></div>
<h1>PENALTY FEVER</h1>
<div class="scores">
  <div class="score-box"><div class="score-label">Level</div><div class="score-val" id="el-level">1</div></div>
  <div class="score-box"><div class="score-label">Goals</div><div class="score-val" id="el-goals">0</div></div>
  <div class="score-box"><div class="score-label">Kick</div><div class="score-val" id="el-kick">1/5</div></div>
  <div class="score-box"><div class="score-label">Saves</div><div class="score-val" id="el-saves">0</div></div>
</div>
<canvas id="cv"></canvas>
<div class="hint">Move mouse / finger to aim, hold then release to kick</div>
<div id="overlay">
  <div class="ov-box">
    <h2 id="ov-title">FULL TIME!</h2>
    <div class="ov-score" id="ov-score">0 / 5</div>
    <p id="ov-msg">Shoot again!</p>
    <button class="btn" id="btn-next" onclick="nextLevel()" style="display:none;margin-bottom:8px">Next Level &#8594;</button>
    <button class="btn" id="btn-replay" onclick="newGame()">Play Again</button>
  </div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H;
let aimX,aimY,power,charging,ball,gk,particles;
let goals,saves,kick,gameState,raf,level,gkName,roundGoals,bestLevel;
let GW,GH,GX,GY;

function resize(){
  const a=Math.min(window.innerWidth-20,360);
  W=a; H=Math.round(a*1.3);
  cv.width=W; cv.height=H;
  GW=Math.round(W*0.6); GH=Math.round(H*0.28);
  GX=(W-GW)/2; GY=Math.round(H*0.08);
}

function newGame(){
  document.getElementById('overlay').classList.remove('show');
  resize();
  aimX=W/2; aimY=GY+GH/2;
  power=0; charging=false;
  ball={x:W/2,y:H*0.78,r:12,vx:0,vy:0,flying:false};
  gk={x:W/2,y:GY+GH*0.7,w:22,h:36,vx:0,jumping:false,jumpDir:0};
  particles=[];
  goals=0; saves=0; kick=1; level=1; gkName=Math.random()<0.5?"M":"R"; roundGoals=0; bestLevel=+(localStorage.getItem("pfbest")||0);
  gameState='ready';
  updateHUD();
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
}

function updateHUD(){
  document.getElementById('el-goals').textContent=goals;
  document.getElementById('el-kick').textContent=`${kick}/5`;
  document.getElementById('el-saves').textContent=saves;
}

function spawnParticles(x,y,col,n=12){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=Math.random()*6+2;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col,r:Math.random()*5+2});
  }
}

function kickBall(){
  if(gameState!=='ready'||!charging)return;
  const dx=aimX-ball.x, dy=aimY-ball.y;
  const dist=Math.hypot(dx,dy)||1;
  const spd=(power/100)*18+6;
  ball.vx=dx/dist*spd; ball.vy=dy/dist*spd;
  ball.flying=true;
  power=0; charging=false;
  gameState='flying';
  // GK intelligence: level 1=10% track, level5=70% track
  const trackChance=0.1+(level-1)*0.14;
  const ballGoesRight=aimX>W/2;
  const tracks=Math.random()<trackChance;
  gk.jumpDir=tracks?(ballGoesRight?1:-1):(Math.random()<0.5?-1:1);
  gk.jumping=true;
  gk.vx=gk.jumpDir*(2.5+level*0.55);
}

function loop(){
  raf=requestAnimationFrame(loop);
  if(gameState==='ready'&&charging){power=Math.min(100,power+2.5);}
  if(gameState==='flying'){
    ball.x+=ball.vx; ball.y+=ball.vy;
    ball.vy+=0.18;
    // GK movement
    if(gk.jumping){
      gk.x+=gk.vx;
      gk.x=Math.max(GX+gk.w/2,Math.min(GX+GW-gk.w/2,gk.x));
    }
    // Check goal
    if(ball.y<GY+GH&&ball.y>GY&&ball.x>GX&&ball.x<GX+GW){
      // Check saved by GK
      if(Math.abs(ball.x-gk.x)<gk.w/2+ball.r&&Math.abs(ball.y-gk.y)<gk.h/2+ball.r){
        saves++;spawnParticles(ball.x,ball.y,'#ff4444',12);
        resolveKick(false);
      } else {
        goals++;spawnParticles(ball.x,ball.y,'#ffd460',16);
        resolveKick(true);
      }
    } else if(ball.y>H+30||ball.y<-50||ball.x<-30||ball.x>W+30){
      saves++;spawnParticles(W/2,GY+GH/2,'#ff4444',8);
      resolveKick(false);
    }
  }
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life-=0.022;});
  particles=particles.filter(p=>p.life>0);

  // Draw
  ctx.fillStyle='#050508';ctx.fillRect(0,0,W,H);
  // Pitch
  const pitch=ctx.createLinearGradient(0,0,0,H);
  pitch.addColorStop(0,'#0a1a0a');pitch.addColorStop(1,'#060e06');
  ctx.fillStyle=pitch;ctx.fillRect(0,0,W,H);
  // Pitch lines
  ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(W/2,H*0.5,W*0.22,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,H*0.5);ctx.lineTo(W,H*0.5);ctx.stroke();
  // Penalty spot area
  ctx.strokeStyle='rgba(255,255,255,.1)';
  ctx.strokeRect(GX-20,GY+GH,GW+40,H*0.35);
  // Goal
  ctx.shadowColor='#ffd460';ctx.shadowBlur=14;
  ctx.strokeStyle='#ffd460';ctx.lineWidth=3;
  ctx.strokeRect(GX,GY,GW,GH);
  // Goal net
  ctx.strokeStyle='rgba(255,210,96,.12)';ctx.lineWidth=1;
  for(let nx=GX;nx<=GX+GW;nx+=GW/8){ctx.beginPath();ctx.moveTo(nx,GY);ctx.lineTo(nx,GY+GH);ctx.stroke();}
  for(let ny=GY;ny<=GY+GH;ny+=GH/4){ctx.beginPath();ctx.moveTo(GX,ny);ctx.lineTo(GX+GW,ny);ctx.stroke();}
  ctx.shadowBlur=0;

  // GK - cartoon player
  drawGK(gk.x,gk.y,gk.w,gk.h,gkName);

  // Aim line
  if(gameState==='ready'){
    ctx.strokeStyle='rgba(68,255,136,.25)';ctx.lineWidth=1.5;ctx.setLineDash([6,8]);
    ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(aimX,aimY);ctx.stroke();
    ctx.setLineDash([]);
    // Aim cursor
    ctx.strokeStyle='#44ff88';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(aimX,aimY,8,0,Math.PI*2);ctx.stroke();
    // Power bar
    const bw=Math.round(W*0.5),bh=12,bx=(W-bw)/2,by=H*0.9;
    ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(bx,by,bw,bh);
    const col=power>70?'#ff4444':power>40?'#ffd460':'#44ff88';
    ctx.fillStyle=col;ctx.fillRect(bx,by,bw*power/100,bh);
    ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.font=`bold ${Math.round(W*.03)}px 'Orbitron',monospace`;
    ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillText('POWER',W/2,by-2);
  }

  // Particles
  particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;

  // Ball
  if(ball.y<H+ball.r){
    ctx.shadowColor='#ffffff';ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
    const bg=ctx.createRadialGradient(ball.x-ball.r*.3,ball.y-ball.r*.3,1,ball.x,ball.y,ball.r);
    bg.addColorStop(0,'#ffffff');bg.addColorStop(1,'#aaaaaa');
    ctx.fillStyle=bg;ctx.fill();
    // Hexagon pattern
    ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r*.5,0,Math.PI*2);ctx.stroke();
    ctx.shadowBlur=0;
  }

  if(gameState==='result'){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,H*0.35,W,H*0.3);
    const msg=document.getElementById('ov-score').textContent;
    ctx.fillStyle=goals>saves?'#44ff88':'#ff4444';
    ctx.font=`bold ${Math.round(W*.07)}px 'Cinzel Decorative',serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(goals>saves?'GOAL!':'SAVED!',W/2,H*0.5);
  }
}

function nextLevel(){
  document.getElementById('overlay').classList.remove('show');
  level++;
  gkName=Math.random()<0.5?'M':'R';
  kick=1; goals=0; saves=0; roundGoals=0;
  ball={x:W/2,y:H*0.78,r:12,vx:0,vy:0,flying:false};
  gk={x:W/2,y:GY+GH*0.7,w:22,h:36,vx:0,jumping:false,jumpDir:0};
  gameState='ready'; updateHUD();
}
function resolveKick(scored){
  if(scored)roundGoals++;
  gameState='result';
  updateHUD();
  setTimeout(()=>{
    if(kick>=5){
      setTimeout(()=>{
        const won=roundGoals>=1;
        if(won&&level>bestLevel){bestLevel=level;localStorage.setItem('pfbest',bestLevel);}
        document.getElementById('ov-title').textContent=won?'LEVEL COMPLETE!':'GAME OVER';
        document.getElementById('ov-score').textContent=`${roundGoals}/5 goals - Level ${level}`;
        document.getElementById('ov-msg').textContent=won?(roundGoals>=4?'Unstoppable!':roundGoals>=2?'Nice shooting!':'Barely made it!'): (level>1?`Reached Level ${level}!`:'Try again!');
        document.getElementById('btn-next').style.display=won?'':'none';
        document.getElementById('btn-replay').textContent=won?'Restart':'Try Again';
        document.getElementById('overlay').classList.add('show');
      },200);
    } else {
      kick++;
      ball={x:W/2,y:H*0.78,r:12,vx:0,vy:0,flying:false};
      gk={x:W/2,y:GY+GH*0.7,w:22,h:36,vx:0,jumping:false,jumpDir:0};
      gameState='ready'; updateHUD();
    }
  },1000);
}

function drawGK(x,y,w,h,name){
  ctx.save();ctx.translate(x,y);
  const isM=name==='M';
  const jcol=isM?'#1a56db':'#cc1111';
  const skin='#f5c89a'; const hair=isM?'#4a2000':'#111';
  // shorts
  ctx.fillStyle='#111';ctx.fillRect(-w/2,h*0.08,w,h*0.32);
  // socks & shin guards
  ctx.fillStyle=isM?'#ffffff':'#ffcc00';
  ctx.fillRect(-w/2+2,h*0.4,w*0.42,h*0.3);
  ctx.fillRect(w*0.08,h*0.4,w*0.42,h*0.3);
  // boots
  ctx.fillStyle='#111111';
  ctx.fillRect(-w/2,h*0.68,w*0.44,h*0.1);
  ctx.fillRect(w*0.06,h*0.68,w*0.44,h*0.1);
  // jersey body
  ctx.fillStyle=jcol;ctx.fillRect(-w/2,-h*0.2,w,h*0.3);
  // arms spread wide
  ctx.fillStyle=jcol;
  ctx.fillRect(-w*1.1,-h*0.18,w*0.62,h*0.11);
  ctx.fillRect(w*0.5,-h*0.18,w*0.62,h*0.11);
  // gloves
  ctx.fillStyle='#ffdd44';
  ctx.beginPath();ctx.arc(-w*1.08,-h*0.13,w*0.22,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(w*1.08,-h*0.13,w*0.22,0,Math.PI*2);ctx.fill();
  // neck
  ctx.fillStyle=skin;ctx.fillRect(-w*0.18,-h*0.26,w*0.36,h*0.1);
  // head
  ctx.fillStyle=skin;ctx.beginPath();ctx.arc(0,-h*0.42,w*0.52,0,Math.PI*2);ctx.fill();
  // hair
  ctx.fillStyle=hair;ctx.beginPath();ctx.arc(0,-h*0.42,w*0.52,Math.PI,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(0,-h*0.42,w*0.52,Math.PI*1.1,Math.PI*1.9);
  ctx.lineTo(0,-h*0.52);ctx.closePath();ctx.fill();
  // eyes
  ctx.fillStyle='#333';
  ctx.beginPath();ctx.arc(-w*0.17,-h*0.4,2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(w*0.17,-h*0.4,2,0,Math.PI*2);ctx.fill();
  // jersey number
  ctx.fillStyle='rgba(255,255,255,.9)';
  ctx.font=`bold ${Math.round(w*0.55)}px 'Orbitron',monospace`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(isM?'10':'7',0,-h*0.07);
  ctx.restore();
}
cv.addEventListener('mousemove',e=>{
  if(gameState!=='ready')return;
  const r=cv.getBoundingClientRect();
  aimX=Math.max(GX,Math.min(GX+GW,e.clientX-r.left));
  aimY=Math.max(GY,Math.min(GY+GH,e.clientY-r.top));
});
cv.addEventListener('mousedown',e=>{if(gameState==='ready'){charging=true;}});
cv.addEventListener('mouseup',e=>{kickBall();});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(gameState!=='ready')return;
  const t=e.touches[0],r=cv.getBoundingClientRect();
  aimX=Math.max(GX,Math.min(GX+GW,t.clientX-r.left));
  aimY=Math.max(GY,Math.min(GY+GH,t.clientY-r.top));
},{passive:false});
cv.addEventListener('touchstart',e=>{e.preventDefault();if(gameState==='ready')charging=true;},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();kickBall();},{passive:false});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(gameState==='ready')charging=true;}});
document.addEventListener('keyup',e=>{if(e.code==='Space'){e.preventDefault();kickBall();}});

window.addEventListener('resize',()=>resize());
newGame();
</script>
</body>
</html>
