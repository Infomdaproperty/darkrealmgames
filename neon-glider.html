<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neon Glider</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Orbitron:wght@700;900&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:#04040a;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:10px 10px 30px;user-select:none;-webkit-user-select:none;
  font-family:'Orbitron',monospace;overflow-x:hidden;
}
h1{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(1rem,5vw,1.8rem);
  background:linear-gradient(90deg,#00ffcc,#0088ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:.08em;margin-bottom:5px;margin-top:4px;
}
.scores{display:flex;gap:16px;margin-bottom:8px;}
.score-box{text-align:center;background:rgba(255,255,255,.04);border:1px solid rgba(0,255,200,.12);border-radius:6px;padding:3px 14px;}
.score-label{font-size:.5rem;color:rgba(255,255,255,.3);letter-spacing:.12em;text-transform:uppercase}
.score-val{font-size:1.1rem;color:#00ffcc;letter-spacing:.05em}
canvas{display:block;border-radius:6px;box-shadow:0 0 40px rgba(0,255,200,.18),0 0 2px rgba(0,255,200,.3);cursor:pointer;touch-action:none;}
.hint{font-size:.55rem;color:rgba(255,255,255,.18);margin-top:6px;letter-spacing:.1em;text-transform:uppercase;text-align:center;}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);z-index:100;align-items:center;justify-content:center;}
#overlay.show{display:flex}
.ov-box{background:linear-gradient(145deg,#060614,#04040a);border:2px solid #00ffcc;border-radius:14px;padding:28px 24px;text-align:center;max-width:260px;width:88%;box-shadow:0 0 60px rgba(0,255,200,.25);}
.ov-box h2{font-family:'Cinzel Decorative',serif;font-size:1.3rem;color:#00ffcc;margin-bottom:4px}
.ov-box .ov-score{font-size:1.8rem;color:#fff;margin-bottom:4px}
.ov-box p{color:rgba(255,255,255,.35);font-size:.7rem;margin-bottom:16px;letter-spacing:.08em}
.btn{background:linear-gradient(135deg,#003330,#001a18);border:1px solid #00ffcc;border-radius:8px;color:#00ffcc;font-family:'Orbitron',monospace;font-size:.8rem;font-weight:700;padding:11px 28px;cursor:pointer;letter-spacing:.08em;transition:transform .15s;}
.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div id="htp-overlay" style="position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.87);display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,sans-serif"><div style="background:#0d1117;border:2px solid #7c3aed;border-radius:18px;padding:26px 20px;max-width:320px;width:100%;text-align:center;color:#fff;box-shadow:0 0 50px rgba(124,58,237,.35)"><div style="font-size:2.2rem;margin-bottom:8px">&#127918;</div><h2 style="margin:0 0 12px;font-size:1.15rem;color:#a78bfa;letter-spacing:.02em">How to Play</h2><p style="margin:0 0 18px;font-size:.88rem;line-height:1.65;color:#cbd5e1">Tap or Space to glide upward<br>Release to glide gently down<br>Fly through the gaps between the pipes!</p><button onclick="document.getElementById('htp-overlay').remove()" style="background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:1rem;font-weight:700;cursor:pointer;width:100%;letter-spacing:.04em">&#9654; Let's Play!</button></div></div>
<h1>NEON GLIDER</h1>
<div class="scores">
  <div class="score-box"><div class="score-label">Score</div><div class="score-val" id="el-score">0</div></div>
  <div class="score-box"><div class="score-label">Best</div><div class="score-val" id="el-best">0</div></div>
</div>
<canvas id="cv"></canvas>
<div class="hint">Tap / Space to boost</div>
<div id="overlay">
  <div class="ov-box">
    <h2 id="ov-title">GAME OVER</h2>
    <div class="ov-score" id="ov-score">0</div>
    <p id="ov-msg">Keep flying!</p>
    <button class="btn" onclick="newGame()">Play Again</button>
  </div>
</div>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H;
const PIPE_W = 52;
const GRAVITY = 0.26;
const BOOST = -5.5;
const PIPE_SPEED_BASE = 1.4;
const PIPE_GAP_BASE = 220;
const BIRD_X_FRAC = 0.26;
const BIRD_R = 14;

let bird, pipes, stars, particles;
let score, best, gameState;
let raf, pipeTimer, pipeInterval;

function resize(){
  const avail = Math.min(window.innerWidth-20,360);
  W=avail; H=Math.round(W*1.75);
  cv.width=W; cv.height=H;
}

function newGame(){
  document.getElementById('overlay').classList.remove('show');
  resize();
  bird = {x:Math.round(W*BIRD_X_FRAC), y:H/2, vy:0, angle:0, alive:true, flash:0};
  pipes = [];
  score=0; best=+(localStorage.getItem('nglider_best')||0);
  gameState='idle';
  pipeTimer=0; pipeInterval=90;
  stars = Array.from({length:60},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.3,speed:Math.random()*.8+.3}));
  particles=[];
  updateHUD();
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
}

function boost(){
  if(gameState==='idle'){gameState='playing'; return;}
  if(gameState!=='playing') return;
  bird.vy=BOOST;
  bird.angle=-0.4;
  spawnParticles(bird.x,bird.y,'#00ffcc',5);
}

function updateHUD(){
  document.getElementById('el-score').textContent=score;
  document.getElementById('el-best').textContent=best;
}

function pipeSpeed(){ return PIPE_SPEED_BASE+score*0.055; }
function pipeGap(){ return Math.max(PIPE_GAP_BASE-score*1.5, 130); }

function spawnPipe(){
  const gap=pipeGap();
  const minY=H*0.18, maxY=H*0.75;
  const gapCenter=minY+Math.random()*(maxY-minY);
  const hue=180+score*7;
  pipes.push({x:W+PIPE_W/2, gapCenter, gap, hue, scored:false});
}

function spawnParticles(x,y,col,n=8){
  for(let i=0;i<n;i++){
    const ang=Math.random()*Math.PI*2, sp=Math.random()*3+1;
    particles.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:1,col,r:Math.random()*3+1});
  }
}

function drawShip(x,y,angle){
  ctx.save();
  ctx.translate(x,y); ctx.rotate(angle);
  ctx.shadowColor='#00ffcc'; ctx.shadowBlur=18;
  // Body
  ctx.beginPath();
  ctx.moveTo(BIRD_R,0);
  ctx.lineTo(-BIRD_R,-BIRD_R*.65);
  ctx.lineTo(-BIRD_R*.5,0);
  ctx.lineTo(-BIRD_R,BIRD_R*.65);
  ctx.closePath();
  const g=ctx.createLinearGradient(-BIRD_R,0,BIRD_R,0);
  g.addColorStop(0,'#004a44'); g.addColorStop(1,'#00ffcc');
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle='#00ffcc'; ctx.lineWidth=1.5; ctx.stroke();
  // Cockpit
  ctx.beginPath(); ctx.arc(0,0,BIRD_R*.35,0,Math.PI*2);
  ctx.fillStyle='rgba(0,255,200,.4)'; ctx.fill();
  ctx.shadowBlur=0;
  ctx.restore();
}

function drawPipe(pipe){
  const topH=pipe.gapCenter-pipe.gap/2;
  const botY=pipe.gapCenter+pipe.gap/2;
  const botH=H-botY;
  const hue=pipe.hue;
  ctx.shadowColor=`hsl(${hue},100%,60%)`; ctx.shadowBlur=12;

  function bar(y,h){
    if(h<=0) return;
    const g=ctx.createLinearGradient(pipe.x-PIPE_W/2,0,pipe.x+PIPE_W/2,0);
    g.addColorStop(0,`hsla(${hue},80%,20%,.85)`);
    g.addColorStop(.5,`hsla(${hue},100%,40%,.95)`);
    g.addColorStop(1,`hsla(${hue},80%,20%,.85)`);
    ctx.fillStyle=g;
    ctx.fillRect(pipe.x-PIPE_W/2,y,PIPE_W,h);
    // Rim
    ctx.fillStyle=`hsl(${hue},100%,65%)`;
    ctx.fillRect(pipe.x-PIPE_W/2,y+h-6,PIPE_W,6);
  }
  bar(0,topH); bar(botY,botH);
  ctx.shadowBlur=0;
}

function checkCollision(){
  if(bird.y-BIRD_R<0||bird.y+BIRD_R>H) return true;
  for(const p of pipes){
    if(Math.abs(bird.x-p.x)>PIPE_W/2+BIRD_R) continue;
    if(bird.y<p.gapCenter-p.gap/2+2||bird.y>p.gapCenter+p.gap/2-2) return true;
  }
  return false;
}

function loop(){
  raf=requestAnimationFrame(loop);

  // Update stars
  stars.forEach(s=>{
    if(gameState==='playing') s.x-=s.speed;
    if(s.x<0){s.x=W; s.y=Math.random()*H;}
  });

  if(gameState==='playing'){
    // Bird physics
    bird.vy+=GRAVITY;
    bird.y+=bird.vy;
    bird.angle=Math.min(Math.max(bird.angle+0.04,-0.4),1.2);

    // Pipes
    pipeTimer++;
    if(pipeTimer>=pipeInterval){ spawnPipe(); pipeTimer=0; pipeInterval=Math.max(60,90-score*2); }
    pipes.forEach(p=>p.x-=pipeSpeed());
    pipes=pipes.filter(p=>p.x>-PIPE_W);

    // Score
    pipes.forEach(p=>{
      if(!p.scored&&p.x<bird.x){ p.scored=true; score++; spawnParticles(bird.x,bird.y,'#ffee44',6); updateHUD(); }
    });

    // Collision
    if(checkCollision()){
      bird.alive=false; gameState='dead';
      spawnParticles(bird.x,bird.y,'#ff4444',16);
      if(score>best){ best=score; localStorage.setItem('nglider_best',best); updateHUD(); }
      setTimeout(()=>{
        document.getElementById('ov-title').textContent='GAME OVER';
        document.getElementById('ov-score').textContent=score;
        document.getElementById('ov-msg').textContent=score>=10?'Incredible flying!':score>=5?'Good run!':'Keep at it!';
        document.getElementById('overlay').classList.add('show');
      },700);
    }
  }

  // Particles
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.life-=0.025; });
  particles=particles.filter(p=>p.life>0);

  // === DRAW ===
  // BG
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#04040a'); bg.addColorStop(1,'#060a1a');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // Grid
  ctx.strokeStyle='rgba(0,255,200,.035)'; ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke(); }
  for(let y=0;y<H;y+=40){ ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke(); }

  // Stars
  stars.forEach(s=>{
    ctx.fillStyle=`rgba(255,255,255,${0.3+Math.random()*.1})`;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  });

  // Pipes
  pipes.forEach(drawPipe);

  // Particles
  particles.forEach(p=>{
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;

  // Bird
  if(bird.alive||gameState==='dead'){
    if(gameState!=='dead') drawShip(bird.x,bird.y,bird.angle);
    else if(particles.length>0) drawShip(bird.x,bird.y,bird.angle+0.1*Math.random());
  }

  // Score overlay
  ctx.fillStyle='rgba(0,255,200,.8)';
  ctx.font=`bold ${Math.round(W*.12)}px 'Orbitron',monospace`;
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText(score, W/2, 14);

  // Idle message
  if(gameState==='idle'){
    ctx.fillStyle='rgba(0,255,200,.6)';
    ctx.font=`${Math.round(W*.04)}px 'Orbitron',monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('TAP TO FLY', W/2, H/2+40);
    drawShip(bird.x,bird.y,0);
  }
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();boost();}
});
cv.addEventListener('click',boost);
cv.addEventListener('touchstart',e=>{e.preventDefault();boost();},{passive:false});
window.addEventListener('resize',()=>{resize();});

newGame();
</script>
</body>
</html>
