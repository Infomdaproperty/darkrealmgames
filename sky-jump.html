<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sky Jump</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito:wght@800;900&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:#020407;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:8px;
  user-select:none;
  -webkit-user-select:none;
  font-family:'Nunito',sans-serif;
  color:#fff;
}
h1{
  font-family:'Cinzel',serif;
  font-size:clamp(1.1rem,4.5vw,1.7rem);
  color:#a070ff;
  text-shadow:0 0 20px rgba(160,112,255,.5);
  letter-spacing:.12em;
  margin-bottom:6px;
}
.row{display:flex;gap:16px;margin-bottom:6px;justify-content:center}
.stat{background:rgba(255,255,255,.06);border:1px solid rgba(160,112,255,.2);border-radius:7px;padding:3px 14px;text-align:center}
.stat-label{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.35)}
.stat-val{font-size:1rem;font-weight:900;color:#c8a0ff}
canvas{display:block;border-radius:10px;box-shadow:0 0 40px rgba(160,112,255,.2),0 0 100px rgba(0,0,0,.8);touch-action:none}
.hint{font-size:.6rem;color:rgba(255,255,255,.18);letter-spacing:.06em;margin-top:5px;text-align:center}
#overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);
  backdrop-filter:blur(6px);z-index:100;align-items:center;justify-content:center;
}
#overlay.show{display:flex}
.ov-box{
  background:linear-gradient(145deg,#120820,#080310);
  border:2px solid #a070ff;
  border-radius:14px;
  padding:28px 24px;
  text-align:center;
  max-width:260px;width:88%;
  box-shadow:0 0 50px rgba(160,112,255,.35);
}
.ov-box h2{font-family:'Cinzel',serif;font-size:1.6rem;color:#a070ff;margin-bottom:8px}
.ov-box p{color:rgba(255,255,255,.45);font-size:.8rem;margin-bottom:4px}
.ov-score{font-size:2.4rem;font-weight:900;color:#fff;display:block;margin:6px 0 20px}
.btn{
  background:linear-gradient(135deg,#8040e0,#4010a0);
  border:1px solid #a070ff;
  border-radius:8px;
  color:#fff;
  font-family:'Cinzel',serif;
  font-size:.85rem;
  font-weight:700;
  padding:11px 28px;
  cursor:pointer;
  letter-spacing:.06em;
  transition:transform .15s,box-shadow .15s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(160,112,255,.4)}
</style>
</head>
<body>
<div id="htp-overlay" style="position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.87);display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,sans-serif"><div style="background:#0d1117;border:2px solid #7c3aed;border-radius:18px;padding:26px 20px;max-width:320px;width:100%;text-align:center;color:#fff;box-shadow:0 0 50px rgba(124,58,237,.35)"><div style="font-size:2.2rem;margin-bottom:8px">&#127918;</div><h2 style="margin:0 0 12px;font-size:1.15rem;color:#a78bfa;letter-spacing:.02em">How to Play</h2><p style="margin:0 0 18px;font-size:.88rem;line-height:1.65;color:#cbd5e1">Tap the left or right half of the screen, or use Arrow keys<br>Jump from platform to platform going up<br>Don't fall off the bottom!</p><button onclick="document.getElementById('htp-overlay').remove()" style="background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:1rem;font-weight:700;cursor:pointer;width:100%;letter-spacing:.04em">&#9654; Let's Play!</button></div></div>
<h1>SKY JUMP</h1>
<div class="row">
  <div class="stat"><div class="stat-label">Height</div><div class="stat-val" id="el-score">0</div></div>
  <div class="stat"><div class="stat-label">Best</div><div class="stat-val" id="el-best">0</div></div>
</div>
<canvas id="cv"></canvas>
<div class="hint">Arrow keys or tap left / right to move</div>
<div id="overlay">
  <div class="ov-box">
    <h2 id="ov-title">Game Over</h2>
    <p>Height reached</p>
    <span class="ov-score" id="ov-score">0</span>
    <button class="btn" onclick="startGame()">Play Again</button>
  </div>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

let W, H;
function resize(){
  const aw = Math.min(window.innerWidth-16, 340);
  const ah = Math.min(window.innerHeight*0.72, 540);
  W = aw; H = ah;
  cv.width = W; cv.height = H;
}

// === STATE ===
let player, platforms, stars, score, bestScore, cameraY, running, rafId, particles;

const GRAVITY = 0.42;
const JUMP = -12.5;
const PLAYER_W = 22, PLAYER_H = 18;
const PLAT_H = 10;

function startGame(){
  resize();
  cameraY = 0; // world Y at top of screen (increases upward)
  score = 0;
  running = true;

  player = {
    x: W/2,
    y: H - 60,
    vx: 0,
    vy: JUMP,
    worldY: 60, // height in world coords
    alive: true,
  };

  platforms = [];
  stars = [];
  particles = [];

  // Seed stars
  for(let i = 0; i < 80; i++){
    stars.push({
      x: Math.random()*W,
      y: Math.random()*H*5,
      r: Math.random()*1.5+.3,
      bright: Math.random()
    });
  }

  // Seed initial platforms
  // Starting platform under player
  platforms.push({x:W/2-45, worldY:60, w:90, type:'normal'});
  for(let i = 0; i < 20; i++) addPlatform(60+i*55);

  document.getElementById('overlay').classList.remove('show');
  cancelAnimationFrame(rafId);
  loop();
}

function addPlatform(minWorldY){
  const y = minWorldY + Math.random()*45;
  const w = 50 + Math.random()*45;
  const x = Math.random()*(W-w);
  const roll = Math.random();
  let type = 'normal';
  if(roll < .12) type = 'bounce';
  else if(roll < .22) type = 'moving';
  else if(roll < .28) type = 'crumble';
  platforms.push({
    x, worldY:y, w, type,
    dx: type==='moving' ? (Math.random()<.5?1:-1)*1.2 : 0,
    crumbled: false,
    crumbleTimer: 0,
  });
}

const keys = {};
document.addEventListener('keydown', e => keys[e.key]=true);
document.addEventListener('keyup', e => keys[e.key]=false);
let touchLeft = false, touchRight = false;
cv.addEventListener('touchstart', e => {
  e.preventDefault();
  const rect = cv.getBoundingClientRect();
  Array.from(e.touches).forEach(t => {
    const x = (t.clientX-rect.left)*(W/rect.width);
    if(x < W/2) touchLeft=true; else touchRight=true;
  });
}, {passive:false});
cv.addEventListener('touchend', e => {
  e.preventDefault();
  touchLeft=false; touchRight=false;
}, {passive:false});

function getLeft(){ return keys['ArrowLeft']||keys['a']||keys['A']||touchLeft; }
function getRight(){ return keys['ArrowRight']||keys['d']||keys['D']||touchRight; }

function spawnParticles(x, worldY, color){
  for(let i = 0; i < 8; i++){
    const ang = Math.random()*Math.PI*2;
    const spd = 1.5+Math.random()*2.5;
    particles.push({
      x, worldY, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd,
      life:1, color
    });
  }
}

function update(){
  // Input
  if(getLeft()){ player.vx = Math.max(player.vx-0.5, -5); }
  else if(getRight()){ player.vx = Math.min(player.vx+0.5, 5); }
  else { player.vx *= 0.82; }

  player.vy += GRAVITY;
  player.worldY += player.vy * .5; // world coords go DOWN when vy>0, so we subtract
  // Actually let's think: worldY increases going UP
  // vy < 0 = moving up, so worldY += -vy
  player.worldY -= player.vy; // worldY goes up when vy is negative

  player.x += player.vx;
  if(player.x < -PLAYER_W/2) player.x = W+PLAYER_W/2;
  if(player.x > W+PLAYER_W/2) player.x = -PLAYER_W/2;

  // Camera: keep player in upper 40% when moving up
  const screenY = H - (player.worldY - cameraY);
  if(screenY < H*0.4){
    cameraY = player.worldY - H*0.4;
  }

  // Platform collision (only when falling, i.e. vy > 0 = worldY decreasing)
  if(player.vy > 0){
    platforms.forEach(p => {
      if(p.crumbled) return;
      const py = H-(p.worldY-cameraY);
      const px = p.x;
      const pw = p.w;
      // Player bottom in screen coords
      const playerScreenY = H-(player.worldY-cameraY);
      const playerBottom = playerScreenY+PLAYER_H/2;
      const prevBottom = playerScreenY+PLAYER_H/2 - player.vy*0.5; // approximate
      if(prevBottom <= py+PLAT_H/2+2 && playerBottom >= py-PLAT_H/2-2){
        const cx = player.x;
        if(cx > px-4 && cx < px+pw+4){
          if(p.type==='bounce'){
            player.vy = JUMP*1.4;
            spawnParticles(cx, p.worldY, '#00ffaa');
          } else if(p.type==='crumble'){
            player.vy = JUMP;
            p.crumbled=true;
            spawnParticles(cx, p.worldY, '#ffaa44');
          } else {
            player.vy = JUMP;
          }
          if(p.type !== 'crumble') spawnParticles(cx, p.worldY, '#a070ff');
        }
      }
    });
  }

  // Move moving platforms
  platforms.forEach(p => {
    if(p.type==='moving'){
      p.x += p.dx;
      if(p.x < 0||p.x+p.w > W) p.dx *= -1;
    }
  });

  // Score
  const h = Math.floor(player.worldY/10);
  if(h > score){
    score = h;
    document.getElementById('el-score').textContent = score;
  }

  // Add new platforms
  const highest = Math.max(...platforms.map(p=>p.worldY));
  if(highest < cameraY + H + 500) addPlatform(highest+45);

  // Remove old platforms
  platforms = platforms.filter(p => p.worldY > cameraY - 50);

  // Update particles
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.x += p.vx; p.worldY += p.vy; p.vy += 0.1; p.life -= 0.045;
  });

  // Check death
  const screenBottom = H-(player.worldY-cameraY);
  if(screenBottom > H+PLAYER_H){
    running = false;
    if(score > bestScore) bestScore = score;
    document.getElementById('el-best').textContent = bestScore;
    document.getElementById('ov-score').textContent = score;
    document.getElementById('overlay').classList.add('show');
  }
}

function drawScene(){
  // Background gradient
  const gradient = ctx.createLinearGradient(0,0,0,H);
  gradient.addColorStop(0,'#02010a');
  gradient.addColorStop(1,'#06021a');
  ctx.fillStyle = gradient;
  ctx.fillRect(0,0,W,H);

  // Stars
  stars.forEach(s => {
    const sy = H - (s.y - cameraY*.05); // parallax
    if(sy < -4||sy > H+4) return;
    const flicker = .5+.5*Math.sin(Date.now()/600+s.bright*10);
    ctx.save();
    ctx.globalAlpha = (.4+.6*flicker)*(.3+.7*s.bright);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, sy, s.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });

  // Platforms
  platforms.forEach(p => {
    if(p.crumbled) return;
    const sy = H-(p.worldY-cameraY);
    if(sy < -PLAT_H-20||sy > H+20) return;

    ctx.save();
    let col, glow;
    if(p.type==='bounce'){ col='#00ffaa'; glow='rgba(0,255,170,.5)'; }
    else if(p.type==='moving'){ col='#ffcc00'; glow='rgba(255,204,0,.4)'; }
    else if(p.type==='crumble'){ col='#ff6622'; glow='rgba(255,100,30,.4)'; }
    else { col='#9060ff'; glow='rgba(144,96,255,.4)'; }

    ctx.shadowColor = glow;
    ctx.shadowBlur = 14;

    const grad = ctx.createLinearGradient(p.x,sy-PLAT_H/2,p.x,sy+PLAT_H/2);
    grad.addColorStop(0,'rgba(255,255,255,.25)');
    grad.addColorStop(.5,col);
    grad.addColorStop(1,shadeColor(col,-.3));
    ctx.fillStyle = grad;
    rRect(p.x, sy-PLAT_H/2, p.w, PLAT_H, 5);
    ctx.fill();

    // Spring icon on bounce platform
    if(p.type==='bounce'){
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${PLAT_H*.9}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowBlur = 0;
      ctx.fillText('↑', p.x+p.w/2, sy);
    }

    ctx.restore();
  });

  // Particles
  particles.forEach(p => {
    const sy = H-(p.worldY-cameraY);
    if(sy < 0||sy > H) return;
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(p.x, sy, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });

  // Player
  drawPlayer();
}

function drawPlayer(){
  const sy = H-(player.worldY-cameraY);
  ctx.save();
  ctx.translate(player.x, sy);

  const faceRight = player.vx >= 0;
  if(!faceRight) ctx.scale(-1,1);

  // Glow
  ctx.shadowColor = '#c8a0ff';
  ctx.shadowBlur = 20;

  // Body
  const bg = ctx.createRadialGradient(0,-2,2,0,-2,PLAYER_W/2);
  bg.addColorStop(0,'#c8a0ff');
  bg.addColorStop(.5,'#8040e0');
  bg.addColorStop(1,'#4010a0');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.ellipse(0, 0, PLAYER_W/2, PLAYER_H/2, 0, 0, Math.PI*2);
  ctx.fill();

  // Visor
  ctx.fillStyle = 'rgba(100,200,255,.35)';
  ctx.beginPath();
  ctx.ellipse(PLAYER_W*.18, -PLAYER_H*.12, PLAYER_W*.2, PLAYER_H*.25, 0, 0, Math.PI*2);
  ctx.fill();

  // Eye
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(PLAYER_W*.22, -PLAYER_H*.1, PLAYER_W*.07, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#2200aa';
  ctx.beginPath();
  ctx.arc(PLAYER_W*.24, -PLAYER_H*.1, PLAYER_W*.04, 0, Math.PI*2);
  ctx.fill();

  // Propeller/flame at bottom
  ctx.fillStyle = 'rgba(100,200,255,.6)';
  ctx.beginPath();
  ctx.ellipse(0, PLAYER_H*.5, PLAYER_W*.12, PLAYER_H*.2, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function shadeColor(hex,f){
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  r=Math.round(Math.max(0,Math.min(255,r+(r*f))));
  g=Math.round(Math.max(0,Math.min(255,g+(g*f))));
  b=Math.round(Math.max(0,Math.min(255,b+(b*f))));
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

function rRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function loop(){
  if(!running) return;
  update();
  drawScene();
  rafId = requestAnimationFrame(loop);
}

window.addEventListener('resize', () => { resize(); });

startGame();
</script>
</body>
</html>
