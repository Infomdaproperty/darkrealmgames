<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tap Fly</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Orbitron:wght@700;900&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#87ceeb;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px 10px 30px;user-select:none;-webkit-user-select:none;font-family:'Orbitron',monospace;overflow-x:hidden;}
h1{font-family:'Cinzel Decorative',serif;font-size:clamp(1rem,5vw,1.8rem);background:linear-gradient(90deg,#ff8800,#ffdd00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.08em;margin-bottom:5px;margin-top:4px;text-shadow:0 2px 8px rgba(0,0,0,.2);}
.scores{display:flex;gap:16px;margin-bottom:8px;}
.score-box{text-align:center;background:rgba(255,255,255,.5);border:1px solid rgba(255,136,0,.3);border-radius:6px;padding:3px 14px;}
.score-label{font-size:.5rem;color:rgba(0,0,0,.4);letter-spacing:.12em;text-transform:uppercase}
.score-val{font-size:1.1rem;color:#ff6600;letter-spacing:.05em}
canvas{display:block;border-radius:6px;box-shadow:0 4px 24px rgba(0,0,0,.2);cursor:pointer;touch-action:none;}
.hint{font-size:.55rem;color:rgba(0,0,0,.3);margin-top:6px;letter-spacing:.1em;text-transform:uppercase;text-align:center;}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:100;align-items:center;justify-content:center;}
#overlay.show{display:flex}
.ov-box{background:linear-gradient(145deg,#fff9ee,#fff);border:2px solid #ff8800;border-radius:14px;padding:28px 24px;text-align:center;max-width:260px;width:88%;box-shadow:0 0 60px rgba(255,136,0,.3);}
.ov-box h2{font-family:'Cinzel Decorative',serif;font-size:1.3rem;color:#ff6600;margin-bottom:4px}
.ov-box .ov-score{font-size:1.8rem;color:#333;margin-bottom:4px}
.ov-box p{color:rgba(0,0,0,.35);font-size:.7rem;margin-bottom:16px;letter-spacing:.08em}
.btn{background:linear-gradient(135deg,#ff8800,#ff4400);border:none;border-radius:8px;color:#fff;font-family:'Orbitron',monospace;font-size:.8rem;font-weight:700;padding:11px 28px;cursor:pointer;letter-spacing:.08em;transition:transform .15s;}
.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<h1>TAP FLY</h1>
<div class="scores">
  <div class="score-box"><div class="score-label">Score</div><div class="score-val" id="el-score">0</div></div>
  <div class="score-box"><div class="score-label">Best</div><div class="score-val" id="el-best">0</div></div>
</div>
<canvas id="cv"></canvas>
<div class="hint">Tap / Space to flap</div>
<div id="overlay">
  <div class="ov-box">
    <h2 id="ov-title">OUCH!</h2>
    <div class="ov-score" id="ov-score">0</div>
    <p id="ov-msg">Keep flapping!</p>
    <button class="btn" onclick="newGame()">Play Again</button>
  </div>
</div>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H;

const GRAVITY = 0.4;
const FLAP = -7.5;
const PIPE_W = 56;
const BIRD_R = 16;
const BIRD_X_FRAC = 0.25;
const PIPE_SPEED_BASE = 2.0;
const GAP_BASE = 195;

let bird, pipes, clouds, particles, score, best, gameState, raf, pipeTimer, pipeInterval;

function resize(){
  const avail = Math.min(window.innerWidth-20, 360);
  W = avail; H = Math.round(W*1.75);
  cv.width = W; cv.height = H;
}

function newGame(){
  document.getElementById('overlay').classList.remove('show');
  resize();
  score = 0; best = +(localStorage.getItem('tapfly_best')||0);
  gameState = 'idle';
  bird = {x:Math.round(W*BIRD_X_FRAC), y:H/2, vy:0, angle:0, alive:true, wingAngle:0};
  pipes = []; particles = [];
  pipeTimer = 0; pipeInterval = 90;
  clouds = Array.from({length:5},()=>({x:Math.random()*W,y:Math.random()*H*0.5,speed:Math.random()*.5+.2,w:Math.random()*60+40,h:Math.random()*20+15}));
  updateHUD();
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
}

function flap(){
  if(gameState==='idle'){gameState='playing';return;}
  if(gameState!=='playing') return;
  bird.vy = FLAP;
  bird.angle = -0.45;
  for(let i=0;i<5;i++){
    const ang=Math.PI/2+Math.random()*.8-0.4;
    particles.push({x:bird.x,y:bird.y,vx:Math.cos(ang)*2,vy:Math.sin(ang)*2,life:1,col:'#ffffff88',r:3});
  }
}

function updateHUD(){
  document.getElementById('el-score').textContent=score;
  document.getElementById('el-best').textContent=best;
}

function pipeSpeed(){ return PIPE_SPEED_BASE+score*0.07; }
function pipeGap(){ return Math.max(GAP_BASE-score*2,120); }

function spawnPipe(){
  const gap=pipeGap();
  const minY=H*0.2, maxY=H*0.75;
  const gc=minY+Math.random()*(maxY-minY);
  pipes.push({x:W+PIPE_W/2,gapCenter:gc,gap,scored:false});
}

function loop(){
  raf=requestAnimationFrame(loop);

  if(gameState==='playing'){
    bird.vy+=GRAVITY;
    bird.y+=bird.vy;
    bird.angle=Math.min(Math.max(bird.angle+0.045,-0.45),1.3);
    bird.wingAngle+=0.2;

    pipeTimer++;
    if(pipeTimer>=pipeInterval){
      spawnPipe(); pipeTimer=0;
      pipeInterval=Math.max(55,90-score*2);
    }
    pipes.forEach(p=>p.x-=pipeSpeed());
    pipes=pipes.filter(p=>p.x>-PIPE_W);

    pipes.forEach(p=>{
      if(!p.scored&&p.x<bird.x){p.scored=true;score++;updateHUD();
        for(let i=0;i<6;i++){
          const ang=Math.random()*Math.PI*2;
          particles.push({x:bird.x,y:bird.y,vx:Math.cos(ang)*3,vy:Math.sin(ang)*3,life:1,col:'#ffdd00',r:4});
        }
      }
    });

    // Collision
    let dead=false;
    if(bird.y-BIRD_R<0||bird.y+BIRD_R>H) dead=true;
    pipes.forEach(p=>{
      if(Math.abs(bird.x-p.x)>PIPE_W/2+BIRD_R-2) return;
      if(bird.y<p.gapCenter-p.gap/2+2||bird.y>p.gapCenter+p.gap/2-2) dead=true;
    });
    if(dead){
      bird.alive=false; gameState='dead';
      for(let i=0;i<16;i++){const ang=Math.random()*Math.PI*2,sp=Math.random()*4+1;
        particles.push({x:bird.x,y:bird.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:1,col:'#ffaa00',r:Math.random()*4+2});}
      if(score>best){best=score;localStorage.setItem('tapfly_best',best);updateHUD();}
      setTimeout(()=>{
        document.getElementById('ov-title').textContent='OUCH!';
        document.getElementById('ov-score').textContent=score;
        document.getElementById('ov-msg').textContent=score>=20?'Amazing flier!':score>=10?'Nice flying!':'Keep flapping!';
        document.getElementById('overlay').classList.add('show');
      },700);
    }
  }

  // Clouds
  clouds.forEach(c=>{c.x-=c.speed;if(c.x+c.w<0)c.x=W+c.w;});

  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=0.025;});
  particles=particles.filter(p=>p.life>0);

  draw();
}

function draw(){
  // Sky gradient
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#5ba8e8');
  sky.addColorStop(0.7,'#87ceeb');
  sky.addColorStop(1,'#c8e8a0');
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);

  // Ground
  ctx.fillStyle='#6aaa44';
  ctx.fillRect(0,H-20,W,20);
  ctx.fillStyle='#88cc55';
  ctx.fillRect(0,H-22,W,4);

  // Clouds
  clouds.forEach(c=>{
    ctx.fillStyle='rgba(255,255,255,.85)';
    ctx.beginPath();
    ctx.ellipse(c.x,c.y,c.w/2,c.h/2,0,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x-c.w*0.25,c.y+c.h*0.1,c.w*0.3,c.h*0.4,0,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x+c.w*0.25,c.y+c.h*0.1,c.w*0.28,c.h*0.4,0,0,Math.PI*2);
    ctx.fill();
  });

  // Pipes
  pipes.forEach(p=>{
    const topH=p.gapCenter-p.gap/2;
    const botY=p.gapCenter+p.gap/2;
    const botH=H-botY;

    function drawPipe(py,ph,flip){
      if(ph<=0) return;
      const g=ctx.createLinearGradient(p.x-PIPE_W/2,0,p.x+PIPE_W/2,0);
      g.addColorStop(0,'#2a8c2a');g.addColorStop(.4,'#44cc44');g.addColorStop(1,'#1a6a1a');
      ctx.fillStyle=g;
      ctx.fillRect(p.x-PIPE_W/2,py,PIPE_W,ph);
      // Cap
      ctx.fillStyle='#55dd55';
      const capH=14,capW=PIPE_W+8;
      if(!flip) ctx.fillRect(p.x-capW/2,py+ph-capH,capW,capH);
      else ctx.fillRect(p.x-capW/2,py,capW,capH);
      // Highlight
      ctx.fillStyle='rgba(255,255,255,.18)';
      ctx.fillRect(p.x-PIPE_W/2+4,py,8,ph);
    }
    drawPipe(0,topH,false);
    drawPipe(botY,botH,true);
  });

  // Particles
  particles.forEach(p=>{
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;

  // Bird
  if(bird.alive||gameState==='dead'){
    ctx.save();
    ctx.translate(bird.x,bird.y);
    ctx.rotate(bird.angle);

    // Wing
    const wingDip=Math.sin(bird.wingAngle)*12;
    ctx.fillStyle='#ffaa00';
    ctx.beginPath();
    ctx.ellipse(-4,wingDip,BIRD_R*.5,BIRD_R*.28,0,0,Math.PI*2);
    ctx.fill();

    // Body
    ctx.fillStyle='#ffdd00';
    ctx.shadowColor='#ff8800';ctx.shadowBlur=10;
    ctx.beginPath();ctx.ellipse(0,0,BIRD_R,BIRD_R*.8,0,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;

    // Eye
    ctx.fillStyle='#222';
    ctx.beginPath();ctx.arc(BIRD_R*.4,-BIRD_R*.2,BIRD_R*.22,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(BIRD_R*.45,-BIRD_R*.25,BIRD_R*.1,0,Math.PI*2);ctx.fill();

    // Beak
    ctx.fillStyle='#ff8800';
    ctx.beginPath();ctx.moveTo(BIRD_R*.7,0);ctx.lineTo(BIRD_R*1.2,-BIRD_R*.1);ctx.lineTo(BIRD_R*1.2,BIRD_R*.15);ctx.closePath();ctx.fill();

    ctx.restore();
  }

  // Score overlay
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.font=`bold ${Math.round(W*.12)}px 'Orbitron',monospace`;
  ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillText(score,W/2,16);

  if(gameState==='idle'){
    ctx.fillStyle='rgba(255,100,0,.85)';
    ctx.font=`${Math.round(W*.045)}px 'Orbitron',monospace`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('TAP TO FLY',W/2,H/2+50);
  }
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flap();}});
cv.addEventListener('click',flap);
cv.addEventListener('touchstart',e=>{e.preventDefault();flap();},{passive:false});
window.addEventListener('resize',resize);
newGame();
</script>
</body>
</html>
