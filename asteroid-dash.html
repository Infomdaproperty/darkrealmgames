<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Asteroid Dash</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Orbitron:wght@700;900&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#050508;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px 10px 30px;user-select:none;-webkit-user-select:none;font-family:'Orbitron',monospace;overflow-x:hidden;}
h1{font-family:'Cinzel Decorative',serif;font-size:clamp(1rem,5vw,1.8rem);background:linear-gradient(90deg,#4488ff,#44ffcc,#ff8844);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.08em;margin-bottom:6px;margin-top:4px;}
.scores{display:flex;gap:12px;margin-bottom:8px;}
.score-box{text-align:center;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:3px 12px;}
.score-label{font-size:.5rem;color:rgba(255,255,255,.3);letter-spacing:.12em;text-transform:uppercase}
.score-val{font-size:1.1rem;color:#44ffcc;letter-spacing:.05em}
canvas{display:block;border-radius:6px;box-shadow:0 0 40px rgba(68,136,255,.2);cursor:pointer;touch-action:none;}
.hint{font-size:.55rem;color:rgba(255,255,255,.18);margin-top:6px;letter-spacing:.1em;text-transform:uppercase;text-align:center;}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);z-index:100;align-items:center;justify-content:center;}
#overlay.show{display:flex}
.ov-box{background:linear-gradient(145deg,#060614,#04040a);border:2px solid #4488ff;border-radius:14px;padding:28px 24px;text-align:center;max-width:260px;width:88%;box-shadow:0 0 60px rgba(68,136,255,.3);}
.ov-box h2{font-family:'Cinzel Decorative',serif;font-size:1.3rem;color:#ff8844;margin-bottom:4px}
.ov-box .ov-score{font-size:1.8rem;color:#fff;margin-bottom:4px}
.ov-box p{color:rgba(255,255,255,.35);font-size:.7rem;margin-bottom:16px;letter-spacing:.08em}
.btn{background:linear-gradient(135deg,#001433,#00331a);border:1px solid #4488ff;border-radius:8px;color:#4488ff;font-family:'Orbitron',monospace;font-size:.8rem;font-weight:700;padding:11px 28px;cursor:pointer;letter-spacing:.08em;transition:transform .15s;}
.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div id="htp-overlay" style="position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.87);display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,sans-serif"><div style="background:#0d1117;border:2px solid #7c3aed;border-radius:18px;padding:26px 20px;max-width:320px;width:100%;text-align:center;color:#fff;box-shadow:0 0 50px rgba(124,58,237,.35)"><div style="font-size:2.2rem;margin-bottom:8px">&#127918;</div><h2 style="margin:0 0 12px;font-size:1.15rem;color:#a78bfa;letter-spacing:.02em">How to Play</h2><p style="margin:0 0 18px;font-size:.88rem;line-height:1.65;color:#cbd5e1">Move with Arrow keys or tap the sides<br>Tap the centre or press Space to shoot<br>Blast the asteroids before they hit you!</p><button onclick="document.getElementById('htp-overlay').remove()" style="background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:1rem;font-weight:700;cursor:pointer;width:100%;letter-spacing:.04em">&#9654; Let's Play!</button></div></div>
<h1>ASTEROID DASH</h1>
<div class="scores">
  <div class="score-box"><div class="score-label">Dist</div><div class="score-val" id="el-score">0</div></div>
  <div class="score-box"><div class="score-label">Lives</div><div class="score-val" id="el-lives">3</div></div>
  <div class="score-box"><div class="score-label">Best</div><div class="score-val" id="el-best">0</div></div>
</div>
<canvas id="cv"></canvas>
<div class="hint">Up/Down arrows or drag to dodge  |  Double-tap for boost</div>
<div id="overlay">
  <div class="ov-box">
    <h2 id="ov-title">GAME OVER</h2>
    <div class="ov-score" id="ov-score">0</div>
    <p id="ov-msg">Dodge the asteroids!</p>
    <button class="btn" onclick="newGame()">Play Again</button>
  </div>
</div>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H;

const SHIP_W = 26, SHIP_H = 18;
const SHIP_X_FRAC = 0.18;
const GRAVITY_DRIFT = 0.0;
const MOVE_SPEED = 4;
const BOOST_DUR = 60;

let ship, asteroids, stars, particles, trails;
let score, lives, best, gameState, raf;
let keyUp=false, keyDown=false, boostTimer=0;
let touchY = null, lastTouchY = null;
let spawnTimer = 0;

function resize(){
  const avail = Math.min(window.innerWidth - 20, 360);
  W = avail; H = Math.round(W * 1.55);
  cv.width = W; cv.height = H;
}

function makeAsteroid(x){
  const r = 10 + Math.random() * 22;
  const y = r + Math.random() * (H - r*2);
  const spd = 2 + Math.random() * 2.5;
  const pts = [];
  const sides = 7 + Math.floor(Math.random()*4);
  for(let i=0;i<sides;i++){
    const a = (i/sides)*Math.PI*2;
    const dist = r * (0.72 + Math.random()*0.28);
    pts.push([Math.cos(a)*dist, Math.sin(a)*dist]);
  }
  return {x, y, r, spd, pts, angle:Math.random()*Math.PI*2, spin:(Math.random()-.5)*0.025, alive:true};
}

function newGame(){
  document.getElementById('overlay').classList.remove('show');
  resize();
  ship = {x: W*SHIP_X_FRAC, y: H/2, vy: 0, boosting: false, boostTimer: 0, invincible: 0, flashTimer: 0};
  asteroids = [];
  stars = Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.3,spd:Math.random()*.8+.3}));
  particles = []; trails = [];
  score = 0; lives = 3;
  best = +(localStorage.getItem('astdash_best') || 0);
  spawnTimer = 0; boostTimer = 0;
  gameState = 'playing';
  updateHUD();
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
}

function updateHUD(){
  document.getElementById('el-score').textContent = score;
  document.getElementById('el-lives').textContent = lives;
  document.getElementById('el-best').textContent = best;
}

function spawnParticles(x,y,col,n){
  for(let i=0;i<n;i++){
    const ang=Math.random()*Math.PI*2, sp=Math.random()*4+1;
    particles.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:1,col,r:Math.random()*3+1});
  }
}

function drawShip(x, y, boosting){
  ctx.save();
  ctx.translate(x, y);
  ctx.shadowColor = boosting ? '#ff8844' : '#44ffcc'; ctx.shadowBlur = boosting ? 20 : 14;
  // Hull
  const g = ctx.createLinearGradient(-SHIP_W/2,0,SHIP_W/2,0);
  g.addColorStop(0,'#002244'); g.addColorStop(1,'#44ffcc');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(SHIP_W/2, 0);
  ctx.lineTo(-SHIP_W/2, -SHIP_H/2);
  ctx.lineTo(-SHIP_W/3, 0);
  ctx.lineTo(-SHIP_W/2, SHIP_H/2);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#44ffcc'; ctx.lineWidth = 1.5; ctx.stroke();
  // Engine glow
  const exhaustLen = boosting ? 22 + Math.random()*8 : 12;
  const eg = ctx.createLinearGradient(-SHIP_W/2,0,-SHIP_W/2-exhaustLen,0);
  eg.addColorStop(0, boosting?'#ff8844':'#4488ff');
  eg.addColorStop(1,'transparent');
  ctx.fillStyle = eg;
  ctx.fillRect(-SHIP_W/2-exhaustLen, -4, exhaustLen, 8);
  ctx.restore();
}

function drawAsteroid(a){
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(a.angle);
  ctx.shadowColor = 'rgba(150,120,80,.5)'; ctx.shadowBlur = 6;
  const g = ctx.createRadialGradient(-a.r*.3,-a.r*.3,1,0,0,a.r);
  g.addColorStop(0,'#9a7a5a');
  g.addColorStop(0.6,'#6a5a4a');
  g.addColorStop(1,'#3a3028');
  ctx.fillStyle = g;
  ctx.beginPath();
  if(a.pts.length > 0){
    ctx.moveTo(a.pts[0][0], a.pts[0][1]);
    for(let i=1;i<a.pts.length;i++) ctx.lineTo(a.pts[i][0], a.pts[i][1]);
    ctx.closePath();
  }
  ctx.fill();
  ctx.strokeStyle = 'rgba(200,180,140,.3)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
}

function loop(){
  raf = requestAnimationFrame(loop);
  const scrollSpd = 2 + score * 0.004;

  if(gameState === 'playing'){
    // Ship movement
    if(keyUp) ship.vy -= 0.5;
    if(keyDown) ship.vy += 0.5;
    ship.vy *= 0.88;
    ship.y += ship.vy;
    ship.y = Math.max(SHIP_H, Math.min(H - SHIP_H, ship.y));

    if(ship.boosting){ ship.boostTimer--; if(ship.boostTimer<=0){ ship.boosting=false; } }
    if(ship.invincible > 0) ship.invincible--;

    // Trail
    trails.push({x:ship.x, y:ship.y, life:1});
    trails.forEach(t => t.life -= 0.07);
    trails = trails.filter(t => t.life > 0);

    // Stars scroll
    stars.forEach(s => { s.x -= s.spd * scrollSpd * 0.3; if(s.x < 0) s.x = W + 2; });

    // Asteroids
    spawnTimer++;
    const spawnInterval = Math.max(20, 55 - score*0.08);
    if(spawnTimer >= spawnInterval){ asteroids.push(makeAsteroid(W + 30)); spawnTimer=0; }

    asteroids.forEach(a => { a.x -= (a.spd + scrollSpd * 0.4); a.angle += a.spin; });
    asteroids = asteroids.filter(a => a.x > -a.r - 10);

    // Score
    score++;
    if(score % 60 === 0) updateHUD();

    // Collision
    if(ship.invincible <= 0){
      for(const a of asteroids){
        const dx = ship.x - a.x, dy = ship.y - a.y;
        const minDist = a.r * 0.75 + 9;
        if(dx*dx + dy*dy < minDist*minDist){
          lives--;
          spawnParticles(ship.x, ship.y, '#44ffcc', 12);
          ship.invincible = 90;
          updateHUD();
          if(lives <= 0){
            gameState = 'dead';
            if(score > best){ best = score; localStorage.setItem('astdash_best',best); updateHUD(); }
            setTimeout(()=>{
              document.getElementById('ov-title').textContent = 'GAME OVER';
              document.getElementById('ov-score').textContent = score;
              document.getElementById('ov-msg').textContent = score >= 500 ? 'Dash legend!' : score >= 200 ? 'Nice flying!' : 'Dodge the asteroids!';
              document.getElementById('overlay').classList.add('show');
            }, 700);
          }
          break;
        }
      }
    }
  }

  particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; p.life-=0.025; });
  particles = particles.filter(p => p.life > 0);

  // Draw BG
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#020208'); bg.addColorStop(1,'#060612');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  // Stars
  stars.forEach(s => {
    ctx.fillStyle = `rgba(255,255,255,${0.3+Math.random()*.08})`;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  });

  // Trails
  for(let i=1;i<trails.length;i++){
    ctx.globalAlpha = trails[i].life * 0.3;
    ctx.fillStyle = ship.boosting ? '#ff8844' : '#44ffcc';
    const r = 3 * trails[i].life;
    ctx.beginPath(); ctx.arc(trails[i].x,trails[i].y,r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Asteroids
  asteroids.forEach(drawAsteroid);

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Ship (flash when invincible)
  if(gameState === 'playing'){
    const show = ship.invincible <= 0 || Math.floor(ship.invincible/5)%2 === 0;
    if(show) drawShip(ship.x, ship.y, ship.boosting);
  }

  // Boost indicator
  if(ship.boosting){
    const pct = ship.boostTimer / BOOST_DUR;
    ctx.fillStyle = `rgba(255,136,68,${pct*0.5})`;
    ctx.fillRect(0,0,W*pct,4);
  }
}

// Boost trigger
function triggerBoost(){
  if(gameState !== 'playing') return;
  ship.boosting = true; ship.boostTimer = BOOST_DUR;
  ship.vy -= 5;
  spawnParticles(ship.x,ship.y,'#ff8844',8);
}

// Keys
document.addEventListener('keydown', e => {
  if(e.code==='ArrowUp'){ e.preventDefault(); keyUp=true; }
  if(e.code==='ArrowDown'){ e.preventDefault(); keyDown=true; }
  if(e.code==='Space'){ e.preventDefault(); triggerBoost(); }
});
document.addEventListener('keyup', e => {
  if(e.code==='ArrowUp') keyUp=false;
  if(e.code==='ArrowDown') keyDown=false;
});

// Touch
let lastTap = 0;
cv.addEventListener('touchstart', e => {
  e.preventDefault();
  touchY = e.touches[0].clientY;
  // Double-tap boost
  const now = Date.now();
  if(now - lastTap < 300) triggerBoost();
  lastTap = now;
}, {passive:false});
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  if(touchY === null) return;
  const dy = e.touches[0].clientY - touchY;
  ship.y = Math.max(SHIP_H, Math.min(H-SHIP_H, ship.y + dy * 0.8));
  touchY = e.touches[0].clientY;
}, {passive:false});
cv.addEventListener('touchend', e => { touchY=null; }, {passive:false});

window.addEventListener('resize', () => { resize(); });

newGame();
</script>
</body>
</html>
