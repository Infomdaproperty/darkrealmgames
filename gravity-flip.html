<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gravity Flip</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Orbitron:wght@700;900&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#050508;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px 10px 30px;user-select:none;-webkit-user-select:none;font-family:'Orbitron',monospace;overflow-x:hidden;}
h1{font-family:'Cinzel Decorative',serif;font-size:clamp(1rem,5vw,1.8rem);background:linear-gradient(90deg,#cc44ff,#00e5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.08em;margin-bottom:5px;margin-top:4px;}
.scores{display:flex;gap:16px;margin-bottom:8px;}
.score-box{text-align:center;background:rgba(255,255,255,.04);border:1px solid rgba(204,68,255,.15);border-radius:6px;padding:3px 14px;}
.score-label{font-size:.5rem;color:rgba(255,255,255,.3);letter-spacing:.12em;text-transform:uppercase}
.score-val{font-size:1.1rem;color:#cc44ff;letter-spacing:.05em}
canvas{display:block;border-radius:6px;box-shadow:0 0 40px rgba(204,68,255,.18);cursor:pointer;touch-action:none;}
.hint{font-size:.55rem;color:rgba(255,255,255,.18);margin-top:6px;letter-spacing:.1em;text-transform:uppercase;text-align:center;}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);z-index:100;align-items:center;justify-content:center;}
#overlay.show{display:flex}
.ov-box{background:linear-gradient(145deg,#060614,#04040a);border:2px solid #cc44ff;border-radius:14px;padding:28px 24px;text-align:center;max-width:260px;width:88%;box-shadow:0 0 60px rgba(204,68,255,.25);}
.ov-box h2{font-family:'Cinzel Decorative',serif;font-size:1.3rem;color:#cc44ff;margin-bottom:4px}
.ov-box .ov-score{font-size:1.8rem;color:#fff;margin-bottom:4px}
.ov-box p{color:rgba(255,255,255,.35);font-size:.7rem;margin-bottom:16px;letter-spacing:.08em}
.btn{background:linear-gradient(135deg,#200030,#100018);border:1px solid #cc44ff;border-radius:8px;color:#cc44ff;font-family:'Orbitron',monospace;font-size:.8rem;font-weight:700;padding:11px 28px;cursor:pointer;letter-spacing:.08em;transition:transform .15s;}
.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div id="htp-overlay" style="position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.87);display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,sans-serif"><div style="background:#0d1117;border:2px solid #7c3aed;border-radius:18px;padding:26px 20px;max-width:320px;width:100%;text-align:center;color:#fff;box-shadow:0 0 50px rgba(124,58,237,.35)"><div style="font-size:2.2rem;margin-bottom:8px">&#127918;</div><h2 style="margin:0 0 12px;font-size:1.15rem;color:#a78bfa;letter-spacing:.02em">How to Play</h2><p style="margin:0 0 18px;font-size:.88rem;line-height:1.65;color:#cbd5e1">Tap or Space to flip gravity up or down<br>Fly through the gaps without touching the walls<br>Time each flip carefully!</p><button onclick="document.getElementById('htp-overlay').remove()" style="background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:1rem;font-weight:700;cursor:pointer;width:100%;letter-spacing:.04em">&#9654; Let's Play!</button></div></div>
<h1>GRAVITY FLIP</h1>
<div class="scores">
  <div class="score-box"><div class="score-label">Score</div><div class="score-val" id="el-score">0</div></div>
  <div class="score-box"><div class="score-label">Best</div><div class="score-val" id="el-best">0</div></div>
</div>
<canvas id="cv"></canvas>
<div class="hint">Tap / Space to flip gravity</div>
<div id="overlay">
  <div class="ov-box">
    <h2 id="ov-title">SPIKED!</h2>
    <div class="ov-score" id="ov-score">0</div>
    <p id="ov-msg">Keep flipping!</p>
    <button class="btn" onclick="newGame()">Play Again</button>
  </div>
</div>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H;

function resize(){
  const avail = Math.min(window.innerWidth-20, 380);
  W = avail; H = Math.round(W*1.5);
  cv.width = W; cv.height = H;
}

const PLAYER_X = 80;
const PLAYER_SIZE = 18;
const GRAVITY_STRENGTH = 0.45;
const FLIP_VEL = -8;
const SCROLL_SPEED_BASE = 2.5;
const SPIKE_H = 22;
const SPIKE_W = 18;
const GAP_MIN = 90;

let player, obstacles, particles, bgLines;
let score, best, gameState, raf;
let scrollX = 0;
let spawnX = 0;
let speed = SCROLL_SPEED_BASE;

function newGame(){
  document.getElementById('overlay').classList.remove('show');
  resize();
  score = 0; best = +(localStorage.getItem('gravflip_best')||0);
  gameState = 'idle';
  player = {y:H/2, vy:0, gravity:1, alive:true, trail:[]};
  obstacles = []; particles = [];
  scrollX = 0; spawnX = W;
  speed = SCROLL_SPEED_BASE;
  bgLines = Array.from({length:12},(_,i)=>({x:Math.random()*W,speed:1+Math.random()*2,hue:i*30}));
  updateHUD();
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
}

function flip(){
  if(gameState==='idle'){gameState='playing';return;}
  if(gameState!=='playing') return;
  player.gravity *= -1;
  player.vy = player.gravity>0 ? Math.abs(FLIP_VEL)*0.6 : -Math.abs(FLIP_VEL)*0.6;
  for(let i=0;i<6;i++){
    const ang=Math.random()*Math.PI*2;
    particles.push({x:PLAYER_X,y:player.y,vx:Math.cos(ang)*3,vy:Math.sin(ang)*3,life:1,col:'#cc44ff',r:3});
  }
}

function updateHUD(){
  document.getElementById('el-score').textContent=score;
  document.getElementById('el-best').textContent=best;
}

function spawnObstacle(){
  // Ceiling spikes (pointing down) and floor spikes (pointing up)
  const hasFloor = Math.random()<0.7;
  const hasCeil = Math.random()<0.7;
  const floorCount = hasFloor ? 1+Math.floor(Math.random()*3) : 0;
  const ceilCount = hasCeil ? 1+Math.floor(Math.random()*3) : 0;
  for(let i=0;i<floorCount;i++){
    obstacles.push({x:spawnX+i*SPIKE_W*1.4,y:H,pointDown:false});
  }
  for(let i=0;i<ceilCount;i++){
    obstacles.push({x:spawnX+i*SPIKE_W*1.4,y:0,pointDown:true});
  }
  spawnX += SPIKE_W*4 + GAP_MIN + Math.random()*80;
}

function loop(){
  raf=requestAnimationFrame(loop);

  if(gameState==='playing'){
    // Physics
    player.vy += GRAVITY_STRENGTH * player.gravity;
    player.y += player.vy;

    // Walls
    if(player.y < PLAYER_SIZE/2 || player.y > H-PLAYER_SIZE/2){
      gameState='dead';
      boom();
      return;
    }

    scrollX += speed;
    speed = SCROLL_SPEED_BASE + score*0.03;

    // Spawn obstacles
    while(spawnX-scrollX < W+100){
      spawnObstacle();
    }

    // Move obstacles
    obstacles = obstacles.filter(o=>(o.x-scrollX)>-SPIKE_W);

    // Score based on distance
    if(Math.floor(scrollX/60) > score){
      score = Math.floor(scrollX/60);
      updateHUD();
      if(score>best){best=score;localStorage.setItem('gravflip_best',best);updateHUD();}
    }

    // Collision
    for(const o of obstacles){
      const ox = o.x - scrollX;
      if(Math.abs(ox-PLAYER_X)>SPIKE_W/2+PLAYER_SIZE/2) continue;
      // Floor spike: tip at top
      if(!o.pointDown && player.y > H-SPIKE_H-PLAYER_SIZE/2+4){
        gameState='dead'; boom(); return;
      }
      // Ceiling spike: tip at bottom
      if(o.pointDown && player.y < SPIKE_H+PLAYER_SIZE/2-4){
        gameState='dead'; boom(); return;
      }
    }

    // Trail
    player.trail.push({y:player.y,life:1});
    if(player.trail.length>10) player.trail.shift();
    player.trail.forEach(t=>t.life-=0.1);

    // BG lines
    bgLines.forEach(l=>{l.x-=l.speed;if(l.x<-80)l.x=W+Math.random()*80;});
  }

  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=0.025;});
  particles=particles.filter(p=>p.life>0);

  draw();
}

function boom(){
  for(let i=0;i<16;i++){
    const ang=Math.random()*Math.PI*2,sp=Math.random()*5+1;
    particles.push({x:PLAYER_X,y:player.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:1,col:`hsl(${Math.random()*60+260},100%,60%)`,r:Math.random()*5+2});
  }
  setTimeout(()=>{
    document.getElementById('ov-title').textContent='SPIKED!';
    document.getElementById('ov-score').textContent=score;
    document.getElementById('ov-msg').textContent=score>50?'Gravity Master!':score>20?'Great run!':'Keep flipping!';
    document.getElementById('overlay').classList.add('show');
  },700);
}

function draw(){
  // Tunnel BG
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#070309');
  bg.addColorStop(0.5,'#050508');
  bg.addColorStop(1,'#070309');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);

  // Speed lines
  bgLines.forEach(l=>{
    ctx.strokeStyle=`hsla(${l.hue},70%,30%,.15)`;
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(l.x,0);ctx.lineTo(l.x-40,H);ctx.stroke();
  });

  // Tunnel walls
  ctx.fillStyle='#1a0030';
  ctx.fillRect(0,0,W,16);
  ctx.fillRect(0,H-16,W,16);
  ctx.fillStyle='rgba(204,68,255,.3)';
  ctx.fillRect(0,14,W,2);
  ctx.fillRect(0,H-16,W,2);

  // Floor spikes (pointing up)
  obstacles.forEach(o=>{
    const ox=o.x-scrollX;
    if(ox<-SPIKE_W||ox>W+SPIKE_W) return;
    ctx.shadowColor='#00e5ff';ctx.shadowBlur=8;
    ctx.fillStyle='#00e5ff';
    ctx.beginPath();
    if(!o.pointDown){
      ctx.moveTo(ox-SPIKE_W/2,H-16);
      ctx.lineTo(ox,H-16-SPIKE_H);
      ctx.lineTo(ox+SPIKE_W/2,H-16);
    } else {
      ctx.moveTo(ox-SPIKE_W/2,16);
      ctx.lineTo(ox,16+SPIKE_H);
      ctx.lineTo(ox+SPIKE_W/2,16);
    }
    ctx.closePath();ctx.fill();
    ctx.shadowBlur=0;
  });

  // Player trail
  player.trail.forEach((t,i)=>{
    ctx.globalAlpha=t.life*0.25;
    ctx.fillStyle='#cc44ff';
    const s=PLAYER_SIZE*(i/player.trail.length);
    ctx.beginPath();ctx.rect(PLAYER_X-s/2,t.y-s/2,s,s);ctx.fill();
  });
  ctx.globalAlpha=1;

  // Player
  if(gameState!=='dead'){
    ctx.save();
    ctx.translate(PLAYER_X,player.y);
    if(player.gravity<0) ctx.scale(1,-1);
    ctx.shadowColor='#cc44ff';ctx.shadowBlur=18;
    // Body
    const g=ctx.createLinearGradient(0,-PLAYER_SIZE/2,0,PLAYER_SIZE/2);
    g.addColorStop(0,'#cc44ff');g.addColorStop(1,'#6600aa');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(0,-PLAYER_SIZE/2);
    ctx.lineTo(-PLAYER_SIZE/2,PLAYER_SIZE/2);
    ctx.lineTo(0,PLAYER_SIZE/4);
    ctx.lineTo(PLAYER_SIZE/2,PLAYER_SIZE/2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle='#ff88ff';ctx.lineWidth=1.5;ctx.stroke();
    ctx.shadowBlur=0;
    ctx.restore();
  }

  // Particles
  particles.forEach(p=>{
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;

  // Score
  ctx.fillStyle='rgba(204,68,255,.7)';
  ctx.font=`bold ${Math.round(W*.1)}px 'Orbitron',monospace`;
  ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillText(score,W/2,20);

  if(gameState==='idle'){
    ctx.fillStyle='rgba(204,68,255,.7)';
    ctx.font=`${Math.round(W*.04)}px 'Orbitron',monospace`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('TAP TO START',W/2,H/2+40);
  }
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flip();}});
cv.addEventListener('click',flip);
cv.addEventListener('touchstart',e=>{e.preventDefault();flip();},{passive:false});
window.addEventListener('resize',resize);
newGame();
</script>
</body>
</html>
