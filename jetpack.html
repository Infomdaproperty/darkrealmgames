<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jetpack</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Orbitron:wght@700;900&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#050508;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px 10px 30px;user-select:none;-webkit-user-select:none;font-family:'Orbitron',monospace;overflow-x:hidden;}
h1{font-family:'Cinzel Decorative',serif;font-size:clamp(1rem,5vw,1.8rem);background:linear-gradient(90deg,#ff6600,#ffaa00,#ffdd44);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.08em;margin-bottom:6px;margin-top:4px;}
.scores{display:flex;gap:12px;margin-bottom:8px;}
.score-box{text-align:center;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:3px 12px;}
.score-label{font-size:.5rem;color:rgba(255,255,255,.3);letter-spacing:.12em;text-transform:uppercase}
.score-val{font-size:1.1rem;color:#ffaa00;letter-spacing:.05em}
canvas{display:block;border-radius:6px;box-shadow:0 0 40px rgba(255,102,0,.2);cursor:pointer;touch-action:none;}
.hint{font-size:.55rem;color:rgba(255,255,255,.18);margin-top:6px;letter-spacing:.1em;text-transform:uppercase;text-align:center;}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);z-index:100;align-items:center;justify-content:center;}
#overlay.show{display:flex}
.ov-box{background:linear-gradient(145deg,#060614,#04040a);border:2px solid #ff6600;border-radius:14px;padding:28px 24px;text-align:center;max-width:260px;width:88%;box-shadow:0 0 60px rgba(255,102,0,.25);}
.ov-box h2{font-family:'Cinzel Decorative',serif;font-size:1.3rem;color:#ffaa00;margin-bottom:4px}
.ov-box .ov-score{font-size:1.8rem;color:#fff;margin-bottom:4px}
.ov-box p{color:rgba(255,255,255,.35);font-size:.7rem;margin-bottom:16px;letter-spacing:.08em}
.btn{background:linear-gradient(135deg,#331400,#1a0a00);border:1px solid #ff6600;border-radius:8px;color:#ff6600;font-family:'Orbitron',monospace;font-size:.8rem;font-weight:700;padding:11px 28px;cursor:pointer;letter-spacing:.08em;transition:transform .15s;}
.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div id="htp-overlay" style="position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.87);display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,sans-serif"><div style="background:#0d1117;border:2px solid #7c3aed;border-radius:18px;padding:26px 20px;max-width:320px;width:100%;text-align:center;color:#fff;box-shadow:0 0 50px rgba(124,58,237,.35)"><div style="font-size:2.2rem;margin-bottom:8px">&#127918;</div><h2 style="margin:0 0 12px;font-size:1.15rem;color:#a78bfa;letter-spacing:.02em">How to Play</h2><p style="margin:0 0 18px;font-size:.88rem;line-height:1.65;color:#cbd5e1">Hold tap or Space to fly upward<br>Release to drop<br>Collect coins and dodge the obstacles!</p><button onclick="document.getElementById('htp-overlay').remove()" style="background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:1rem;font-weight:700;cursor:pointer;width:100%;letter-spacing:.04em">&#9654; Let's Play!</button></div></div>
<h1>JETPACK</h1>
<div class="scores">
  <div class="score-box"><div class="score-label">Dist</div><div class="score-val" id="el-score">0</div></div>
  <div class="score-box"><div class="score-label">Coins</div><div class="score-val" id="el-coins">0</div></div>
  <div class="score-box"><div class="score-label">Best</div><div class="score-val" id="el-best">0</div></div>
</div>
<canvas id="cv"></canvas>
<div class="hint">Hold Space / Hold tap to thrust up</div>
<div id="overlay">
  <div class="ov-box">
    <h2 id="ov-title">GAME OVER</h2>
    <div class="ov-score" id="ov-score">0</div>
    <p id="ov-msg">Watch the rocks!</p>
    <button class="btn" onclick="newGame()">Play Again</button>
  </div>
</div>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H;

const GRAVITY = 0.28;
const THRUST = -0.55;
const SCROLL_BASE = 2.5;
const CHAR_W = 22, CHAR_H = 22;
const STAL_W = 18;

let char, stalactites, stalagmites, coins, particles;
let score, coinCount, best, gameState, raf, thrustOn, scrollX, flameFrame;

function resize(){
  const avail = Math.min(window.innerWidth - 20, 360);
  W = avail; H = Math.round(W * 1.5);
  cv.width = W; cv.height = H;
}

function makeStal(x, fromTop){
  const len = 18 + Math.random() * 35;
  const hue = 180 + Math.random() * 60;
  return {x, len, fromTop, hue};
}

function makeCoin(x, y){
  return {x, y, r: 7, collected: false, angle: 0};
}

function newGame(){
  document.getElementById('overlay').classList.remove('show');
  resize();
  char = {x: W * 0.22, y: H / 2, vy: 0};
  stalactites = []; stalagmites = []; coins = [];
  particles = [];
  score = 0; coinCount = 0;
  best = +(localStorage.getItem('jetpack_best') || 0);
  thrustOn = false; scrollX = 0; flameFrame = 0;
  gameState = 'playing';

  // Pre-spawn some obstacles
  for(let x = W + 60; x < W + 800; x += 160 + Math.random()*80){
    stalactites.push(makeStal(x, true));
    stalagmites.push(makeStal(x + 30 + Math.random()*30, false));
  }
  for(let x = W + 80; x < W + 500; x += 120 + Math.random()*80){
    coins.push(makeCoin(x, H * (0.25 + Math.random() * 0.5)));
  }

  updateHUD();
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
}

function updateHUD(){
  document.getElementById('el-score').textContent = score;
  document.getElementById('el-coins').textContent = coinCount;
  document.getElementById('el-best').textContent = best;
}

function spawnParticles(x, y, col, n){
  for(let i=0;i<n;i++){
    const ang = Math.random()*Math.PI*2, sp = Math.random()*3+1;
    particles.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:1,col,r:Math.random()*3+1});
  }
}

function loop(){
  raf = requestAnimationFrame(loop);

  const spd = SCROLL_BASE + score * 0.003;

  if(gameState === 'playing'){
    // Physics
    if(thrustOn) char.vy += THRUST;
    char.vy += GRAVITY;
    char.vy = Math.max(-8, Math.min(char.vy, 8));
    char.y += char.vy;
    flameFrame++;

    // Score
    score++;
    if(score % 60 === 0) updateHUD();

    // Scroll
    stalactites.forEach(s => s.x -= spd);
    stalagmites.forEach(s => s.x -= spd);
    coins.forEach(c => c.x -= spd);
    coins.forEach(c => c.angle += 0.05);

    // Spawn new
    const lastStal = stalactites.reduce((m,s)=>s.x>m?s.x:m, 0);
    if(lastStal < W + 200){
      const nx = lastStal + 160 + Math.random() * 80;
      stalactites.push(makeStal(nx, true));
      stalagmites.push(makeStal(nx + 20 + Math.random()*40, false));
      if(Math.random() < 0.6) coins.push(makeCoin(nx + 50, H * (0.2 + Math.random()*0.6)));
    }

    // Cleanup
    stalactites = stalactites.filter(s => s.x > -50);
    stalagmites = stalagmites.filter(s => s.x > -50);
    coins = coins.filter(c => c.x > -20);

    // Collect coins
    coins.forEach(c => {
      if(c.collected) return;
      const dx = char.x - c.x, dy = char.y - c.y;
      if(dx*dx + dy*dy < (CHAR_W/2 + c.r)*(CHAR_W/2 + c.r)){
        c.collected = true; coinCount += 5; score += 10;
        spawnParticles(c.x, c.y, '#ffee44', 8);
        updateHUD();
      }
    });

    // Collision with ceiling/floor
    const margin = 30;
    if(char.y - CHAR_H/2 < margin || char.y + CHAR_H/2 > H - margin){
      die();
    }

    // Collision with stalactites
    stalactites.forEach(s => {
      if(Math.abs(char.x - s.x) < CHAR_W/2 + STAL_W/2){
        const stalBottom = margin + s.len;
        if(char.y - CHAR_H/2 < stalBottom) die();
      }
    });

    // Collision with stalagmites
    stalagmites.forEach(s => {
      if(Math.abs(char.x - s.x) < CHAR_W/2 + STAL_W/2){
        const stalTop = H - margin - s.len;
        if(char.y + CHAR_H/2 > stalTop) die();
      }
    });
  }

  particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; p.life-=0.025; });
  particles = particles.filter(p => p.life > 0);

  // Draw
  // Cave BG
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#080810');
  bg.addColorStop(1,'#0a0a14');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  // Cave walls (ceiling and floor)
  const margin = 30;
  ctx.fillStyle = '#141420';
  ctx.fillRect(0, 0, W, margin); // ceiling
  ctx.fillRect(0, H - margin, W, margin); // floor

  // Ceiling stalactites
  stalactites.forEach(s => {
    ctx.save();
    ctx.shadowColor = `hsl(${s.hue},80%,50%)`; ctx.shadowBlur = 8;
    const g = ctx.createLinearGradient(s.x, margin, s.x, margin + s.len);
    g.addColorStop(0, '#1e1e2e');
    g.addColorStop(0.7, `hsl(${s.hue},60%,30%)`);
    g.addColorStop(1, `hsl(${s.hue},100%,60%)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(s.x - STAL_W/2, margin);
    ctx.lineTo(s.x + STAL_W/2, margin);
    ctx.lineTo(s.x, margin + s.len);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  });

  // Floor stalagmites
  stalagmites.forEach(s => {
    ctx.save();
    ctx.shadowColor = `hsl(${s.hue},80%,50%)`; ctx.shadowBlur = 8;
    const g = ctx.createLinearGradient(s.x, H - margin - s.len, s.x, H - margin);
    g.addColorStop(0, `hsl(${s.hue},100%,60%)`);
    g.addColorStop(0.3, `hsl(${s.hue},60%,30%)`);
    g.addColorStop(1, '#1e1e2e');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(s.x, H - margin - s.len);
    ctx.lineTo(s.x - STAL_W/2, H - margin);
    ctx.lineTo(s.x + STAL_W/2, H - margin);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  });

  // Coins
  coins.forEach(c => {
    if(c.collected) return;
    ctx.save();
    ctx.shadowColor = '#ffee44'; ctx.shadowBlur = 12;
    const cg = ctx.createRadialGradient(c.x, c.y, 1, c.x, c.y, c.r);
    cg.addColorStop(0,'#fff9aa');
    cg.addColorStop(0.5,'#ffee44');
    cg.addColorStop(1,'#cc8800');
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r * Math.abs(Math.cos(c.angle)) + 1, 0, Math.PI*2);
    ctx.fillStyle = cg; ctx.fill();
    ctx.restore();
  });

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Character
  if(gameState === 'playing' || gameState === 'dying'){
    const cx = char.x, cy = char.y;
    // Jetpack flames
    if(thrustOn){
      for(let i=0;i<3;i++){
        const fh = 10 + Math.random()*12;
        const fw = 5 + Math.random()*4;
        const fx = cx - 10 + i * 8;
        ctx.save();
        ctx.shadowColor = '#ff6600'; ctx.shadowBlur = 10;
        const fg = ctx.createLinearGradient(fx, cy + CHAR_H/2, fx, cy + CHAR_H/2 + fh);
        fg.addColorStop(0,'#ffff88');
        fg.addColorStop(0.4,'#ff6600');
        fg.addColorStop(1,'rgba(255,0,0,0)');
        ctx.fillStyle = fg;
        ctx.fillRect(fx - fw/2, cy + CHAR_H/2 - 4, fw, fh);
        ctx.restore();
      }
    }
    // Body
    ctx.save();
    ctx.shadowColor = '#44aaff'; ctx.shadowBlur = 14;
    // Suit
    ctx.fillStyle = '#1a3366';
    ctx.beginPath(); ctx.roundRect(cx - CHAR_W/2, cy - CHAR_H/2, CHAR_W, CHAR_H, 4); ctx.fill();
    // Visor
    ctx.fillStyle = '#44ddff';
    ctx.beginPath(); ctx.arc(cx + 2, cy - 3, 7, 0, Math.PI*2); ctx.fill();
    // Jetpack
    ctx.fillStyle = '#ff6600';
    ctx.fillRect(cx - CHAR_W/2 - 6, cy - 6, 8, 14);
    ctx.restore();
  }
}

function die(){
  if(gameState !== 'playing') return;
  gameState = 'dead';
  spawnParticles(char.x, char.y, '#ff6600', 20);
  if(score > best){ best = score; localStorage.setItem('jetpack_best', best); updateHUD(); }
  setTimeout(()=>{
    document.getElementById('ov-title').textContent = 'GAME OVER';
    document.getElementById('ov-score').textContent = score;
    document.getElementById('ov-msg').textContent = score >= 300 ? 'Jetpack ace!' : score >= 150 ? 'Nice flight!' : 'Watch the rocks!';
    document.getElementById('overlay').classList.add('show');
  }, 700);
}

// Controls
document.addEventListener('keydown', e => { if(e.code === 'Space'){ e.preventDefault(); thrustOn = true; } });
document.addEventListener('keyup', e => { if(e.code === 'Space') thrustOn = false; });
cv.addEventListener('touchstart', e => { e.preventDefault(); thrustOn = true; }, {passive:false});
cv.addEventListener('touchend', e => { e.preventDefault(); thrustOn = false; }, {passive:false});
cv.addEventListener('mousedown', () => thrustOn = true);
cv.addEventListener('mouseup', () => thrustOn = false);
window.addEventListener('resize', () => { resize(); });

newGame();
</script>
</body>
</html>
