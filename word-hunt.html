<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Word Hunt</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito:wght@700;800;900&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:radial-gradient(ellipse at top,#1a0a2e 0%,#07050f 100%);
  color:#fff;
  font-family:'Nunito',sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:10px 12px 20px;
  user-select:none;
  -webkit-user-select:none;
  overflow-x:hidden;
}
h1{
  font-family:'Cinzel',serif;
  font-size:clamp(1.3rem,5.5vw,2rem);
  color:#f0c060;
  text-shadow:0 0 20px rgba(240,192,96,.4);
  letter-spacing:.1em;
  margin-bottom:8px;
}
.top-row{display:flex;gap:16px;margin-bottom:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.stat{background:rgba(255,255,255,.07);border:1px solid rgba(240,192,96,.2);border-radius:8px;padding:4px 14px;text-align:center}
.stat-label{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.4)}
.stat-val{font-size:1.2rem;font-weight:900;color:#f0c060}
#timer-ring{width:46px;height:46px}
#word-display{
  font-size:clamp(1.2rem,5vw,1.7rem);
  font-weight:900;
  letter-spacing:.12em;
  color:#fff;
  text-transform:uppercase;
  min-height:2rem;
  margin-bottom:6px;
  text-shadow:0 0 16px rgba(240,192,96,.5);
  transition:color .15s;
}
#word-display.valid{color:#6affb0}
#word-display.used{color:#ff6b6b}
.grid-wrap{position:relative;touch-action:none;margin-bottom:10px}
canvas#cv{display:block;cursor:pointer;border-radius:12px;overflow:hidden}
.found-panel{
  width:100%;
  max-width:360px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(240,192,96,.15);
  border-radius:10px;
  padding:8px 12px;
  min-height:40px;
  max-height:90px;
  overflow-y:auto;
}
.found-panel h3{font-size:.65rem;letter-spacing:.12em;color:rgba(255,255,255,.35);text-transform:uppercase;margin-bottom:4px}
.words-list{display:flex;flex-wrap:wrap;gap:4px}
.word-chip{
  background:rgba(106,255,176,.12);
  border:1px solid rgba(106,255,176,.3);
  border-radius:4px;
  padding:1px 7px;
  font-size:.72rem;
  font-weight:700;
  color:#6affb0;
  text-transform:uppercase;
  letter-spacing:.06em;
}
#overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(6px);
  z-index:100;
  align-items:center;
  justify-content:center;
}
#overlay.show{display:flex}
.ov-box{
  background:linear-gradient(145deg,#1a0a2e,#07050f);
  border:2px solid #f0c060;
  border-radius:16px;
  padding:32px 28px;
  text-align:center;
  max-width:280px;
  width:88%;
  box-shadow:0 0 60px rgba(240,192,96,.3);
}
.ov-box h2{font-family:'Cinzel',serif;font-size:1.8rem;color:#f0c060;margin-bottom:10px}
.ov-score{font-size:2.4rem;font-weight:900;color:#fff;display:block;margin:8px 0 20px}
.btn{
  background:linear-gradient(135deg,#f0c060,#c8880a);
  border:none;
  border-radius:10px;
  color:#1a0a2e;
  font-family:'Cinzel',serif;
  font-size:.95rem;
  font-weight:700;
  padding:12px 32px;
  cursor:pointer;
  letter-spacing:.06em;
  transition:transform .15s,box-shadow .15s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(240,192,96,.35)}
</style>
</head>
<body>
<h1>WORD HUNT</h1>
<div class="top-row">
  <div class="stat"><div class="stat-label">Score</div><div class="stat-val" id="el-score">0</div></div>
  <svg id="timer-ring" viewBox="0 0 46 46">
    <circle cx="23" cy="23" r="20" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="4"/>
    <circle id="timer-arc" cx="23" cy="23" r="20" fill="none" stroke="#f0c060"
      stroke-width="4" stroke-linecap="round"
      stroke-dasharray="125.66" stroke-dashoffset="0"
      transform="rotate(-90 23 23)"/>
    <text x="23" y="27" text-anchor="middle" fill="#fff" font-family="Nunito,sans-serif" font-weight="900" font-size="11" id="timer-text">90</text>
  </svg>
  <div class="stat"><div class="stat-label">Words</div><div class="stat-val" id="el-words">0</div></div>
</div>
<div id="word-display"></div>
<div class="grid-wrap">
  <canvas id="cv"></canvas>
</div>
<div class="found-panel">
  <h3>Found words</h3>
  <div class="words-list" id="words-list"></div>
</div>
<div id="overlay">
  <div class="ov-box">
    <h2 id="ov-title">Time's Up!</h2>
    <p style="color:rgba(255,255,255,.5);font-size:.85rem">Final Score</p>
    <span class="ov-score" id="ov-score">0</span>
    <button class="btn" onclick="startGame()">Play Again</button>
  </div>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

// Compact word list (3-6 letters, common English words)
const WORDS = new Set(`ace act add age ago aid aim air ale all and ant any ape apt arc are ark arm art ash ask ate awe axe aye

back bade balk ball balm bane bang bane bank bare bark barn base bash bask bass bath bats baud bawl beak beam bean bear beat beds beef been beer bell belt berm best beta bile bill bimbo bind bins bird bite bits blob blot blow blue blur boar boat bold bole bolt bond bone boo boom boon boor boot bore born both bout bowl brat bred brew brim brow buck buff bulk bull bump bunk bunt burn burp burr bury bush busy butt buzz
cafe cage cake calk call calm came cane cape carp cart case cash cast cave cede cell chad char chat chew chin chip chop chow chug cite clam clan clap claw clay clew clog clop clot club clue coal coat coax code coil coin coke cold colt coma come cone cool cope cord core cork corn cost coup cove cozy crab cram cred crew crop crow crud cube cuff cult curd cure curl curt cusp cute cyan

const GRID = 4;
const TIME = 90;

// Letter frequency weights
const LETTERS = 'AAAAAAAAABBCCDDDEEEEEEEEEEEFFGGHHIIIIIIJKLLLLMMNNNOOOOOOOPPQRRRRRRSSSSTTTTTTTUUUUVVWWXYYZ';

let cells, selected, path, pathSet, found, timer, timeLeft, score, running;
let CELL, canvasW;

function resize(){
  const avail = Math.min(window.innerWidth - 24, 320);
  CELL = Math.floor(avail / GRID);
  canvasW = CELL * GRID;
  cv.width = canvasW;
  cv.height = canvasW;
}

function makeGrid(){
  return Array.from({length:GRID*GRID}, () => LETTERS[Math.floor(Math.random()*LETTERS.length)]);
}

function startGame(){
  resize();
  cells = makeGrid();
  selected = [];
  path = [];
  pathSet = new Set();
  found = new Set();
  score = 0;
  timeLeft = TIME;
  running = true;
  document.getElementById('words-list').innerHTML = '';
  document.getElementById('el-score').textContent = '0';
  document.getElementById('el-words').textContent = '0';
  document.getElementById('overlay').classList.remove('show');
  updateDisplay('');
  updateTimer();
  if(timer) clearInterval(timer);
  timer = setInterval(() => {
    timeLeft--;
    updateTimer();
    if(timeLeft <= 0){
      clearInterval(timer);
      running = false;
      endGame();
    }
  }, 1000);
  requestAnimationFrame(loop);
}

function updateTimer(){
  const frac = timeLeft / TIME;
  const dash = 125.66;
  document.getElementById('timer-arc').setAttribute('stroke-dashoffset', dash*(1-frac));
  document.getElementById('timer-arc').setAttribute('stroke', timeLeft <= 15 ? '#ff5252' : '#f0c060');
  document.getElementById('timer-text').textContent = timeLeft;
}

function updateDisplay(text){
  const el = document.getElementById('word-display');
  el.textContent = text;
  el.className = '';
  if(text.length >= 3){
    if(found.has(text.toLowerCase())) el.className = 'used';
    else if(WORDS.has(text.toLowerCase())) el.className = 'valid';
  }
}

function idxToXY(idx){
  return {x:(idx%GRID)*CELL + CELL/2, y:Math.floor(idx/GRID)*CELL + CELL/2};
}

function xyToIdx(px, py){
  const c = Math.floor(px/CELL), r = Math.floor(py/CELL);
  if(c < 0||c >= GRID||r < 0||r >= GRID) return -1;
  return r*GRID+c;
}

function adjacent(a, b){
  const ar = Math.floor(a/GRID), ac = a%GRID;
  const br = Math.floor(b/GRID), bc = b%GRID;
  return Math.abs(ar-br) <= 1 && Math.abs(ac-bc) <= 1 && a !== b;
}

function beginPath(px, py){
  if(!running) return;
  const idx = xyToIdx(px, py);
  if(idx < 0) return;
  selected = [idx];
  pathSet = new Set([idx]);
  updateDisplay(cells[idx]);
}

function extendPath(px, py){
  if(!running || selected.length === 0) return;
  const idx = xyToIdx(px, py);
  if(idx < 0) return;
  if(pathSet.has(idx)) return;
  const last = selected[selected.length-1];
  if(!adjacent(last, idx)) return;
  selected.push(idx);
  pathSet.add(idx);
  const word = selected.map(i => cells[i]).join('');
  updateDisplay(word);
}

function commitWord(){
  if(!running) return;
  const word = selected.map(i => cells[i]).join('').toLowerCase();
  if(word.length >= 3 && WORDS.has(word) && !found.has(word)){
    found.add(word);
    const pts = [0,0,0,100,200,400,800][Math.min(word.length,6)] || 800;
    score += pts;
    document.getElementById('el-score').textContent = score;
    document.getElementById('el-words').textContent = found.size;
    addChip(word);
    flashValid();
  }
  selected = [];
  pathSet = new Set();
  updateDisplay('');
}

function addChip(word){
  const chip = document.createElement('div');
  chip.className = 'word-chip';
  chip.textContent = word;
  document.getElementById('words-list').prepend(chip);
}

function flashValid(){
  cv.style.boxShadow = '0 0 30px rgba(106,255,176,.6)';
  setTimeout(() => cv.style.boxShadow = '', 350);
}

function endGame(){
  document.getElementById('ov-score').textContent = score;
  document.getElementById('overlay').classList.add('show');
}

function getPos(e, touch){
  const rect = cv.getBoundingClientRect();
  const scX = cv.width/rect.width, scY = cv.height/rect.height;
  if(touch) return {x:(touch.clientX-rect.left)*scX, y:(touch.clientY-rect.top)*scY};
  return {x:(e.clientX-rect.left)*scX, y:(e.clientY-rect.top)*scY};
}

cv.addEventListener('mousedown', e => beginPath(...Object.values(getPos(e))));
cv.addEventListener('mousemove', e => { if(e.buttons) extendPath(...Object.values(getPos(e))); });
cv.addEventListener('mouseup', () => commitWord());
cv.addEventListener('mouseleave', () => commitWord());
cv.addEventListener('touchstart', e => { e.preventDefault(); const p = getPos(null,e.touches[0]); beginPath(p.x,p.y); },{passive:false});
cv.addEventListener('touchmove', e => { e.preventDefault(); const p = getPos(null,e.touches[0]); extendPath(p.x,p.y); },{passive:false});
cv.addEventListener('touchend', e => { e.preventDefault(); commitWord(); },{passive:false});
window.addEventListener('resize', () => { resize(); });

function drawScene(){
  ctx.clearRect(0,0,canvasW,canvasW);

  // Board bg
  const bg = ctx.createRadialGradient(canvasW/2,canvasW/2,0,canvasW/2,canvasW/2,canvasW*.7);
  bg.addColorStop(0,'#1f0d40');
  bg.addColorStop(1,'#0d0520');
  ctx.fillStyle = bg;
  ctx.beginPath();
  rRect(ctx,0,0,canvasW,canvasW,10);
  ctx.fill();

  // Connection line
  if(selected.length > 1){
    ctx.save();
    ctx.lineWidth = CELL*.12;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(240,192,96,.35)';
    ctx.beginPath();
    selected.forEach((idx,i) => {
      const p = idxToXY(idx);
      i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y);
    });
    ctx.stroke();
    ctx.restore();
  }

  const now = Date.now();

  cells.forEach((letter, idx) => {
    const r = Math.floor(idx/GRID), c = idx%GRID;
    const x = c*CELL, y = r*CELL;
    const cx = x+CELL/2, cy = y+CELL/2;
    const pad = CELL*.1;
    const sz = CELL-pad*2;
    const isSel = pathSet.has(idx);
    const isLast = selected.length > 0 && selected[selected.length-1] === idx;

    ctx.save();

    if(isSel){
      ctx.shadowColor = '#f0c060';
      ctx.shadowBlur = CELL*.5;
    }

    // Tile
    const tileGrad = ctx.createLinearGradient(x+pad,y+pad,x+pad+sz,y+pad+sz);
    if(isSel){
      tileGrad.addColorStop(0,'#5c3a00');
      tileGrad.addColorStop(.5,'#8a5800');
      tileGrad.addColorStop(1,'#3d2600');
    } else {
      tileGrad.addColorStop(0,'#2a1a4a');
      tileGrad.addColorStop(.5,'#1e1035');
      tileGrad.addColorStop(1,'#140b25');
    }
    ctx.fillStyle = tileGrad;
    rRect(ctx, x+pad, y+pad, sz, sz, sz*.18);
    ctx.fill();

    // Shine
    const shine = ctx.createLinearGradient(x+pad, y+pad, x+pad, y+pad+sz*.5);
    shine.addColorStop(0, `rgba(255,255,255,${isSel?.25:.12})`);
    shine.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = shine;
    rRect(ctx, x+pad, y+pad, sz, sz*.45, sz*.18);
    ctx.fill();

    // Border
    ctx.strokeStyle = isSel ? 'rgba(240,192,96,.8)' : 'rgba(255,255,255,.08)';
    ctx.lineWidth = isSel ? 2 : 1;
    rRect(ctx, x+pad+.5, y+pad+.5, sz-1, sz-1, sz*.18);
    ctx.stroke();

    // Letter
    const fontSize = CELL * .42;
    ctx.font = `900 ${fontSize}px Nunito,sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = isSel ? '#f0c060' : 'transparent';
    ctx.shadowBlur = isSel ? 10 : 0;
    ctx.fillStyle = isSel ? '#f0c060' : '#e8deff';
    ctx.fillText(letter, cx, cy + fontSize*.05);

    // Position dot on selected
    if(isLast){
      ctx.fillStyle = '#f0c060';
      ctx.beginPath();
      ctx.arc(cx, cy + sz*.28, sz*.07, 0, Math.PI*2);
      ctx.fill();
    }

    ctx.restore();
  });
}

function rRect(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

function loop(){
  drawScene();
  requestAnimationFrame(loop);
}

startGame();
</script>
</body>
</html>
