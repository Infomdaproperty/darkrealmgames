<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Star Tap</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Orbitron:wght@700;900&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#050508;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px 10px 30px;user-select:none;-webkit-user-select:none;font-family:'Orbitron',monospace;overflow-x:hidden;}
h1{font-family:'Cinzel Decorative',serif;font-size:clamp(1rem,5vw,1.8rem);background:linear-gradient(90deg,#ffd460,#00e5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.08em;margin-bottom:5px;margin-top:4px;}
.scores{display:flex;gap:12px;margin-bottom:8px;flex-wrap:wrap;justify-content:center;}
.score-box{text-align:center;background:rgba(255,255,255,.04);border:1px solid rgba(255,212,96,.18);border-radius:6px;padding:3px 12px;}
.score-label{font-size:.5rem;color:rgba(255,255,255,.3);letter-spacing:.12em;text-transform:uppercase}
.score-val{font-size:1.1rem;color:#ffd460;letter-spacing:.05em}
canvas{display:block;border-radius:6px;box-shadow:0 0 40px rgba(255,212,96,.18);cursor:crosshair;touch-action:none;}
.hint{font-size:.55rem;color:rgba(255,255,255,.18);margin-top:6px;letter-spacing:.1em;text-transform:uppercase;text-align:center;}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);z-index:100;align-items:center;justify-content:center;}
#overlay.show{display:flex}
.ov-box{background:linear-gradient(145deg,#080808,#050508);border:2px solid #ffd460;border-radius:14px;padding:28px 24px;text-align:center;max-width:260px;width:88%;box-shadow:0 0 60px rgba(255,212,96,.25);}
.ov-box h2{font-family:'Cinzel Decorative',serif;font-size:1.3rem;color:#ffd460;margin-bottom:4px}
.ov-box .ov-score{font-size:1.8rem;color:#fff;margin-bottom:4px}
.ov-box p{color:rgba(255,255,255,.35);font-size:.7rem;margin-bottom:16px;letter-spacing:.08em}
.btn{background:linear-gradient(135deg,#2a2000,#100800);border:1px solid #ffd460;border-radius:8px;color:#ffd460;font-family:'Orbitron',monospace;font-size:.8rem;font-weight:700;padding:11px 28px;cursor:pointer;letter-spacing:.08em;transition:transform .15s;}
.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div id="htp-overlay" style="position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.87);display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,sans-serif"><div style="background:#0d1117;border:2px solid #7c3aed;border-radius:18px;padding:26px 20px;max-width:320px;width:100%;text-align:center;color:#fff;box-shadow:0 0 50px rgba(124,58,237,.35)"><div style="font-size:2.2rem;margin-bottom:8px">&#127918;</div><h2 style="margin:0 0 12px;font-size:1.15rem;color:#a78bfa;letter-spacing:.02em">How to Play</h2><p style="margin:0 0 18px;font-size:.88rem;line-height:1.65;color:#cbd5e1">Tap the stars before they fade away<br>Be fast and accurate<br>Speed and difficulty increase with your score!</p><button onclick="document.getElementById('htp-overlay').remove()" style="background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:1rem;font-weight:700;cursor:pointer;width:100%;letter-spacing:.04em">&#9654; Let's Play!</button></div></div>
<h1>STAR TAP</h1>
<div class="scores">
  <div class="score-box"><div class="score-label">Score</div><div class="score-val" id="el-score">0</div></div>
  <div class="score-box"><div class="score-label">Time</div><div class="score-val" id="el-time">60</div></div>
  <div class="score-box"><div class="score-label">Combo</div><div class="score-val" id="el-combo">x1</div></div>
  <div class="score-box"><div class="score-label">Best</div><div class="score-val" id="el-best">0</div></div>
</div>
<canvas id="cv"></canvas>
<div class="hint">Tap stars before they fade!</div>
<div id="overlay">
  <div class="ov-box">
    <h2 id="ov-title">TIME UP!</h2>
    <div class="ov-score" id="ov-score">0</div>
    <p id="ov-msg">Reach for the stars!</p>
    <button class="btn" onclick="newGame()">Play Again</button>
  </div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H;
const COLORS=['#ffd460','#00e5ff','#ff4fa0','#44ff88','#cc44ff','#ff6b2d'];
let stars,particles,bgStars;
let score,combo,timeLeft,best,gameState,raf,timerInt;
let tapped=0,spawned=0;

function resize(){
  const a=Math.min(window.innerWidth-20,360);
  W=a; H=Math.round(a*1.5);
  cv.width=W; cv.height=H;
}

function newGame(){
  document.getElementById('overlay').classList.remove('show');
  resize();
  stars=[]; particles=[];
  bgStars=Array.from({length:80},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.3,twinkle:Math.random()*Math.PI*2}));
  score=0; combo=1; timeLeft=60; tapped=0; spawned=0;
  best=+(localStorage.getItem('startap_best')||0);
  gameState='playing';
  clearInterval(timerInt);
  timerInt=setInterval(()=>{
    if(gameState!=='playing')return;
    timeLeft--;
    document.getElementById('el-time').textContent=timeLeft;
    if(timeLeft<=0)endGame();
  },1000);
  updateHUD();
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
}

function updateHUD(){
  document.getElementById('el-score').textContent=score;
  document.getElementById('el-combo').textContent='x'+combo;
  document.getElementById('el-best').textContent=best;
}

function spawnParticles(x,y,col,n=8){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=Math.random()*5+2;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col,r:Math.random()*4+1});
  }
}

function spawnStar(){
  const val=Math.ceil(Math.random()*5);
  const r=14+val*4;
  const lifespan=1500+Math.random()*1500;
  const col=COLORS[Math.floor(Math.random()*COLORS.length)];
  stars.push({
    x:Math.random()*(W-r*2)+r,
    y:Math.random()*(H-r*2)+r,
    r,val,color:col,
    born:Date.now(),lifespan,
    life:1,pulse:Math.random()*Math.PI*2,alive:true
  });
  spawned++;
}

function drawStar(cx,cy,r,pts,color,alpha){
  ctx.globalAlpha=alpha;
  ctx.shadowColor=color;ctx.shadowBlur=12;
  ctx.beginPath();
  for(let i=0;i<pts*2;i++){
    const a=(i*Math.PI)/pts-Math.PI/2;
    const cr=i%2===0?r:r*0.42;
    i===0?ctx.moveTo(cx+Math.cos(a)*cr,cy+Math.sin(a)*cr):ctx.lineTo(cx+Math.cos(a)*cr,cy+Math.sin(a)*cr);
  }
  ctx.closePath();
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(0.4,color);g.addColorStop(1,color+'33');
  ctx.fillStyle=g;ctx.fill();
  ctx.shadowBlur=0;ctx.globalAlpha=1;
}

function tryTap(mx,my){
  if(gameState!=='playing')return;
  let hit=false;
  for(let i=stars.length-1;i>=0;i--){
    const s=stars[i];
    if(!s.alive)continue;
    if(Math.hypot(mx-s.x,my-s.y)<s.r+8){
      s.alive=false;
      tapped++;
      const pts=s.val*combo;
      score+=pts;
      combo=Math.min(8,combo+1);
      spawnParticles(s.x,s.y,s.color,8+s.val*2);
      updateHUD();
      if(score>best){best=score;localStorage.setItem('startap_best',best);updateHUD();}
      hit=true;
      break;
    }
  }
  if(!hit){combo=1;updateHUD();}
}

let spawnTimer=0;
function loop(){
  raf=requestAnimationFrame(loop);
  const now=Date.now();
  if(gameState==='playing'){
    spawnTimer++;
    if(spawnTimer%28===0)spawnStar();
    stars.forEach(s=>{
      if(!s.alive)return;
      const age=(now-s.born)/s.lifespan;
      s.life=1-age;
      s.pulse+=0.08;
      if(age>=1){s.alive=false;combo=1;updateHUD();}
    });
    stars=stars.filter(s=>s.alive||now-s.born<s.lifespan+500);
  }
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life-=0.025;});
  particles=particles.filter(p=>p.life>0);

  // Draw
  ctx.fillStyle='#02020a';ctx.fillRect(0,0,W,H);
  // Nebula bg
  const nb=ctx.createRadialGradient(W*.3,H*.4,10,W*.3,H*.4,H*.6);
  nb.addColorStop(0,'rgba(60,0,80,.18)');nb.addColorStop(1,'transparent');
  ctx.fillStyle=nb;ctx.fillRect(0,0,W,H);

  // Background stars
  bgStars.forEach(s=>{
    s.twinkle+=0.04;
    const a=0.2+Math.sin(s.twinkle)*0.15;
    ctx.globalAlpha=a;
    ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  });ctx.globalAlpha=1;

  // Game stars
  stars.forEach(s=>{
    if(!s.alive)return;
    const pulse=1+Math.sin(s.pulse)*0.08;
    drawStar(s.x,s.y,s.r*pulse,5,s.color,s.life);
    // Value label
    ctx.globalAlpha=s.life;
    ctx.fillStyle='#fff';ctx.font=`bold ${Math.round(s.r*.7)}px 'Orbitron',monospace`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(s.val,s.x,s.y+s.r*1.6);
    ctx.globalAlpha=1;
  });

  // Particles
  particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;

  // Combo display
  if(combo>1){
    ctx.fillStyle=`rgba(255,212,96,${0.6+Math.sin(Date.now()/150)*0.3})`;
    ctx.font=`bold ${Math.round(W*.06)}px 'Orbitron',monospace`;
    ctx.textAlign='right';ctx.textBaseline='top';
    ctx.fillText(`x${combo} COMBO`,W-10,10);
  }
}

function endGame(){
  gameState='over';
  clearInterval(timerInt);
  setTimeout(()=>{
    document.getElementById('ov-title').textContent='TIME UP!';
    document.getElementById('ov-score').textContent=score;
    document.getElementById('ov-msg').textContent=score>200?'Shooting star!':score>80?'Stargazer!':'Reach for the stars!';
    document.getElementById('overlay').classList.add('show');
  },400);
}

cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect();tryTap(e.clientX-r.left,e.clientY-r.top);});
cv.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.touches[0],r=cv.getBoundingClientRect();
  tryTap(t.clientX-r.left,t.clientY-r.top);
},{passive:false});
window.addEventListener('resize',()=>resize());
newGame();
</script>
</body>
</html>
