<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mole Bash</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Orbitron:wght@700;900&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1008;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px 10px 30px;user-select:none;-webkit-user-select:none;font-family:'Orbitron',monospace;overflow-x:hidden;}
h1{font-family:'Cinzel Decorative',serif;font-size:clamp(1rem,5vw,1.8rem);background:linear-gradient(90deg,#ffcc44,#ff8822);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.08em;margin-bottom:5px;margin-top:4px;}
.scores{display:flex;gap:12px;margin-bottom:8px;flex-wrap:wrap;justify-content:center;}
.score-box{text-align:center;background:rgba(255,255,255,.04);border:1px solid rgba(255,200,68,.15);border-radius:6px;padding:3px 14px;}
.score-label{font-size:.5rem;color:rgba(255,255,255,.3);letter-spacing:.12em;text-transform:uppercase}
.score-val{font-size:1.1rem;color:#ffcc44;letter-spacing:.05em}
canvas{display:block;border-radius:6px;box-shadow:0 0 40px rgba(255,200,68,.2);cursor:crosshair;touch-action:none;}
.hint{font-size:.55rem;color:rgba(255,255,255,.18);margin-top:6px;letter-spacing:.1em;text-transform:uppercase;text-align:center;}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);z-index:100;align-items:center;justify-content:center;}
#overlay.show{display:flex}
.ov-box{background:linear-gradient(145deg,#120a04,#0a0804);border:2px solid #ffcc44;border-radius:14px;padding:28px 24px;text-align:center;max-width:260px;width:88%;box-shadow:0 0 60px rgba(255,200,68,.3);}
.ov-box h2{font-family:'Cinzel Decorative',serif;font-size:1.3rem;color:#ffcc44;margin-bottom:4px}
.ov-box .ov-score{font-size:1.8rem;color:#fff;margin-bottom:4px}
.ov-box p{color:rgba(255,255,255,.35);font-size:.7rem;margin-bottom:16px;letter-spacing:.08em}
.btn{background:linear-gradient(135deg,#2a1800,#1a1000);border:1px solid #ffcc44;border-radius:8px;color:#ffcc44;font-family:'Orbitron',monospace;font-size:.8rem;font-weight:700;padding:11px 28px;cursor:pointer;letter-spacing:.08em;transition:transform .15s;}
.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div id="htp-overlay" style="position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.87);display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,sans-serif"><div style="background:#0d1117;border:2px solid #7c3aed;border-radius:18px;padding:26px 20px;max-width:320px;width:100%;text-align:center;color:#fff;box-shadow:0 0 50px rgba(124,58,237,.35)"><div style="font-size:2.2rem;margin-bottom:8px">&#127820;</div><h2 style="margin:0 0 12px;font-size:1.15rem;color:#a78bfa;letter-spacing:.02em">How to Play</h2><p style="margin:0 0 18px;font-size:.88rem;line-height:1.65;color:#cbd5e1">Tap the bananas the moment they pop up<br>Smash them before they disappear!<br>More holes appear each level!</p><button onclick="document.getElementById('htp-overlay').remove()" style="background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:1rem;font-weight:700;cursor:pointer;width:100%;letter-spacing:.04em">&#9654; Let's Play!</button></div></div>
<h1>MOLE BASH</h1>
<div class="scores">
  <div class="score-box"><div class="score-label">Level</div><div class="score-val" id="el-level">1</div></div>
  <div class="score-box"><div class="score-label">Score</div><div class="score-val" id="el-score">0</div></div>
  <div class="score-box"><div class="score-label">Time</div><div class="score-val" id="el-time">30</div></div>
</div>
<canvas id="cv"></canvas>
<div class="hint">Smash the bananas before they hide!</div>
<div id="overlay">
  <div class="ov-box">
    <h2 id="ov-title">TIME UP!</h2>
    <div class="ov-score" id="ov-score">0</div>
    <p id="ov-msg">Keep smashing!</p>
    <button class="btn" onclick="newGame()">Play Again</button>
  </div>
</div>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H;
let COLS, ROWS;
let cellW, cellH, padX, padY;
let holes, score, timeLeft, gameState, raf;
let spawnTimer, spawnInterval, clockTimer, bonkEffects, level, levelFrames;

function resize(){
  const avail = Math.min(window.innerWidth-20, 360);
  W = avail; H = Math.round(W * 1.1);
  cv.width = W; cv.height = H;
  buildLayout();
}

function buildLayout(){
  const numHoles = 2 + level*2; // 4,6,8,10,...
  COLS = Math.min(Math.ceil(numHoles/2), 5);
  ROWS = Math.ceil(numHoles/COLS);
  padX = Math.round(W * 0.07);
  padY = Math.round(H * 0.07);
  cellW = Math.round((W - padX*2) / COLS);
  cellH = Math.round((H - padY*2) / ROWS);
}

function buildHoles(){
  buildLayout();
  holes = [];
  const numHoles = 2 + level*2;
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if(holes.length >= numHoles) break;
      holes.push({
        col:c, row:r,
        cx: padX + c*cellW + cellW/2,
        cy: padY + r*cellH + cellH/2 + cellH*0.1,
        mole: null
      });
    }
  }
}

function newGame(){
  document.getElementById('overlay').classList.remove('show');
  level = 1;
  score = 0;
  startLevel();
}

function startLevel(){
  resize();
  timeLeft = 30;
  spawnTimer = 0;
  clockTimer = 0;
  levelFrames = 0;
  bonkEffects = [];
  spawnInterval = Math.max(55, 110 - level*5);
  buildHoles();
  updateHUD();
  gameState = 'playing';
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
}

function updateHUD(){
  document.getElementById('el-score').textContent = score;
  document.getElementById('el-time').textContent = timeLeft;
  document.getElementById('el-level').textContent = level;
}

function spawnBanana(){
  const empty = holes.filter(h=>!h.mole);
  if(empty.length === 0) return;
  const count = Math.random()<(0.2+level*0.04)?2:1;
  for(let i=0;i<count;i++){
    if(empty.length===0) break;
    const idx = Math.floor(Math.random()*empty.length);
    const h = empty.splice(idx,1)[0];
    const dur = Math.max(28, 95 - level*7);
    h.mole = {timer:0, duration:dur, hit:false, squish:0, popAnim:0};
  }
}

function hitHole(hx, hy){
  holes.forEach(h=>{
    if(!h.mole || h.mole.hit) return;
    const dx = hx-h.cx, dy = hy-h.cy;
    const rr = cellW*0.32;
    if(dx*dx+dy*dy < rr*rr){
      h.mole.hit = true;
      h.mole.squish = 1;
      score += 10; updateHUD();
      bonkEffects.push({x:h.cx,y:h.cy-cellH*0.25,life:1,text:'SPLAT!',col:'#FFD700'});
    }
  });
}

function loop(){
  raf = requestAnimationFrame(loop);
  if(gameState === 'playing'){
    clockTimer++;
    if(clockTimer >= 60){
      clockTimer = 0;
      timeLeft--;
      updateHUD();
      if(timeLeft <= 0){
        gameState = 'levelend';
        setTimeout(levelUp, 400);
      }
    }
    spawnTimer++;
    if(spawnTimer >= spawnInterval){
      spawnTimer = 0;
      spawnBanana();
    }
    holes.forEach(h=>{
      if(!h.mole) return;
      h.mole.timer++;
      h.mole.popAnim = Math.min(1, h.mole.popAnim + 0.11);
      if(h.mole.squish > 0) h.mole.squish -= 0.07;
      if(h.mole.hit && h.mole.timer > 18) h.mole = null;
      else if(!h.mole.hit && h.mole.timer > h.mole.duration){
        h.mole = null;
        score = Math.max(0, score-5);
        updateHUD();
        bonkEffects.push({x:h.cx,y:h.cy-cellH*0.25,life:1,text:'-5',col:'#ff4444'});
      }
    });
    bonkEffects.forEach(b=>{b.y-=1;b.life-=0.035;});
    bonkEffects=bonkEffects.filter(b=>b.life>0);
  }
  draw();
}

function levelUp(){
  if(score < 10){
    // Not enough score - game over
    document.getElementById('ov-title').textContent='GAME OVER';
    document.getElementById('ov-score').textContent=score;
    document.getElementById('ov-msg').textContent='Level '+level+' - keep smashing!';
    document.getElementById('overlay').classList.add('show');
  } else {
    level++;
    bonkEffects.push({x:W/2, y:H/2, life:2.5, text:'LEVEL '+level+'!', col:'#ffcc44', big:true});
    setTimeout(()=>startLevel(), 1500);
  }
}

function drawBanana(h){
  const pop = h.mole.popAnim;
  const squish = h.mole.squish;
  const my = h.cy - pop * cellH * 0.36;
  const scaleX = 1 + squish*0.25;
  const scaleY = 1 - squish*0.35;
  ctx.save();
  ctx.translate(h.cx, my);
  ctx.scale(scaleX, scaleY);
  // Clip to hole
  ctx.beginPath();
  ctx.ellipse(0, 0, cellW*0.3, cellH*0.32, 0, 0, Math.PI*2);
  ctx.clip();

  if(h.mole.hit){
    // Smashed banana
    ctx.fillStyle = '#8B6500';
    ctx.beginPath();
    ctx.ellipse(0, cellH*0.02, cellW*0.26, cellH*0.24, 0, 0, Math.PI*2);
    ctx.fill();
    // Yellow chunks flying out
    ctx.fillStyle = '#FFD700';
    for(let i=0;i<6;i++){
      const a = i/6*Math.PI*2 + h.mole.timer*0.15;
      const dist = 0.3 + Math.min(h.mole.timer/8, 1)*0.3;
      ctx.beginPath();
      ctx.ellipse(Math.cos(a)*cellW*dist*0.5, Math.sin(a)*cellH*dist*0.4, cellW*0.07, cellH*0.05, a, 0, Math.PI*2);
      ctx.fill();
    }
  } else {
    // Banana body - curved yellow shape
    ctx.fillStyle = '#FFE000';
    ctx.strokeStyle = '#CC9900';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    // Left curve (outer)
    ctx.moveTo(-cellW*0.1, -cellH*0.26);
    ctx.bezierCurveTo(
      cellW*0.26, -cellH*0.2,
      cellW*0.26, cellH*0.14,
      cellW*0.06, cellH*0.26
    );
    // Inner curve back
    ctx.bezierCurveTo(
      cellW*0.08, cellH*0.1,
      cellW*0.06, -cellH*0.08,
      -cellW*0.1, -cellH*0.26
    );
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // Brown tip top
    ctx.fillStyle = '#5C3A1E';
    ctx.beginPath();
    ctx.arc(-cellW*0.1, -cellH*0.26, cellW*0.055, 0, Math.PI*2);
    ctx.fill();
    // Brown tip bottom
    ctx.beginPath();
    ctx.arc(cellW*0.07, cellH*0.26, cellW*0.055, 0, Math.PI*2);
    ctx.fill();
    // Eyes (cute face)
    ctx.fillStyle = '#3A1A00';
    ctx.beginPath();ctx.arc(cellW*0.04, -cellH*0.07, cellW*0.028, 0, Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cellW*0.14, -cellH*0.1, cellW*0.028, 0, Math.PI*2);ctx.fill();
    // Eye shine
    ctx.fillStyle='rgba(255,255,255,.8)';
    ctx.beginPath();ctx.arc(cellW*0.05, -cellH*0.085, cellW*0.011, 0, Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cellW*0.15, -cellH*0.113, cellW*0.011, 0, Math.PI*2);ctx.fill();
    // Smile
    ctx.strokeStyle='#5C3A1E';ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.arc(cellW*0.09, cellH*0.04, cellW*0.055, 0, Math.PI);
    ctx.stroke();
  }
  ctx.restore();
}

function draw(){
  ctx.fillStyle = '#1a1008';
  ctx.fillRect(0,0,W,H);
  const gradG = ctx.createLinearGradient(0,0,0,H);
  gradG.addColorStop(0,'#1a1008');
  gradG.addColorStop(1,'#0d0803');
  ctx.fillStyle = gradG;
  ctx.fillRect(0,0,W,H);

  holes.forEach(h=>{
    ctx.fillStyle = 'rgba(0,0,0,.7)';
    ctx.beginPath();
    ctx.ellipse(h.cx, h.cy, cellW*0.35, cellH*0.18, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#3a2010';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(h.cx, h.cy, cellW*0.33, cellH*0.17, 0, 0, Math.PI*2);
    ctx.stroke();
    if(h.mole) drawBanana(h);
  });

  bonkEffects.forEach(b=>{
    ctx.globalAlpha=Math.min(b.life, 1);
    ctx.fillStyle=b.col||'#FFD700';
    const sz = b.big ? Math.round(W*0.1) : Math.round(W*0.07);
    ctx.font=`bold ${sz}px 'Orbitron',monospace`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor=b.col||'#FFD700';ctx.shadowBlur=12;
    ctx.fillText(b.text,b.x,b.y);
    ctx.shadowBlur=0;
  });
  ctx.globalAlpha=1;
  ctx.textAlign='left';
}

cv.addEventListener('click',e=>{
  if(gameState!=='playing') return;
  const r=cv.getBoundingClientRect();
  hitHole(e.clientX-r.left, e.clientY-r.top);
});
cv.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(gameState!=='playing') return;
  const r=cv.getBoundingClientRect();
  Array.from(e.changedTouches).forEach(t=>hitHole(t.clientX-r.left,t.clientY-r.top));
},{passive:false});
window.addEventListener('resize',()=>{if(gameState==='playing'){resize();}});

newGame();
</script>
</body>
</html>
