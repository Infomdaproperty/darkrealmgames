<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mole Bash</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Orbitron:wght@700;900&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1008;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px 10px 30px;user-select:none;-webkit-user-select:none;font-family:'Orbitron',monospace;overflow-x:hidden;}
h1{font-family:'Cinzel Decorative',serif;font-size:clamp(1rem,5vw,1.8rem);background:linear-gradient(90deg,#ffcc44,#ff8822);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.08em;margin-bottom:5px;margin-top:4px;}
.scores{display:flex;gap:12px;margin-bottom:8px;}
.score-box{text-align:center;background:rgba(255,255,255,.04);border:1px solid rgba(255,200,68,.15);border-radius:6px;padding:3px 14px;}
.score-label{font-size:.5rem;color:rgba(255,255,255,.3);letter-spacing:.12em;text-transform:uppercase}
.score-val{font-size:1.1rem;color:#ffcc44;letter-spacing:.05em}
canvas{display:block;border-radius:6px;box-shadow:0 0 40px rgba(255,200,68,.2);cursor:crosshair;touch-action:none;}
.hint{font-size:.55rem;color:rgba(255,255,255,.18);margin-top:6px;letter-spacing:.1em;text-transform:uppercase;text-align:center;}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);z-index:100;align-items:center;justify-content:center;}
#overlay.show{display:flex}
.ov-box{background:linear-gradient(145deg,#120a04,#0a0804);border:2px solid #ffcc44;border-radius:14px;padding:28px 24px;text-align:center;max-width:260px;width:88%;box-shadow:0 0 60px rgba(255,200,68,.3);}
.ov-box h2{font-family:'Cinzel Decorative',serif;font-size:1.3rem;color:#ffcc44;margin-bottom:4px}
.ov-box .ov-score{font-size:1.8rem;color:#fff;margin-bottom:4px}
.ov-box p{color:rgba(255,255,255,.35);font-size:.7rem;margin-bottom:16px;letter-spacing:.08em}
.btn{background:linear-gradient(135deg,#2a1800,#1a1000);border:1px solid #ffcc44;border-radius:8px;color:#ffcc44;font-family:'Orbitron',monospace;font-size:.8rem;font-weight:700;padding:11px 28px;cursor:pointer;letter-spacing:.08em;transition:transform .15s;}
.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div id="htp-overlay" style="position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.87);display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,sans-serif"><div style="background:#0d1117;border:2px solid #7c3aed;border-radius:18px;padding:26px 20px;max-width:320px;width:100%;text-align:center;color:#fff;box-shadow:0 0 50px rgba(124,58,237,.35)"><div style="font-size:2.2rem;margin-bottom:8px">&#127918;</div><h2 style="margin:0 0 12px;font-size:1.15rem;color:#a78bfa;letter-spacing:.02em">How to Play</h2><p style="margin:0 0 18px;font-size:.88rem;line-height:1.65;color:#cbd5e1">Tap the moles the moment they pop up<br>Be fast - they disappear quickly!<br>Bash as many as you can!</p><button onclick="document.getElementById('htp-overlay').remove()" style="background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:1rem;font-weight:700;cursor:pointer;width:100%;letter-spacing:.04em">&#9654; Let's Play!</button></div></div>
<h1>MOLE BASH</h1>
<div class="scores">
  <div class="score-box"><div class="score-label">Score</div><div class="score-val" id="el-score">0</div></div>
  <div class="score-box"><div class="score-label">Time</div><div class="score-val" id="el-time">60</div></div>
</div>
<canvas id="cv"></canvas>
<div class="hint">Click / tap the moles before they hide!</div>
<div id="overlay">
  <div class="ov-box">
    <h2 id="ov-title">TIME UP!</h2>
    <div class="ov-score" id="ov-score">0</div>
    <p id="ov-msg">Keep bashing!</p>
    <button class="btn" onclick="newGame()">Play Again</button>
  </div>
</div>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H;

const COLS = 3, ROWS = 3;
let cellW, cellH, padX, padY;
let holes, score, timeLeft, gameState, raf;
let spawnTimer = 0, spawnInterval = 80;
let clockTimer = 0;
let bonkEffects = [];

function resize(){
  const avail = Math.min(window.innerWidth-20, 360);
  W = avail; H = Math.round(W * 1.1);
  cv.width = W; cv.height = H;
  padX = Math.round(W * 0.08);
  padY = Math.round(H * 0.06);
  cellW = Math.round((W - padX*2) / COLS);
  cellH = Math.round((H - padY*2) / ROWS);
}

function newGame(){
  document.getElementById('overlay').classList.remove('show');
  resize();
  score = 0; timeLeft = 60; gameState = 'playing';
  spawnTimer = 0; spawnInterval = 80; clockTimer = 0;
  bonkEffects = [];
  holes = [];
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      holes.push({
        col:c, row:r,
        cx: padX + c*cellW + cellW/2,
        cy: padY + r*cellH + cellH/2 + cellH*0.1,
        mole: null
      });
    }
  }
  updateHUD();
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
}

function updateHUD(){
  document.getElementById('el-score').textContent = score;
  document.getElementById('el-time').textContent = timeLeft;
}

function spawnMole(){
  const empty = holes.filter(h=>!h.mole);
  if(empty.length === 0) return;
  const count = Math.random()<0.3?2:1;
  for(let i=0;i<count;i++){
    if(empty.length===0) break;
    const idx = Math.floor(Math.random()*empty.length);
    const h = empty.splice(idx,1)[0];
    const dur = Math.max(30, 60 - Math.floor((60-timeLeft)/10)*5);
    h.mole = {timer:0, duration:dur, hit:false, squish:0, popAnim:0};
  }
}

function hitHole(hx, hy){
  holes.forEach(h=>{
    if(!h.mole || h.mole.hit) return;
    const dx = hx-h.cx, dy = hy-h.cy;
    const rr = cellW*0.3;
    if(dx*dx+dy*dy < rr*rr){
      h.mole.hit = true;
      h.mole.squish = 1;
      score += 10; updateHUD();
      bonkEffects.push({x:h.cx,y:h.cy-cellH*0.25,life:1,text:'BONK!'});
    }
  });
}

function loop(){
  raf = requestAnimationFrame(loop);

  if(gameState === 'playing'){
    // Clock
    clockTimer++;
    if(clockTimer >= 60){
      clockTimer = 0;
      timeLeft--;
      updateHUD();
      if(timeLeft <= 0){
        gameState = 'over';
        setTimeout(()=>{
          document.getElementById('ov-title').textContent='TIME UP!';
          document.getElementById('ov-score').textContent=score;
          document.getElementById('ov-msg').textContent=score>200?'Master Basher!':score>100?'Nice bashing!':'Keep bashing!';
          document.getElementById('overlay').classList.add('show');
        },400);
      }
    }

    // Spawn
    spawnTimer++;
    if(spawnTimer >= spawnInterval){
      spawnTimer = 0;
      spawnInterval = Math.max(40, 80 - Math.floor((60-timeLeft)/8)*5);
      spawnMole();
    }

    // Update moles
    holes.forEach(h=>{
      if(!h.mole) return;
      h.mole.timer++;
      h.mole.popAnim = Math.min(1, h.mole.popAnim + 0.12);
      if(h.mole.squish > 0) h.mole.squish -= 0.08;
      if(h.mole.hit && h.mole.timer > 15) h.mole = null;
      else if(!h.mole.hit && h.mole.timer > h.mole.duration){
        // Miss - penalise
        h.mole = null;
        score = Math.max(0, score-5);
        updateHUD();
        bonkEffects.push({x:h.cx,y:h.cy-cellH*0.25,life:1,text:'-5',col:'#ff4444'});
      }
    });

    bonkEffects.forEach(b=>{b.y-=1;b.life-=0.04;});
    bonkEffects=bonkEffects.filter(b=>b.life>0);
  }

  draw();
}

function draw(){
  // BG
  ctx.fillStyle = '#1a1008';
  ctx.fillRect(0,0,W,H);

  // Grass strip
  const gradG = ctx.createLinearGradient(0,0,0,H);
  gradG.addColorStop(0,'#1a1008');
  gradG.addColorStop(1,'#0d0803');
  ctx.fillStyle = gradG;
  ctx.fillRect(0,0,W,H);

  // Draw holes and moles
  holes.forEach(h=>{
    // Hole shadow ellipse
    ctx.fillStyle = 'rgba(0,0,0,.7)';
    ctx.beginPath();
    ctx.ellipse(h.cx, h.cy, cellW*0.35, cellH*0.18, 0, 0, Math.PI*2);
    ctx.fill();

    // Hole rim
    ctx.strokeStyle = '#3a2010';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(h.cx, h.cy, cellW*0.33, cellH*0.17, 0, 0, Math.PI*2);
    ctx.stroke();

    // Mole
    if(h.mole){
      const pop = h.mole.popAnim;
      const squish = h.mole.squish;
      const my = h.cy - pop * cellH * 0.38;
      const scaleX = 1 + squish * 0.3;
      const scaleY = 1 - squish * 0.4;

      ctx.save();
      ctx.translate(h.cx, my);
      ctx.scale(scaleX, scaleY);

      // Clip to above-hole
      ctx.beginPath();
      ctx.ellipse(0, 0, cellW*0.28, cellH*0.3, 0, 0, Math.PI*2);
      ctx.clip();

      // Body
      ctx.fillStyle = h.mole.hit?'#aa7733':'#cc9944';
      ctx.beginPath();
      ctx.ellipse(0, 0, cellW*0.26, cellH*0.3, 0, 0, Math.PI*2);
      ctx.fill();

      // Face
      ctx.fillStyle = '#ffddaa';
      ctx.beginPath();
      ctx.ellipse(0, -cellH*0.04, cellW*0.18, cellH*0.2, 0, 0, Math.PI*2);
      ctx.fill();

      // Eyes
      ctx.fillStyle = '#220000';
      ctx.beginPath();ctx.arc(-cellW*0.06,-cellH*0.07,cellW*0.035,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(cellW*0.06,-cellH*0.07,cellW*0.035,0,Math.PI*2);ctx.fill();
      // Eye shine
      ctx.fillStyle='rgba(255,255,255,.8)';
      ctx.beginPath();ctx.arc(-cellW*0.05,-cellH*0.08,cellW*0.012,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(cellW*0.07,-cellH*0.08,cellW*0.012,0,Math.PI*2);ctx.fill();

      // Nose
      ctx.fillStyle='#cc4444';
      ctx.beginPath();ctx.ellipse(0,-cellH*0.01,cellW*0.04,cellH*0.025,0,0,Math.PI*2);ctx.fill();

      // Smile or squished frown
      ctx.strokeStyle='#774422';ctx.lineWidth=2;
      ctx.beginPath();
      if(h.mole.hit){
        ctx.arc(0,cellH*0.05,cellW*0.06,0,Math.PI);
      } else {
        ctx.arc(0,cellH*0.08,cellW*0.06,Math.PI,0);
      }
      ctx.stroke();

      // Stars when hit
      if(h.mole.hit){
        ctx.fillStyle='#ffff00';
        for(let i=0;i<4;i++){
          const ang=i/4*Math.PI*2+h.mole.timer*0.2;
          const sx=Math.cos(ang)*cellW*0.3, sy=Math.sin(ang)*cellH*0.25;
          ctx.beginPath();ctx.arc(sx,sy,3,0,Math.PI*2);ctx.fill();
        }
      }

      ctx.restore();
    }
  });

  // Bonk effects
  bonkEffects.forEach(b=>{
    ctx.globalAlpha=b.life;
    ctx.fillStyle=b.col||'#ffff00';
    ctx.font=`bold ${Math.round(W*0.07)}px 'Orbitron',monospace`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor=b.col||'#ffff00';ctx.shadowBlur=10;
    ctx.fillText(b.text,b.x,b.y);
    ctx.shadowBlur=0;
  });
  ctx.globalAlpha=1;
  ctx.textAlign='left';
}

cv.addEventListener('click',e=>{
  if(gameState!=='playing') return;
  const r=cv.getBoundingClientRect();
  hitHole(e.clientX-r.left, e.clientY-r.top);
});
cv.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(gameState!=='playing') return;
  const r=cv.getBoundingClientRect();
  Array.from(e.changedTouches).forEach(t=>hitHole(t.clientX-r.left,t.clientY-r.top));
},{passive:false});
window.addEventListener('resize',resize);

newGame();
</script>
</body>
</html>
