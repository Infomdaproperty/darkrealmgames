<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dino Jump</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Orbitron:wght@700;900&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#050508;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px 10px 30px;user-select:none;-webkit-user-select:none;font-family:'Orbitron',monospace;overflow-x:hidden;}
h1{font-family:'Cinzel Decorative',serif;font-size:clamp(1rem,5vw,1.8rem);background:linear-gradient(90deg,#44ff88,#00ccaa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.08em;margin-bottom:6px;margin-top:4px;}
.scores{display:flex;gap:16px;margin-bottom:8px;}
.score-box{text-align:center;background:rgba(255,255,255,.04);border:1px solid rgba(68,255,136,.12);border-radius:6px;padding:3px 14px;}
.score-label{font-size:.5rem;color:rgba(255,255,255,.3);letter-spacing:.12em;text-transform:uppercase}
.score-val{font-size:1.1rem;color:#44ff88;letter-spacing:.05em}
canvas{display:block;border-radius:6px;box-shadow:0 0 40px rgba(68,255,136,.18),0 0 2px rgba(68,255,136,.3);touch-action:none;cursor:pointer;}
.hint{font-size:.55rem;color:rgba(255,255,255,.18);margin-top:6px;letter-spacing:.1em;text-transform:uppercase;text-align:center;}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);z-index:100;align-items:center;justify-content:center;}
#overlay.show{display:flex}
.ov-box{background:linear-gradient(145deg,#060614,#04040a);border:2px solid #44ff88;border-radius:14px;padding:28px 24px;text-align:center;max-width:260px;width:88%;box-shadow:0 0 60px rgba(68,255,136,.25);}
.ov-box h2{font-family:'Cinzel Decorative',serif;font-size:1.3rem;color:#44ff88;margin-bottom:4px}
.ov-box .ov-score{font-size:1.8rem;color:#fff;margin-bottom:4px}
.ov-box p{color:rgba(255,255,255,.35);font-size:.7rem;margin-bottom:16px;letter-spacing:.08em}
.btn{background:linear-gradient(135deg,#003318,#001a0c);border:1px solid #44ff88;border-radius:8px;color:#44ff88;font-family:'Orbitron',monospace;font-size:.8rem;font-weight:700;padding:11px 28px;cursor:pointer;letter-spacing:.08em;transition:transform .15s;}
.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div id="htp-overlay" style="position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.87);display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,sans-serif"><div style="background:#0d1117;border:2px solid #7c3aed;border-radius:18px;padding:26px 20px;max-width:320px;width:100%;text-align:center;color:#fff;box-shadow:0 0 50px rgba(124,58,237,.35)"><div style="font-size:2.2rem;margin-bottom:8px">&#127918;</div><h2 style="margin:0 0 12px;font-size:1.15rem;color:#a78bfa;letter-spacing:.02em">How to Play</h2><p style="margin:0 0 18px;font-size:.88rem;line-height:1.65;color:#cbd5e1">Tap or Space to jump<br>Tap again mid-air for a double jump<br>Avoid all the obstacles!</p><button onclick="document.getElementById('htp-overlay').remove()" style="background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:1rem;font-weight:700;cursor:pointer;width:100%;letter-spacing:.04em">&#9654; Let's Play!</button></div></div>
<h1>DINO JUMP</h1>
<div class="scores">
  <div class="score-box"><div class="score-label">Score</div><div class="score-val" id="el-score">0</div></div>
  <div class="score-box"><div class="score-label">Best</div><div class="score-val" id="el-best">0</div></div>
</div>
<canvas id="cv"></canvas>
<div class="hint">Space / tap to jump (double-jump allowed)</div>
<div id="overlay">
  <div class="ov-box">
    <h2>GAME OVER</h2>
    <div class="ov-score" id="ov-score">0</div>
    <p id="ov-msg">Watch out for obstacles!</p>
    <button class="btn" onclick="newGame()">Play Again</button>
  </div>
</div>
<script>
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
let W,H,GROUND;
const DINO_W=28, GRAVITY=0.55, JUMP_V=-11;
let dino, obstacles, clouds, particles, score, best, speed, spawnTimer, spawnInterval, gameState, raf, lastTime=0;

function resize(){
  const avail=Math.min(window.innerWidth-20,380);
  W=avail; H=Math.round(W*0.6);
  GROUND=H-30;
  cv.width=W; cv.height=H;
}

function newGame(){
  document.getElementById('overlay').classList.remove('show');
  resize();
  dino={x:50, y:GROUND-DINO_W, vy:0, jumps:0, alive:true};
  obstacles=[]; particles=[];
  clouds=Array.from({length:4},()=>({x:Math.random()*W, y:Math.random()*H*0.4+10, w:40+Math.random()*40, speed:0.4+Math.random()*0.3}));
  score=0; best=+(localStorage.getItem('dino_best')||0);
  speed=2.5; spawnTimer=0; spawnInterval=90;
  gameState='idle';
  updateHUD();
  cancelAnimationFrame(raf); lastTime=0;
  raf=requestAnimationFrame(loop);
}

function updateHUD(){
  document.getElementById('el-score').textContent=score;
  document.getElementById('el-best').textContent=best;
}

function jump(){
  if(gameState==='idle'){ gameState='playing'; return; }
  if(gameState!=='playing') return;
  if(dino.jumps<2){
    dino.vy=JUMP_V-(dino.jumps*1.5);
    dino.jumps++;
    for(let i=0;i<6;i++){ const a=Math.PI+Math.random()*Math.PI; particles.push({x:dino.x+DINO_W/2,y:dino.y+DINO_W,vx:Math.cos(a)*2,vy:Math.sin(a)*2+1,life:1,r:2}); }
  }
}

function spawnObstacle(){
  const h=14+Math.floor(Math.random()*3)*10;
  const w=10+Math.floor(Math.random()*3)*5;
  obstacles.push({x:W+w, y:GROUND-h, w, h});
}

function loop(ts){
  raf=requestAnimationFrame(loop);
  const dt=ts-lastTime; lastTime=ts;

  if(gameState==='playing'){
    // Dino
    dino.vy+=GRAVITY;
    dino.y+=dino.vy;
    if(dino.y>=GROUND-DINO_W){ dino.y=GROUND-DINO_W; dino.vy=0; dino.jumps=0; }

    // Obstacles
    spawnTimer++;
    if(spawnTimer>=spawnInterval){
      spawnObstacle();
      spawnTimer=0;
      spawnInterval=Math.max(50, 90-score*0.3);
    }
    obstacles.forEach(o=>o.x-=speed);
    obstacles=obstacles.filter(o=>o.x+o.w>-10);

    // Score
    score++;
    speed=2.5+score*0.003;
    if(score%100===0) updateHUD();

    // Collision
    obstacles.forEach(o=>{
      if(dino.x+DINO_W-4>o.x&&dino.x+4<o.x+o.w&&dino.y+DINO_W-4>o.y&&dino.y+4<o.y+o.h){
        dino.alive=false; gameState='dead';
        for(let i=0;i<16;i++){const a=Math.random()*Math.PI*2;particles.push({x:dino.x+DINO_W/2,y:dino.y+DINO_W/2,vx:Math.cos(a)*4,vy:Math.sin(a)*4,life:1,r:3,col:'#ff4444'});}
        if(score>best){ best=score; localStorage.setItem('dino_best',best); }
        setTimeout(()=>{
          document.getElementById('ov-score').textContent=score;
          document.getElementById('ov-msg').textContent=score>=500?'Prehistoric champion!':score>=200?'Great run!':'Watch out for rocks!';
          document.getElementById('overlay').classList.add('show');
        },600);
      }
    });
  }

  // Clouds
  clouds.forEach(c=>{ c.x-=c.speed; if(c.x+c.w<0) c.x=W+c.w; });
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life-=0.03; });
  particles=particles.filter(p=>p.life>0);

  // Draw
  ctx.fillStyle='#050508'; ctx.fillRect(0,0,W,H);

  // Stars
  if(!cv._stars) cv._stars=Array.from({length:30},()=>({x:Math.random()*W,y:Math.random()*H*0.6,r:Math.random()+.3}));
  cv._stars.forEach(s=>{ ctx.fillStyle='rgba(255,255,255,.25)'; ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill(); });

  // Clouds
  clouds.forEach(c=>{
    ctx.fillStyle='rgba(255,255,255,.04)';
    ctx.beginPath(); ctx.ellipse(c.x+c.w/2, c.y, c.w/2, 10, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(c.x+c.w/3, c.y-7, c.w/3, 8, 0, 0, Math.PI*2); ctx.fill();
  });

  // Ground
  ctx.strokeStyle='rgba(68,255,136,.3)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(W,GROUND); ctx.stroke();

  // Obstacles (cactus-like rocks)
  obstacles.forEach(o=>{
    ctx.shadowColor='#88aaff'; ctx.shadowBlur=6;
    const g=ctx.createLinearGradient(o.x,o.y,o.x+o.w,o.y+o.h);
    g.addColorStop(0,'#5566cc'); g.addColorStop(1,'#334488');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.roundRect(o.x,o.y,o.w,o.h,3); ctx.fill();
    ctx.strokeStyle='rgba(136,170,255,.4)'; ctx.lineWidth=1; ctx.stroke();
    ctx.shadowBlur=0;
  });

  // Dino
  if(dino.alive||particles.length>0){
    if(dino.alive){
      const dy=dino.y, dx=dino.x;
      ctx.shadowColor='#44ff88'; ctx.shadowBlur=12;
      // Body
      ctx.fillStyle='#44ff88';
      ctx.beginPath(); ctx.roundRect(dx+4,dy+6,DINO_W-8,DINO_W-8,4); ctx.fill();
      // Head
      ctx.beginPath(); ctx.roundRect(dx+8,dy,DINO_W-10,16,4); ctx.fill();
      // Eye
      ctx.fillStyle='#050508'; ctx.beginPath(); ctx.arc(dx+DINO_W-8,dy+5,3,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#44ff88'; ctx.beginPath(); ctx.arc(dx+DINO_W-8,dy+5,1.5,0,Math.PI*2); ctx.fill();
      // Legs (animated)
      const legFrame=Math.floor(Date.now()/80)%2;
      ctx.fillStyle='#2acc66';
      if(dino.jumps===0){
        ctx.fillRect(dx+5,dy+DINO_W-8+legFrame*3,6,8-legFrame*3);
        ctx.fillRect(dx+DINO_W-11,dy+DINO_W-8+(1-legFrame)*3,6,8-(1-legFrame)*3);
      } else {
        ctx.fillRect(dx+4,dy+DINO_W-4,8,4);
        ctx.fillRect(dx+DINO_W-12,dy+DINO_W-4,8,4);
      }
      ctx.shadowBlur=0;
    }
  }

  // Particles
  particles.forEach(p=>{ ctx.globalAlpha=p.life; ctx.fillStyle=p.col||'#44ff88'; ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill(); });
  ctx.globalAlpha=1;

  // HUD score
  ctx.fillStyle='rgba(68,255,136,.6)';
  ctx.font=`bold ${Math.round(W*.06)}px 'Orbitron',monospace`;
  ctx.textAlign='right'; ctx.textBaseline='top';
  ctx.fillText(score, W-10, 8);

  // Idle
  if(gameState==='idle'){
    ctx.fillStyle='rgba(68,255,136,.6)';
    ctx.font=`${Math.round(W*.04)}px 'Orbitron',monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('TAP TO START', W/2, H/2-10);
  }
}

document.addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); jump(); } });
cv.addEventListener('click',jump);
cv.addEventListener('touchstart',e=>{ e.preventDefault(); jump(); },{passive:false});
window.addEventListener('resize',()=>{ resize(); });
newGame();
</script>
</body>
</html>
