<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Frogger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Orbitron:wght@700;900&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#050508;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px 10px 30px;user-select:none;-webkit-user-select:none;font-family:'Orbitron',monospace;overflow-x:hidden;}
h1{font-family:'Cinzel Decorative',serif;font-size:clamp(1rem,5vw,1.8rem);background:linear-gradient(90deg,#44ff44,#00cc88);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.08em;margin-bottom:6px;margin-top:4px;}
.scores{display:flex;gap:16px;margin-bottom:8px;}
.score-box{text-align:center;background:rgba(255,255,255,.04);border:1px solid rgba(68,255,68,.12);border-radius:6px;padding:3px 14px;}
.score-label{font-size:.5rem;color:rgba(255,255,255,.3);letter-spacing:.12em;text-transform:uppercase}
.score-val{font-size:1.1rem;color:#44ff44;letter-spacing:.05em}
canvas{display:block;border-radius:6px;box-shadow:0 0 40px rgba(68,255,68,.18),0 0 2px rgba(68,255,68,.3);touch-action:none;}
.hint{font-size:.55rem;color:rgba(255,255,255,.18);margin-top:6px;letter-spacing:.1em;text-transform:uppercase;text-align:center;}
#btns{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:8px;}
.btn-row{display:flex;gap:4px;}
.ctrl-btn{width:50px;height:50px;border-radius:8px;border:1px solid rgba(68,255,68,.4);background:rgba(68,255,68,.08);color:#44ff44;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-tap-highlight-color:transparent;}
.ctrl-btn:active{background:rgba(68,255,68,.25);}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);z-index:100;align-items:center;justify-content:center;}
#overlay.show{display:flex}
.ov-box{background:linear-gradient(145deg,#060614,#04040a);border:2px solid #44ff44;border-radius:14px;padding:28px 24px;text-align:center;max-width:260px;width:88%;box-shadow:0 0 60px rgba(68,255,68,.25);}
.ov-box h2{font-family:'Cinzel Decorative',serif;font-size:1.3rem;color:#44ff44;margin-bottom:4px}
.ov-box .ov-score{font-size:1.8rem;color:#fff;margin-bottom:4px}
.ov-box p{color:rgba(255,255,255,.35);font-size:.7rem;margin-bottom:16px;letter-spacing:.08em}
.btn{background:linear-gradient(135deg,#003300,#001a00);border:1px solid #44ff44;border-radius:8px;color:#44ff44;font-family:'Orbitron',monospace;font-size:.8rem;font-weight:700;padding:11px 28px;cursor:pointer;letter-spacing:.08em;transition:transform .15s;}
.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<h1>FROGGER</h1>
<div class="scores">
  <div class="score-box"><div class="score-label">Score</div><div class="score-val" id="el-score">0</div></div>
  <div class="score-box"><div class="score-label">Lives</div><div class="score-val" id="el-lives">3</div></div>
  <div class="score-box"><div class="score-label">Time</div><div class="score-val" id="el-time">30</div></div>
</div>
<canvas id="cv"></canvas>
<div class="hint">Arrow keys or buttons below to hop</div>
<div id="btns">
  <div class="btn-row"><div class="ctrl-btn" id="btn-up" ontouchstart="hop(0,-1)" onclick="hop(0,-1)">&#8593;</div></div>
  <div class="btn-row">
    <div class="ctrl-btn" id="btn-left" ontouchstart="hop(-1,0)" onclick="hop(-1,0)">&#8592;</div>
    <div class="ctrl-btn" id="btn-down" ontouchstart="hop(0,1)" onclick="hop(0,1)">&#8595;</div>
    <div class="ctrl-btn" id="btn-right" ontouchstart="hop(1,0)" onclick="hop(1,0)">&#8594;</div>
  </div>
</div>
<div id="overlay">
  <div class="ov-box">
    <h2 id="ov-title">GAME OVER</h2>
    <div class="ov-score" id="ov-score">0</div>
    <p id="ov-msg">Watch the traffic!</p>
    <button class="btn" onclick="newGame()">Play Again</button>
  </div>
</div>
<script>
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
let W,H,CS,COLS,ROWS;

// Lane config: row 0=top (lily pads), rows 1-5=river, rows 6=safe, rows 7-11=road, row 12=start
const CAR_COLORS=['#ff4444','#ff8800','#ffee00','#00aaff','#ff00aa'];
const LOG_COL='#8b5a2b';

let frog, lanes, pads, score, lives, timeLeft, timerId, particles, gameState, raf;

function resize(){
  const avail=Math.min(window.innerWidth-20, 380);
  COLS=10; ROWS=13;
  CS=Math.floor(avail/COLS);
  W=CS*COLS; H=CS*ROWS;
  cv.width=W; cv.height=H;
}

function makeLanes(){
  // Rows 1-5 = river (logs), rows 7-11 = road (cars)
  const lanes=[];
  const dirs=[1,-1,1,-1,1];
  const speeds=[0.8,1.2,1.0,1.4,0.9];
  // River logs (rows 5 to 1 from bottom, i.e. ROWS-8 to ROWS-12)
  for(let i=0;i<5;i++){
    const row=ROWS-8-i; // rows 5,4,3,2,1 from top
    const spd=speeds[i]*CS*0.012*(0.8+Math.random()*0.4);
    const objs=[];
    const logW=CS*(2+Math.floor(Math.random()*2));
    for(let j=0;j<3;j++) objs.push({x:j*(W/3+CS)+Math.random()*CS, y:row*CS+2, w:logW, h:CS-4, col:LOG_COL, type:'log'});
    lanes.push({row, dir:dirs[i], speed:spd, objs, type:'river'});
  }
  // Safe row
  lanes.push({row:ROWS-7, type:'safe', objs:[]});
  // Road cars (rows 7-11)
  for(let i=0;i<5;i++){
    const row=ROWS-2-i;
    const spd=speeds[i]*CS*0.015*(0.8+Math.random()*0.5);
    const objs=[];
    const carW=CS*(1+Math.floor(Math.random()*2));
    for(let j=0;j<3;j++) objs.push({x:j*(W/3)+Math.random()*CS, y:row*CS+4, w:carW, h:CS-8, col:CAR_COLORS[i%CAR_COLORS.length], type:'car'});
    lanes.push({row, dir:dirs[i]*-1, speed:spd, objs, type:'road'});
  }
  return lanes;
}

function makePads(){
  const pads=[];
  const slots=[1,2,4,7,9];
  slots.forEach(c=> pads.push({col:c, filled:false}));
  return pads;
}

function spawnParticles(x,y,col){
  for(let i=0;i<10;i++){const a=Math.random()*Math.PI*2,s=Math.random()*3+1;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col,r:2});}
}

function newGame(){
  document.getElementById('overlay').classList.remove('show');
  resize();
  lanes=makeLanes(); pads=makePads(); particles=[];
  score=0; lives=3; timeLeft=30;
  frog={col:Math.floor(COLS/2), row:ROWS-1, riding:null, dead:false};
  gameState='playing';
  clearInterval(timerId);
  timerId=setInterval(()=>{ if(gameState==='playing'){ timeLeft--; if(timeLeft<=0) die(); updateHUD(); } },1000);
  updateHUD();
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
}

function updateHUD(){
  document.getElementById('el-score').textContent=score;
  document.getElementById('el-lives').textContent=lives;
  document.getElementById('el-time').textContent=timeLeft;
}

function hop(dx,dy){
  if(gameState!=='playing'||frog.dead) return;
  const nr=frog.row+dy, nc=frog.col+dx;
  if(nr<0||nr>=ROWS||nc<0||nc>=COLS) return;
  frog.row=nr; frog.col=nc; frog.riding=null;
  spawnParticles(frog.col*CS+CS/2, frog.row*CS+CS/2,'#44ff44');

  // Reached top row
  if(frog.row===0){
    const pad=pads.find(p=>p.col===frog.col&&!p.filled);
    if(pad){ pad.filled=true; score+=100; timeLeft=30; updateHUD();
      frog={col:Math.floor(COLS/2),row:ROWS-1,riding:null,dead:false};
      if(pads.every(p=>p.filled)){
        pads=makePads(); score+=500; updateHUD();
      }
    } else { die(); }
  }
}

function die(){
  if(frog.dead) return;
  frog.dead=true;
  spawnParticles(frog.col*CS+CS/2,frog.row*CS+CS/2,'#ff4444');
  lives--;
  updateHUD();
  if(lives<=0){
    gameState='over';
    clearInterval(timerId);
    setTimeout(()=>{
      document.getElementById('ov-title').textContent='GAME OVER';
      document.getElementById('ov-score').textContent=score;
      document.getElementById('ov-msg').textContent=score>=500?'Road legend!':score>=200?'Nice hopping!':'Watch the traffic!';
      document.getElementById('overlay').classList.add('show');
    },500);
  } else {
    setTimeout(()=>{ frog={col:Math.floor(COLS/2),row:ROWS-1,riding:null,dead:false}; timeLeft=30; updateHUD(); },800);
  }
}

function loop(){
  raf=requestAnimationFrame(loop);

  if(gameState==='playing'&&!frog.dead){
    // Move lane objects
    lanes.forEach(lane=>{
      lane.objs.forEach(o=>{
        o.x+=lane.dir*lane.speed;
        if(lane.dir>0&&o.x>W) o.x=-o.w;
        if(lane.dir<0&&o.x+o.w<0) o.x=W;
      });
    });

    // Check frog collision
    const fx=frog.col*CS, fy=frog.row*CS, fw=CS, fh=CS;
    let onLog=false;
    lanes.forEach(lane=>{
      if(lane.type==='river'&&lane.row===frog.row){
        let riding=false;
        lane.objs.forEach(o=>{
          if(fx+fw*0.2>o.x&&fx+fw*0.8<o.x+o.w&&fy+fh*0.2>o.y-2&&fy+fh*0.8<o.y+o.h+2){
            riding=true; onLog=true;
            if(frog.riding!==o){frog.riding=o;}
          }
        });
        if(!riding&&lane.type==='river') {
          // Check if truly in river row (not just passing through)
          die();
        }
      }
      if(lane.type==='road'&&lane.row===frog.row){
        lane.objs.forEach(o=>{
          if(fx+fw*0.15<o.x+o.w&&fx+fw*0.85>o.x&&fy+fh*0.15<o.y+o.h&&fy+fh*0.85>o.y){ die(); }
        });
      }
    });

    // Ride log
    if(frog.riding){
      const laneForRiding=lanes.find(l=>l.objs.includes(frog.riding));
      if(laneForRiding){ frog.col=Math.round((frog.riding.x+CS/2)/CS); frog.col=Math.max(0,Math.min(COLS-1,frog.col)); }
    }
  }

  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.life-=0.03; });
  particles=particles.filter(p=>p.life>0);

  // Draw
  ctx.fillStyle='#050508'; ctx.fillRect(0,0,W,H);

  // Top pads
  ctx.fillStyle='#002200';
  ctx.fillRect(0,0,W,CS);
  pads.forEach(p=>{
    ctx.shadowColor=p.filled?'#00ff44':'#006600'; ctx.shadowBlur=8;
    ctx.fillStyle=p.filled?'#00ff44':'#006600';
    ctx.beginPath(); ctx.ellipse(p.col*CS+CS/2, CS/2, CS*0.4, CS*0.35, 0, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  });

  // River
  ctx.fillStyle='#000c22';
  ctx.fillRect(0,CS,W,CS*5);
  ctx.fillStyle='rgba(0,100,255,.1)'; ctx.fillRect(0,CS,W,CS*5);

  // Safe row
  ctx.fillStyle='#111118'; ctx.fillRect(0,CS*6,W,CS);

  // Road
  ctx.fillStyle='#111122'; ctx.fillRect(0,CS*7,W,CS*5);
  for(let r=7;r<12;r++){
    ctx.strokeStyle='rgba(255,255,0,.06)'; ctx.lineWidth=1; ctx.setLineDash([CS/2,CS/2]);
    ctx.beginPath();ctx.moveTo(0,r*CS+CS/2);ctx.lineTo(W,r*CS+CS/2);ctx.stroke();
    ctx.setLineDash([]);
  }

  // Start row
  ctx.fillStyle='#111118'; ctx.fillRect(0,CS*12,W,CS);

  // Lane objects
  lanes.forEach(lane=>{
    lane.objs.forEach(o=>{
      if(o.type==='log'){
        ctx.shadowColor='#8b5a2b'; ctx.shadowBlur=4;
        ctx.fillStyle=LOG_COL;
        ctx.beginPath(); ctx.roundRect(o.x,o.y,o.w,o.h,4); ctx.fill();
        ctx.fillStyle='rgba(255,200,100,.15)';
        ctx.fillRect(o.x+2,o.y+2,o.w-4,4);
        ctx.shadowBlur=0;
      } else {
        ctx.shadowColor=o.col; ctx.shadowBlur=6;
        const g=ctx.createLinearGradient(o.x,o.y,o.x,o.y+o.h);
        g.addColorStop(0,o.col); g.addColorStop(1,o.col+'88');
        ctx.fillStyle=g;
        ctx.beginPath(); ctx.roundRect(o.x,o.y,o.w,o.h,3); ctx.fill();
        ctx.shadowBlur=0;
      }
    });
  });

  // Frog
  if(!frog.dead){
    const fx2=frog.col*CS, fy2=frog.row*CS;
    ctx.shadowColor='#44ff44'; ctx.shadowBlur=12;
    ctx.fillStyle='#44ff44';
    // Body
    ctx.beginPath(); ctx.ellipse(fx2+CS/2,fy2+CS/2,CS*0.33,CS*0.3,0,0,Math.PI*2); ctx.fill();
    // Eyes
    ctx.fillStyle='#88ffaa';
    ctx.beginPath(); ctx.arc(fx2+CS*0.3,fy2+CS*0.3,CS*0.1,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(fx2+CS*0.7,fy2+CS*0.3,CS*0.1,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#050508';
    ctx.beginPath(); ctx.arc(fx2+CS*0.3,fy2+CS*0.3,CS*0.05,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(fx2+CS*0.7,fy2+CS*0.3,CS*0.05,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }

  // Particles
  particles.forEach(p=>{ ctx.globalAlpha=p.life; ctx.fillStyle=p.col; ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill(); });
  ctx.globalAlpha=1;
}

document.addEventListener('keydown',e=>{
  if(e.code==='ArrowUp'){e.preventDefault();hop(0,-1);}
  if(e.code==='ArrowDown'){e.preventDefault();hop(0,1);}
  if(e.code==='ArrowLeft'){e.preventDefault();hop(-1,0);}
  if(e.code==='ArrowRight'){e.preventDefault();hop(1,0);}
});
window.addEventListener('resize',()=>{ resize(); });
newGame();
</script>
</body>
</html>
